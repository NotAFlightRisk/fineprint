# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Lockdown Privacy
icon: lockdown-privacy.png
checked: 2026-10-22

criteria:
  identity:
    website:
      value: https://lockdownprivacy.com
      sources: [home]
    legal_entity:
      value: Celestian Golden Apps SL
      note: >-
        The App Store seller since mid-2025, and its policy is the one the listing links. The website's terms, last
        updated in 2023, still name Confirmed Technologies, LLC.
      sources: [app-store, borme-2023, terms]
    owner:
      value: null
      note: >-
        The Madrid register names Newry Global Media SL as Celestian's sole administrator, which doesn't show who owns
        it. Lockdown's About page still says Appex Group owns it, but Appex no longer lists the app.
      sources: [borme-2023, about, appex]
    founded:
      value: 2019
      note: Lockdown and its Secure Tunnel launched in 2019, on the Confirmed VPN servers that went public in 2018.
      sources: [oo-report, confirmed-about]
    team:
      value: partial
      note: >-
        Neither Lockdown nor Celestian names anyone. The Madrid register names the administrator company's
        representative, Félix Sánchez Echevarría.
      sources: [borme-2023, datoscif]
    sister_brands:
      value: []
      note: Celestian's other apps are wallpaper, font, cleaner, meditation and menu apps, none of them VPNs.
      sources: [celestian-apps]
    acquisitions:
      value:
        - date: 2025-06-01
          acquirer: Celestian Golden Apps
          source: app-store-2025-06
        - date: 2023-02-23
          acquirer: Appex Group
          source: appex-blog
      note: >-
        Confirmed's sale to Appex was announced in February 2023. No later sale was announced, but the App Store seller
        changed from Confirmed, Inc. to Celestian between 4 May and 15 June 2025, so that date is approximate.
      sources: [appex-blog, app-store-2025-05, app-store-2025-06]

  jurisdiction:
    hq:
      value: ES
      sources: [borme-2023, celestian-legal]
    entities:
      value: [ES]
      note: >-
        The website's 2023 terms and VPN policy name the US companies Confirmed Technologies, LLC and Confirmed, Inc.,
        and it's unclear whether they're still involved.
      sources: [borme-2023, terms, confirmed-privacy]

  logging:
    traffic:
      value: none
      evidence: claimed
      note: >-
        Per Confirmed VPN's 2023 policy, which Lockdown's site still links, bar anti-abuse rule hits kept without your
        IP. The App Store now links Celestian's generic app policy, which doesn't mention the VPN.
      sources: [privacy, confirmed-privacy, celestian-privacy]
    dns:
      value: none
      evidence: claimed
      note: Confirmed's 2023 policy says no website data is stored for any period.
      sources: [confirmed-privacy]
    timestamps:
      value: null
      note: >-
        Confirmed's policy doesn't mention connection times. Celestian's app policy collects when you log in and time
        spent in the app, kept for as long as it's needed.
      sources: [confirmed-privacy, celestian-privacy]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: A running total of data used over the last 30 days, to throttle heavy users.
      sources: [confirmed-privacy]
    source_ip:
      value: null
      note: >-
        Confirmed's 2023 policy says real IPs aren't logged, but Celestian's app policy, the one the App Store links,
        lists IP addresses among the data it collects. Which applies to the VPN isn't clear.
      sources: [confirmed-privacy, celestian-privacy]
    proven:
      value: [audit]
      evidence: verified
      note: >-
        Engineers and one firm checked Confirmed's no-logging claims and AWS setup between 2018 and 2020, using
        an audit kit Confirmed created. Nothing has been checked since the app changed hands in 2023 and 2025.
      sources: [oo-report, audit-2020-lerman, audit-2018-factor13]
    policy:
      value: https://lockdownprivacy.com/privacy
      sources: [privacy]

  transparency:
    audits:
      value:
        - date: 2020-08-11
          auditor: Ryan Koven
          scope: infra
          source: audit-2020-koven
        - date: 2020-08-10
          auditor: Jeff Lerman
          scope: infra
          source: audit-2020-lerman
        - date: 2019-06-11
          auditor: Kevin Chen
          scope: infra
          source: audit-2019-chen
        - date: 2018-12-06
          auditor: Factor13 LLC
          scope: infra
          source: audit-2018-factor13
        - date: 2018-11-21
          auditor: Ryan Koven
          scope: infra
          source: audit-2018-koven
      evidence: verified
      note: >-
        All of the Confirmed VPN servers Secure Tunnel runs on, by engineers and one firm working through
        Confirmed's own audit kit. A 2021 OpenAudit of the app is now behind a login, and the audit Appex promised
        in 2023 never appeared.
      sources: [oo-report, openaudit-blog, appex-blog]
    report:
      value: none
      sources: [privacy]
    canary:
      value: none
      sources: [privacy]
    bug_bounty:
      value: false
      note: Neither Lockdown nor Celestian publishes a bounty or a security.txt.
      sources: [home, celestian-legal]
    incidents:
      value: []

  account:
    email:
      value: optional
      note: The VPN is bought in the app through Apple. An account with an email is only needed to share it across devices.
      sources: [faq]
    personal_data:
      value: []
      sources: [celestian-privacy]
    payment:
      value: [app_store]
      note: Only sold through in-app purchases on the App Store.
      sources: [secure-tunnel, subscription-code]

  security:
    protocols:
      value: [ikev2]
      note: From the app's code up to version 2.3, the last one published.
      sources: [vpn-code]
    post_quantum:
      value: none
      note: The published code uses an IKEv2 key exchange on the P-256 curve (group 19).
      sources: [vpn-code]
    kill_switch:
      value: none
      note: Not offered. The published code reconnects on demand but doesn't block traffic while the tunnel is down.
      sources: [vpn-code]
    dns:
      value: third_party
      note: >-
        In the published code, the firewall that runs alongside the VPN sends every lookup to Cloudflare's
        DNS-over-HTTPS resolver.
      sources: [dnscrypt-config]

  infra:
    ram_only:
      value: null
      note: Lockdown doesn't say whether its servers run from RAM.
      sources: [secure-tunnel]
    hosting:
      value: rented
      note: Amazon Web Services instances.
      sources: [oo-report, aws-ranges]
    virtual_locations:
      value: none
      note: Each of the 13 regions in the app resolves to an AWS address in the matching AWS region.
      sources: [regions-code, aws-ranges]
    servers:
      value: null
      note: Lockdown doesn't give a server count, only regions.
      sources: [secure-tunnel]
    countries:
      value: 12
      note: 13 regions, with two in the US.
      sources: [secure-tunnel, regions-code]

  features:
    connections:
      value: null
      note: >-
        No limit is stated. The Pro plan covers all your Apple devices, and the FAQ says one account can be shared
        with family.
      sources: [faq, paywall-code]
    multihop:
      value: false
      sources: [secure-tunnel]
    obfuscation:
      value: []
      sources: [secure-tunnel, vpn-code]
    port_forwarding:
      value: false
      sources: [secure-tunnel]
    split_tunnel:
      value: null
      note: >-
        The FAQ says whitelisted domains bypass both the firewall and the tunnel, but the published code only shows
        them skipping the firewall, and there's no per-app choice.
      sources: [faq, firewall-code]
    blocking:
      value: [ads, trackers, malware]
      note: An on-device firewall. The advanced ad and malware lists need a subscription.
      sources: [firewall-page, paywall-code]

  clients:
    platforms:
      value: [ios]
      note: >-
        iPhone and iPad, and it runs on Vision Pro. The website still links a Mac app the App Store no longer
        lists.
      sources: [app-store, home, mac-lookup]
    open_source:
      value: none
      note: >-
        The iOS app's GPL code on GitHub stops at version 2.3 from March 2025. The releases since, one of which added
        performance monitoring tools, aren't published.
      sources: [github-commits, app-store]
    telemetry:
      value: null
      note: >-
        The App Store label declares analytics, crash data and identifiers used to track you, though the site's
        firewall policy says there are no analytics. Nothing says whether it can be turned off.
      sources: [app-store, privacy]
    trackers:
      value: null
      note: There's no Android app.
      sources: [home]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 12.99, currency: USD }
      note: The US App Store price for Secure Tunnel plus the advanced firewall. There's no pricing page.
      sources: [app-store]
    best:
      value: { amount: 5, currency: USD }
      note: >-
        $59.99 a year. Pro, sold as covering all your Apple devices, is $14.99 a month. Time-limited in-app offers go
        as low as $39.99 a year.
      sources: [app-store, subscription-code]
    best_term:
      value: 12
      sources: [subscription-code]
    renewal_increase:
      value: 0
      sources: [app-store]
    free_tier:
      value: false
      note: The basic firewall is free, but Secure Tunnel needs a subscription after its free trial.
      sources: [home, secure-tunnel]
    refund_days:
      value: null
      note: It's only sold through the App Store, so refunds follow Apple's process.
      sources: [apple-refund]

  ethics:
    misleading_claims:
      value: true
      note: >-
        The listing still calls it "the only VPN to prove its Privacy Policy and be fully audited" and "100% open
        source", though the audits are from 2020 and the current app's code isn't published.
      sources: [app-store, github-commits]
    affiliates:
      value: null
      note: Lockdown doesn't say whether it pays anyone for sign-ups.
    review_sites:
      value: false
      note: Its Privacy Review site grades the trackers in popular apps, not VPNs.
      sources: [privacy-review]
    activism:
      value: false
      note: >-
        Confirmed created Openly Operated and published tracking research up to 2021. There's been nothing since the
        2023 sale.
      sources: [blog, att-study]

