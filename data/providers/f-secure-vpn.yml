# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: F-Secure VPN
icon: f-secure-vpn.svg
checked: 2026-10-21

criteria:
  identity:
    website:
      value: https://www.f-secure.com/en/vpn
      sources: [home]
    legal_entity:
      value: F-Secure Corporation
      note: Sales in F-Secure's web store go through the reseller Cleverbridge GmbH.
      sources: [privacy, store]
    owner:
      value: null
      note: >-
        F-Secure Corporation has no parent company and is listed on Nasdaq Helsinki. Its largest
        shareholder is co-founder Risto Siilasmaa, with 34.36% on 30 September 2026.
      sources: [about, shareholders]
    founded:
      value: 2014
      note: Launched as F-Secure FREEDOME. F-Secure's own timeline lists FREEDOME under both 2013 and 2014.
      sources: [story]
    team:
      value: public
      note: A listed company whose board and CEO are named on its investor and company pages.
      sources: [board, story]
    sister_brands:
      value: []
      note: The VPN is also bundled into F-Secure Total, under the same name.
      sources: [home]
    acquisitions:
      value: []
      note: >-
        In a 2022 partial demerger the consumer business, VPN included, was split into a new
        F-Secure Corporation listed on Nasdaq Helsinki, and the old company was renamed WithSecure.
        It was split off rather than sold, so it isn't counted as changing hands.
      sources: [story]

  jurisdiction:
    hq:
      value: FI
      sources: [privacy]
    entities:
      value: [FI]
      note: The privacy notice names only F-Secure Corporation in Helsinki, and mentions group companies without naming them.
      sources: [privacy]

  logging:
    traffic:
      value: none
      evidence: claimed
      note: >-
        It says it keeps no logs of connections to external addresses, but it scans traffic and
        collects the web addresses it blocks. Newer app versions run on an unnamed third-party
        provider that processes the same data.
      sources: [privacy, home]
    dns:
      value: null
      note: The DNS help page defers to the privacy notice, which doesn't mention DNS lookups.
      sources: [help-dns, privacy]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: Connection timestamps and session lengths are kept for 90 days to deal with abuse.
      sources: [privacy]
    bandwidth:
      value: 'yes'
      evidence: claimed
      note: The amount of data transferred in each session is kept for 90 days.
      sources: [privacy]
    source_ip:
      value: 'yes'
      evidence: claimed
      note: Your public IP and hostname are kept in session logs for 90 days, and your IP in provisioning logs for a year.
      sources: [privacy]
    proven:
      value: []
      note: No independent audit, court case or seizure has tested the logging policy.
      sources: [security, privacy]
    policy: https://www.f-secure.com/en/legal/privacy/total

  transparency:
    audits:
      value: []
      note: F-Secure says it holds ISO 27001 certification, but no audit of the VPN has been published.
      sources: [security]
    report:
      value: none
      note: The privacy notice says it answers lawful warrants and court orders, but no figures are published.
      sources: [privacy]
    canary:
      value: none
      sources: [privacy]
    bug_bounty:
      value: true
      note: F-Secure says it runs a bug bounty programme open to the public.
      sources: [security]
    incidents:
      value:
        - date: 2019-01-15
          summary: >-
            Finland's police seized FREEDOME logs for one IP address at Germany's request, including a
            device ID, connection times and data used. F-Secure went to court to get the seizure
            quashed and the data destroyed, and won in May 2019 and again on appeal in October 2020.
          handled: well
          source: seizure-2019

  account:
    email:
      value: required
      note: Every user needs a My F-Secure account, trial included.
      sources: [home, store]
    personal_data:
      value: [name]
      note: The web store asks for a first and last name.
      sources: [store]
    payment:
      value: [card, paypal, app_store]
      sources: [store, help-buy]

  security:
    protocols:
      value: [openvpn, ikev2, wireguard, other]
      note: >-
        The older app uses OpenVPN and IPSec/IKEv2, the newer one Hydra, WireGuard and IPSec. Hydra
        belongs to the third-party provider behind the newer app.
      sources: [privacy, help-encryption]
    post_quantum:
      value: none
      note: Not mentioned on the product page or in the help guide.
      sources: [help-encryption, help-what]
    kill_switch:
      value: app
      note: Windows, Mac and Android only. On by default on Android.
      sources: [home, help-killswitch]
    dns:
      value: first_party
      sources: [help-dns]

  infra:
    ram_only:
      value: null
      note: Not mentioned on the product page, in the help guide or in the privacy notice.
      sources: [help-what, privacy]
    hosting:
      value: null
      note: Not stated. The BitTorrent help page says some gateways are hosted by US-based companies.
      sources: [help-bittorrent]
    virtual_locations:
      value: none
      evidence: claimed
      note: F-Secure calls every server location a virtual location, but says the app connects directly to the server in each one.
      sources: [help-locations, help-direct]
    servers:
      value: null
      note: No server count is published.
      sources: [help-locations]
    countries:
      value: 24
      note: The help guide lists 24 countries, the product page says over 20.
      sources: [help-locations, home]

  features:
    connections:
      value: 5
      note: The plans on sale cover 1, 3 or 5 devices.
      sources: [home]
    multihop:
      value: false
      sources: [help-direct]
    obfuscation:
      value: []
      note: Not mentioned on the product page or in the help guide.
      sources: [help-encryption, help-what]
    port_forwarding:
      value: false
      note: Not mentioned on the product page or in the help guide.
      sources: [help-buy, help-bittorrent]
    split_tunnel:
      value: true
      note: Apps can bypass the VPN on Android. Windows and Android can also skip the VPN on trusted Wi-Fi networks.
      sources: [help-split, home]
    blocking:
      value: [trackers, malware]
      sources: [help-tracking, help-what]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      sources: [home]
    open_source:
      value: none
      sources: [home]
    telemetry:
      value: null
      note: >-
        The privacy notice collects analytics on installs, performance, connections and features
        used, and says identifiable analytics can be turned off in the app, without saying whether
        it's on by default.
      sources: [privacy]
    fdroid:
      value: false
      note: Sold through F-Secure's site, Google Play and the App Store only.
      sources: [help-buy]

  pricing:
    monthly:
      value: null
      note: Only one and two year plans are sold.
      sources: [home]
    best:
      value: { amount: 6.04, currency: EUR }
      note: >-
        Prices from the global English page including VAT, for 5 devices at €144.99 for two years.
        One device is €89.99 for two years. The US page charges in USD at different prices.
      sources: [home, home-us]
    best_term:
      value: 24
      sources: [home]
    renewal_increase:
      value: 0
      note: The store says the subscription renews at the price shown in the cart.
      sources: [store]
    free_tier:
      value: false
      note: Only a free trial, which the product page gives as 30 days in one place and 5 in another.
      sources: [home]
    refund_days:
      value: 30
      sources: [home, store]

  ethics:
    misleading_claims:
      value: true
      note: >-
        The Google Play listing calls it "like an anonymous proxy" that "hides your tracks", while
        session logs with your IP are kept for 90 days.
      sources: [play, privacy]
    affiliates:
      value: true
      note: Up to 30% commission, run through Cleverbridge.
      sources: [affiliates]
    review_sites:
      value: false
      sources: [about]
    activism:
      value: false
      sources: [about]

