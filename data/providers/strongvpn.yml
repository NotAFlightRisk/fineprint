# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: StrongVPN
icon: strongvpn.png
checked: 2026-10-27

criteria:
  identity:
    website: https://strongvpn.com
    legal_entity:
      value: Strong Technology, LLC
      sources: [tos, privacy-policy, zd-subsidiaries]
    owner:
      value: Ziff Davis
      note: A US listed company, called J2 Global until October 2021.
      sources: [zd-10k-2025, zd-subsidiaries]
    founded:
      value: 2005
      sources: [aboutus]
    team:
      value: partial
      note: >-
        Its site names no one who runs StrongVPN, but its owner Ziff Davis is a listed company with
        named executives.
      sources: [aboutus, zd-10k-2025]
    sister_brands:
      value: [IPVanish]
      note: >-
        Encrypt.me, another Ziff Davis VPN, is being folded into StrongVPN and sends new customers
        there. ibVPN's site now redirects to a StrongVPN page that moves its users over.
      sources: [zd-10k-2025, encrypt-me, welcome-ibvpn]
    acquisitions:
      value:
        - date: 2019-01-01
          acquirer: J2 Global
          source: zd-subsidiaries-2019
      note: >-
        Only the year is known. Strong Technology, LLC joined J2 Global's subsidiaries during 2019,
        and J2 renamed itself Ziff Davis in 2021.
      sources: [zd-subsidiaries-2019, zd-10k-2025]

  jurisdiction:
    hq:
      value: US
      sources: [subpoenas, tos]
    entities:
      value: [US]
      note: Strong Technology, LLC is registered in Florida. Its EU representative is J2 Global Ireland, a sister company.
      sources: [zd-subsidiaries, privacy-policy]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy-policy, logs-faq]
    dns:
      value: none
      evidence: claimed
      sources: [privacy-policy]
    timestamps:
      value: none
      evidence: claimed
      sources: [logs-faq]
    bandwidth:
      value: none
      evidence: claimed
      sources: [logs-faq, privacy-policy]
    source_ip:
      value: none
      evidence: claimed
      sources: [logs-faq]
    proven: []
    policy: https://strongvpn.com/privacy-policy/

  transparency:
    audits: []
    report:
      value: none
      sources: [subpoenas]
    canary:
      value: none
      sources: [subpoenas]
    bug_bounty:
      value: false
      note: Reports go through Ziff Davis's disclosure programme on Bugcrowd, which pays no rewards.
      sources: [vdp, bugcrowd]
    incidents: []

  account:
    email:
      value: required
      sources: [privacy-policy]
    personal_data:
      value: []
      note: Signup asks for an email. Card payments also take the cardholder's name and billing address.
      sources: [privacy-policy]
    payment:
      value: [card, paypal, app_store]
      note: Also Alipay. There's no crypto or cash option.
      sources: [payment-methods]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, other]
      note: Other is the older Cisco-style IPSec, kept for legacy devices.
      sources: [protocols]
    post_quantum:
      value: none
      sources: [protocols]
    kill_switch:
      value: app
      note: >-
        A setting in the Windows and macOS apps, and on macOS only with OpenVPN or L2TP. The mobile
        apps don't have one.
      sources: [kill-switch]
    dns:
      value: first_party
      sources: [dns-leaks]

  infra:
    ram_only:
      value: null
      note: StrongVPN doesn't say whether its servers run from RAM.
      sources: [zero-logging]
    hosting:
      value: owned
      evidence: claimed
      note: It also counts Highwinds and StackPath addresses, IPVanish's former owners, as part of its network.
      sources: [zero-logging, why, dns-leaks]
    virtual_locations:
      value: disclosed
      note: Its server list labels the India location as virtual.
      sources: [locations, geolocation]
    servers:
      value: 950
      note: It says 950+, without a count per location.
      sources: [plans]
    countries:
      value: 30
      note: Its own server list, which still includes legacy PPTP servers, names 41 countries.
      sources: [plans, locations]

  features:
    connections:
      value: 12
      sources: [tos, devices]
    multihop:
      value: false
      sources: [home]
    obfuscation:
      value: [proprietary]
      note: Scramble, a patch that disguises OpenVPN traffic, in every app but iOS.
      sources: [protocols, best-protocol]
    port_forwarding:
      value: false
      sources: [port-forwarding]
    split_tunnel:
      value: true
      note: In the Android and Fire TV apps.
      sources: [split-tunnel, android-features]
    blocking:
      value: []
      sources: [home]

  clients:
    platforms:
      value: [windows, macos, ios, android, linux_cli]
      note: >-
        Also Fire TV. Linux gets a WireGuard script with an optional basic GUI, and
        routers are set up with installer scripts or by hand.
      sources: [plans, linux, routers]
    open_source:
      value: none
      sources: [tos]
    telemetry:
      value: null
      note: >-
        The policy names Sentry for Windows app diagnostics and Firebase for the Android, Fire TV and
        Apple apps, without saying whether you can turn them off.
      sources: [privacy-policy, play]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 11.99, currency: USD }
      sources: [plans]
    best:
      value: { amount: 3.97, currency: USD }
      note: The annual plan's $47.69 covers the first year only.
      sources: [plans]
    best_term:
      value: 12
      sources: [min-term]
    renewal_increase:
      value: null
      note: The annual plan's $47.69 is a first-year price, and the renewal price isn't published.
      sources: [plans, tos]
    free_tier:
      value: false
      sources: [plans]
    refund_days:
      value: 30
      note: On annual plans only.
      sources: [guarantee, tos]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It promises to keep your activity anonymous and calls itself one of the few VPNs that can
        promise zero logging.
      sources: [zero-logging]
    affiliates:
      value: true
      note: It offers affiliates up to 200% commission.
      sources: [press]
    review_sites:
      value: true
      note: >-
        Ziff Davis also owns tech review sites including PCMag, CNET, Mashable and ZDNET. PCMag's
        StrongVPN review discloses the link.
      sources: [zd-10k-2025, pcmag-review]
    activism: false

