    title: Cloudbric VPN page under the Cloudbric Corp. name (Wayback, May 2022)
  vpn-privacy:
    url: https://www.cloudbric.com/vpn-privacy-policy/
    title: Cloudbric VPN privacy policy, revised version from 23 November 2026 at the top
  vpn-terms:
