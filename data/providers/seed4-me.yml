# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Seed4.Me
icon: seed4-me.png
checked: 2026-10-28

criteria:
  identity:
    website:
      value: https://seed4.me
      sources: [home]
    legal_entity:
      value: S4M Tech, Inc.
      note: >-
        The terms only say Seed4.Me and fall under Delaware law. The company gives an address in Dover,
        Delaware, and a hidden block in the site's code names Global Bridge LLC of Bishkek, Kyrgyzstan.
      sources: [home, play, app-store, terms, invitations]
    owner:
      value: null
      note: Who owns S4M Tech, Inc. isn't published.
      sources: [about, play]
    founded:
      value: 2013
      note: It opened as an invite-only VPN club in January 2013 and became an open service in December 2017.
      sources: [about]
    team:
      value: partial
      note: >-
        Co-founder Dmitry Zelenkovsky lists Seed4.Me and S4M Tech on his CV, and its macOS help names him as the
        app's login item. The site itself names nobody.
      sources: [founder-cv, macos-login, about]
    sister_brands:
      value: []
      sources: [play-developer]
    acquisitions:
      value: []
      sources: [about]

  jurisdiction:
    hq:
      value: US
      sources: [play, terms]
    entities:
      value: [US]
      sources: [play]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy, faq]
    dns:
      value: null
      note: The policy says VPN nodes keep no logs and the FAQ says browsing isn't logged, but neither mentions DNS lookups.
      sources: [privacy, faq]
    timestamps:
      value: null
      note: The policy keeps general connection logs for seven days without saying what's in them, and a 2013 post says it keeps login information for seven days. The FAQ says it keeps no connection logs.
      sources: [privacy, faq, logs-2013]
    bandwidth:
      value: null
      note: The FAQ says it collects minimal usage information to fix technical issues, without saying whether that includes data use.
      sources: [faq]
    source_ip:
      value: null
      note: The policy doesn't say whether its seven-day connection logs, which a 2013 post calls login information, include your IP address.
      sources: [privacy, logs-2013]
    proven: []
    policy: https://seed4.me/pages/privacy-policy

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: optional
      note: The apps work without registering and Google Play lists email as optional, but buying on the website needs one and the 2018 policy says it's needed to connect.
      sources: [play, play-datasafety, app-store, pricing, privacy]
    personal_data:
      value: []
      note: Card payments ask for a name and postcode for billing.
      sources: [pricing]
    payment:
      value: [card, paypal, bitcoin, other_crypto, gift_card, app_store]
      note: Bitcoin and Ether go through support for a payment link. The FAQ also lists WebMoney, Perfect Money, Yandex Money, QIWI and WeChat, which the checkout doesn't offer.
      sources: [pricing, app-store, faq]

  security:
    protocols:
      value: [openvpn]
      note: Its own build of OpenVPN with an added obfuscation layer on desktop, and OpenVPN in the Android app.
      sources: [windows-app, mac-app, apk]
    post_quantum:
      value: none
      sources: [windows-app]
    kill_switch:
      value: app
      evidence: claimed
      note: Its blog says the VPN client has a kill switch you can turn on, without saying which apps.
      sources: [kill-switch-blog]
    dns:
      value: null
      sources: [privacy]

  infra:
    ram_only:
      value: null
      sources: [locations]
    hosting:
      value: rented
      note: Server addresses built into its Android app belong to hosting firms such as Leaseweb, M247 and Vultr, and in 2016 it said it ran both virtual and physical servers.
      sources: [apk, ip-leaseweb, ip-m247, ip-vultr, tops-2016]
    virtual_locations:
      value: null
      note: It lists a China optimised cluster as a location without saying where it sits.
      sources: [locations]
    servers:
      value: null
      note: It said it had more than 200 servers in March 2022, and gives no current count.
      sources: [about]
    countries:
      value: 45
      note: Plus a cluster optimised for China.
      sources: [locations]

  features:
    connections:
      value: unlimited
      sources: [home, app-store]
    multihop:
      value: false
      sources: [home]
    obfuscation:
      value: [proprietary]
      evidence: claimed
      note: An obfuscation layer on top of OpenVPN in the desktop apps, not described further. The Android app bundles Cloak, an open source transport that dresses traffic up as visits to a website.
      sources: [windows-app, mac-app, apk]
    port_forwarding: null
    split_tunnel:
      value: true
      note: iPhone only so far, and you pick a country whose local services skip the VPN rather than choosing apps.
      sources: [split-tunnel]
    blocking:
      value: []
      sources: [home]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: Also Android TV and Amazon Fire TV.
      sources: [download, play, app-store]
    open_source:
      value: none
      sources: [download]
    telemetry:
      value: null
      note: The Android app carries Firebase Analytics and the Facebook SDK, and its store labels declare device IDs and usage data for analytics, without saying whether you can turn it off.
      sources: [apk, play-datasafety, app-store]
    fdroid:
      value: false
      sources: [download]

  pricing:
    monthly:
      value: { amount: 5, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 2.99, currency: USD }
      note: $107.55 for three years. Paying in crypto doubles the time you get.
      sources: [pricing]
    best_term:
      value: 36
      sources: [pricing]
    renewal_increase:
      value: 0
      sources: [pricing]
    free_tier:
      value: false
      note: There's a seven-day free trial in the apps.
      sources: [faq]
    refund_days:
      value: null
      note: It promises a 100% money-back guarantee with no time limit stated. The terms only refund credit you haven't yet used to extend your access.
      sources: [pricing, faq, terms]

  ethics:
    misleading_claims:
      value: true
      note: It promises to "hide IP so no one can trace you", "Surf easy and 100% anonymously online" and "absolute privacy". Its store listings say no log is kept, while the policy keeps connection logs for seven days.
      sources: [app-store, faq, play, privacy]
    affiliates:
      value: true
      sources: [affiliate, privacy]
    review_sites: false
    activism:
      value: false
      note: It offers free VPN to bloggers, politicians and journalists who ask.
      sources: [press]

