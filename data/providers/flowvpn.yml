# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: FlowVPN
icon: flowvpn.png
checked: 2026-11-04

criteria:
  identity:
    website: https://www.flowvpn.com
    legal_entity:
      value: Portable Ltd
      note: The same company is the Google Play developer and the App Store seller.
      sources: [terms, register, play, app-store]
    owner:
      value: Richard Ablewhite
      note: He owns 75% or more of Groupable Ltd, which owns 75% or more of Portable Ltd.
      sources: [register-psc, groupable-psc]
    founded:
      value: 2011
      evidence: claimed
      note: It says it has run since 2011, the year Portable Ltd was registered under its old name, BeWhere Projects Ltd.
      sources: [about, register]
    team:
      value: partial
      note: The company register names Richard Ablewhite as its only director. Nobody is named on its own site.
      sources: [register-officers]
    sister_brands:
      value: []
      note: Its terms also name client apps called Global VPN, US VPN and VPN Asia.
      sources: [terms, play-dev]
    acquisitions:
      value: []
      sources: [register-officers, register-psc]

  jurisdiction:
    hq:
      value: GB
      sources: [register]
    entities:
      value: [GB]
      sources: [register, groupable-psc]

  logging:
    traffic:
      value: null
      note: >-
        The terms say it "may monitor and record data transferred across our network" for capacity
        planning and abuse, and uses automated systems to spot BitTorrent, without saying what's kept or
        for how long.
      sources: [terms]
    dns:
      value: null
      note: The terms don't mention DNS requests.
    timestamps:
      value: 'yes'
      evidence: claimed
      note: The terms reserve the right to log session data, including connection date, time and duration.
      sources: [terms]
    bandwidth:
      value: null
      note: >-
        The terms don't list data use among what's logged, though refunds depend on less than 5 GB having
        been transferred.
      sources: [terms]
    source_ip:
      value: 'yes'
      evidence: claimed
      note: The terms say it stores the connecting IP address and port, date and time when you connect.
      sources: [terms]
    proven: []
    policy:
      value: https://www.flowvpn.com/terms-vpn/
      note: The VPN's data handling is in the terms. The separate privacy page only covers the website.
      sources: [terms, privacy]

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: optional
      note: The terms say app installs get an account name, and an email is stored once you make an account to share a plan across devices or pay by PayPal.
      sources: [terms]
    personal_data: []
    payment:
      value: [card, paypal, app_store]
      note: The terms also name PaymentWall and Amazon as payment routes.
      sources: [terms, signup]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, proprietary, other]
      note: >-
        Proprietary is FlowTCP, its WireGuard-based TCP protocol. Other is SSH, IKEv1, L2TP and PPTP. The
        Android app holds OpenVPN, IPsec and SSH, but not WireGuard.
      sources: [protocols, home, download]
    post_quantum:
      value: none
      note: Nothing is published about its key exchange.
      sources: [protocols]
    kill_switch:
      value: app
      evidence: claimed
      note: Claimed on the iOS app listing.
      sources: [app-store]
    dns:
      value: null
      note: It doesn't say whose DNS servers answer inside the tunnel.

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: null
      note: >-
        It says it built and manages its own network, while the terms say traffic crosses third-party
        servers and data is shared with server providers.
      sources: [about, play, terms]
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
    servers:
      value: 100
      note: Its claim is "100+". The Play listing says hundreds.
      sources: [about, play]
    countries:
      value: 70
      note: Its claim is "70+". The Play listing says 50.
      sources: [about, play]

  features:
    connections:
      value: 10
      note: The Play listing still says 5.
      sources: [about, download, play]
    multihop:
      value: true
      sources: [about, download]
    obfuscation:
      value: [proprietary]
      note: FlowTCP, TLS tunnels dressed as HTTPS or SMTP, and SSH, offered for networks that block VPNs.
      sources: [protocols]
    port_forwarding:
      value: false
      note: It doesn't support BitTorrent, and the terms ban peer-to-peer file sharing.
      sources: [no-bittorrent, terms]
    split_tunnel:
      value: true
      note: In the Windows app, and with OpenVPN and WireGuard on iOS and macOS.
      sources: [home, about]
    blocking:
      value: [ads]
      note: Through dedicated ad-blocking servers.
      sources: [about]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: The browser extension is for Chrome. There are also Apple TV and Amazon Fire apps, and manual setup guides for Linux and routers.
      sources: [download]
    open_source: none
    telemetry:
      value: null
      note: It doesn't say whether the apps send usage or crash data.
      sources: [privacy]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 6.99, currency: USD }
      sources: [home]
    best:
      value: { amount: 3.33, currency: USD }
      note: Billed yearly. The same 52% off "special offer", with a countdown, was on the page in both July and November 2026.
      sources: [home, home-2026-07]
    best_term:
      value: 12
      sources: [home]
    renewal_increase:
      value: null
      note: It doesn't say what the discounted yearly plan renews at.
      sources: [home]
    free_tier:
      value: false
      note: There's a 5-day free trial.
      sources: [home]
    refund_days:
      value: 0
      note: >-
        The terms rule out refunds because of the free trial, unless a sign-up page offers one, and then only
        if the account was used fewer than 10 times and under 5 GB.
      sources: [terms]

  ethics:
    misleading_claims:
      value: true
      note: >-
        The iOS listing promises a "No-Logs Policy", while the terms keep your IP address and connection
        times. Its yearly price sits behind a countdown "special offer" that was still running months later.
      sources: [app-store, terms, home, home-2026-07]
    affiliates:
      value: true
      note: Up to 25% recurring commission on sales.
      sources: [affiliate]
    review_sites: false
    activism: false

