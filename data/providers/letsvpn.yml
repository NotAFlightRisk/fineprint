# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: LetsVPN
icon: letsvpn.png
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://letsvpn.world
      sources: [home]
    legal_entity:
      value: LGN Global Tech Inc.
      note: The terms only name "the LetsVPN Team". The company selling the apps was called LetsGo Network Incorporated until June 2026.
      sources: [terms, register, play, app-store]
    owner:
      value: Hong Lei
      note: Sole director, holding over 75% of the shares since June 2021.
      sources: [register]
    founded:
      value: 2018
      note: The site was live by June 2018 with a 2017 copyright, so it may be a year older.
      sources: [site-2018, cdt-exit]
    team:
      value: partial
      note: The site names nobody, and the CEO's 2026 letter is unsigned, but Canada's register names the director.
      sources: [register, ceo-apology]
    sister_brands: []
    acquisitions:
      value: null
      note: No sale is on record. Its 2018 site named an Australian company, GALNT Event Management Pty Ltd, and the Canadian company's controlling shareholder dates from June 2021.
      sources: [site-2018, register]

  jurisdiction:
    hq:
      value: CA
      sources: [register, play]
    entities:
      value: [CA]
      sources: [register]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [terms, privacy]
    dns:
      value: none
      evidence: claimed
      sources: [terms, user-terms]
    timestamps:
      value: null
      note: The terms say it logs "access attempts" to its servers for troubleshooting, without saying what that covers or for how long.
      sources: [terms, user-terms]
    bandwidth:
      value: null
      note: Plans are billed by time with no data cap, and it doesn't say whether usage is counted.
      sources: [privacy, play]
    source_ip:
      value: null
      note: A May 2026 notice says it keeps no record of where users connect from, but both sets of terms log "access attempts" to its servers.
      sources: [billing-notice, terms, user-terms]
    proven: []
    policy: https://letsvpn.world/privacy

  transparency:
    audits:
      value:
        - date: 2026-04-09
          auditor: DEKRA
          scope: apps
          source: masa-2026
        - date: 2025-03-18
          auditor: DEKRA
          scope: apps
          source: masa-2025
        - date: 2024-01-15
          auditor: DEKRA
          scope: apps
          source: masa-2024
      evidence: verified
      note: All three are Google Play MASA checks of the Android app. Its homepage also shows an AppEsteem certificate, which isn't an audit of the VPN.
      sources: [audit-page, home]
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: none
      note: The apps work off a device ID, and an account is just a username and password with no email or phone behind it.
      sources: [help-multi-device, app-store]
    personal_data: []
    payment:
      value: [card, app_store]
      note: Also Alipay, WeChat Pay and UnionPay.
      sources: [help-payments]

  security:
    protocols:
      value: [proprietary]
      note: Its own closed protocol, with nothing published about how it works.
      sources: [play, app-store]
    post_quantum:
      value: none
      note: Nothing is published about its protocol's key exchange.
      sources: [play]
    kill_switch:
      value: null
      note: It doesn't say whether the apps have one.
      sources: [help-modes]
    dns:
      value: null
      note: It doesn't say whose DNS servers the apps use.
      sources: [help-modes]

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: null
      note: It doesn't say whether it owns or rents its servers.
    virtual_locations:
      value: null
      note: It publishes no server list, and only Platinum plans can pick a country.
      sources: [help-tiers]
    servers:
      value: null
      note: No server count is published.
    countries:
      value: null
      note: No country list is published, though Platinum plans can pick from several.
      sources: [help-tiers]

  features:
    connections:
      value: 2
      sources: [help-connections]
    multihop: false
    obfuscation:
      value: [proprietary]
      note: Its own protocol is built to get past censorship, but in April 2026 it stopped working in mainland China and the service pulled out.
      sources: [play, exit-notice]
    port_forwarding: false
    split_tunnel:
      value: null
      note: Its default smart mode decides by its own rules which traffic goes through the VPN. It doesn't say whether you can pick apps yourself.
      sources: [help-modes]
    blocking: []

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: Android covers TVs too, and there's a HarmonyOS build.
      sources: [help-download, help-harmonyos]
    open_source:
      value: none
      note: The terms forbid reverse engineering the apps.
      sources: [user-terms]
    telemetry:
      value: null
      note: The privacy policy says crash and interaction data only leave the device if you upload them, but both app stores list analytics and diagnostics collection, and its 2024 Android app shipped Firebase Analytics, Crashlytics, Umeng and AppsFlyer. Nothing says whether you can turn it off.
      sources: [privacy, user-terms, play-data-safety, app-store, apk-2024]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 6.99, currency: USD }
      note: The Bronze plan, which can't pick a server country. Platinum is $9.99 a month or $80.99 a year.
      sources: [app-store, help-tiers]
    best:
      value: { amount: 5, currency: USD }
      sources: [app-store]
    best_term:
      value: 12
      sources: [app-store]
    renewal_increase:
      value: 0
      note: Plans are flat-priced passes by the week, month, quarter or year, with no intro deal.
      sources: [app-store]
    free_tier:
      value: false
      note: New users get a free trial, given as an hour on Google Play and 72 hours on its homepage.
      sources: [play, home]
    refund_days:
      value: null
      note: The terms only say it won't accept "unreasonable" refunds, with no set window. It refunded paid time after leaving mainland China in 2026.
      sources: [user-terms, billing-notice]

  ethics:
    misleading_claims:
      value: true
      note: The homepage sells it as "the VPN that always connects", which "erases any trace" and gives your privacy "absolute protection", and presents a Play Store app check as proof of "absolute security". Its CEO promised in May 2026 to drop the "always connects" slogan, but the homepage and Play listing still use it.
      sources: [home, audit-page, exit-notice, ceo-apology, play]
    affiliates:
      value: true
      note: Promoters get up to 5 yuan per install, paid out to Alipay or a bank account.
      sources: [promoters]
    review_sites: false
    activism: false

