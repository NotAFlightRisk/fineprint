# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: TunnelBear
icon: tunnelbear.png
checked: 2026-10-21

criteria:
  identity:
    website: https://www.tunnelbear.com
    legal_entity:
      value: TunnelBear LLC
      sources: [tos]
    owner:
      value: McAfee
      note: >-
        McAfee has been privately held since March 2022 by an investor group led by Advent International
        and Permira.
      sources: [mcafee-10k-2020, mcafee-private-2022]
    founded:
      value: 2011
      note: TunnelBear said it had been running for six and a half years when McAfee bought it in 2018.
      sources: [joins-mcafee]
    team:
      value: partial
      note: Its about page lists staff by first name and last initial, with no named leadership.
      sources: [about]
    sister_brands:
      value: [McAfee VPN]
      note: >-
        McAfee's own VPN, called Safe Connect in its 2020 annual report and now sold as McAfee VPN or
        Secure VPN.
      sources: [mcafee-10k-2020, mcafee-vpn]
    acquisitions:
      value:
        - date: 2018-02-26
          acquirer: McAfee
          source: mcafee-10k-2020
      note: >-
        McAfee bought TunnelBear Inc.'s business for a $25 million purchase price, announced on 8 March
        2018. TunnelBear LLC took over from the Canadian TunnelBear Inc. later that year.
      sources: [mcafee-10k-2020, joins-mcafee, transparency-2018]

  jurisdiction:
    hq:
      value: US
      note: >-
        TunnelBear LLC is a Delaware company owned by McAfee, though it's run from Toronto and its privacy
        policy keeps your data in Canada under Canadian law.
      sources: [privacy-policy, jurisdiction-post, mcafee-subsidiaries]
    entities:
      value: [US, CA]
      note: >-
        Tunnelbear, LLC is registered in Delaware. Its recent audits were commissioned by McAfee ULC in
        Canada, where TunnelBear is run from.
      sources: [mcafee-subsidiaries, cure53-2023, transparency-2018]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy-policy]
    dns:
      value: none
      evidence: claimed
      sources: [privacy-policy]
    timestamps:
      value: aggregate
      evidence: claimed
      note: >-
        Keeps whether each account was active this month, though not when it connected, plus account and
        payment events.
      sources: [privacy-policy, transparency-2023]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: Keeps a running total of each account's data for the current month, reset monthly, to meter free plans.
      sources: [privacy-policy, transparency-2023]
    source_ip:
      value: none
      evidence: claimed
      note: It does keep a rough location, down to the city, for performance and abuse checks.
      sources: [privacy-policy]
    proven:
      value: [audit]
      evidence: verified
      note: >-
        Cure53's yearly audits test the servers' security, last in late 2024, but don't check the
        logging policy.
      sources: [audit-2024-post, cure53-2023]
    policy: https://www.tunnelbear.com/privacy-policy

  transparency:
    audits:
      value:
        - date: 2024-11-01
          auditor: Cure53
          scope: full
          source: audit-2024-post
        - date: 2023-11-12
          auditor: Cure53
          scope: full
          source: cure53-2023
        - date: 2022-11-13
          auditor: Cure53
          scope: full
          source: cure53-2022
        - date: 2021-11-28
          auditor: Cure53
          scope: full
          source: cure53-2021
        - date: 2020-10-01
          auditor: Cure53
          scope: full
          source: cure53-2020
        - date: 2019-11-17
          auditor: Cure53
          scope: full
          source: cure53-2019
        - date: 2018-06-01
          auditor: Cure53
          scope: full
          source: cure53-2018
        - date: 2017-06-01
          auditor: Cure53
          scope: full
          source: cure53-2017
        - date: 2016-12-01
          auditor: Cure53
          scope: full
          source: cure53-2017
      evidence: verified
      note: >-
        Only TunnelBear's summary of the 2024 audit is public, not the report, and the 2025 one isn't out
        yet. The 2016 and 2017 rounds share one report.
      sources: [audit-2024-post, audit-2017-post]
    report:
      value: irregular
      note: Four reports since 2018, the latest in November 2023 covering 2021 to 2023.
      sources: [transparency-2023, transparency-2018]
    canary:
      value: none
      sources: [transparency-2023]
    bug_bounty:
      value: null
      note: Its site and help centre don't mention a bug bounty or a way to report security flaws.
      sources: [help-centre]
    incidents:
      value:
        - date: 2018-04-17
          summary: >-
            VerSprite reported a Windows app flaw that let any installed program run code as SYSTEM
            (CVE-2018-10381). TunnelBear replied the next day and sent a fix that VerSprite confirmed on
            20 April.
          handled: well
          source: versprite-2018
      sources: [versprite-2018]

  account:
    email:
      value: required
      sources: [help-email]
    personal_data:
      value: []
      note: Card payments also store your last name and card's last four digits for fraud checks.
      sources: [privacy-policy]
    payment:
      value: [card, app_store]
      note: Cards through Stripe on the website. It dropped PayPal, except through the app stores.
      sources: [help-payment, help-paypal, transparency-2023]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2]
      note: No IKEv2 on Android.
      sources: [help-protocols]
    post_quantum:
      value: none
      note: In February 2026 it said it was working on quantum-safe connections, with nothing announced since.
      sources: [harvest-now]
    kill_switch:
      value: app
      note: >-
        VigilantBear blocks traffic with firewall rules while the app reconnects, but not once you
        disconnect.
      sources: [help-vigilant, vigilantbear-post]
    dns:
      value: first_party
      sources: [help-dns]

  infra:
    ram_only:
      value: null
      note: TunnelBear doesn't say whether its servers run from RAM.
      sources: [features]
    hosting:
      value: null
      note: TunnelBear doesn't say whether it owns or rents its servers.
      sources: [features]
    virtual_locations:
      value: none
      evidence: claimed
      note: It says every server is physically in the country you pick.
      sources: [features]
    servers:
      value: 8000
      note: Listed as more than 8,000.
      sources: [features, help-locations]
    countries:
      value: 47
      note: Its country lists name 47, though it advertises 46+.
      sources: [features, help-locations]

  features:
    connections:
      value: unlimited
      sources: [help-connections, pricing]
    multihop:
      value: false
      sources: [features]
    obfuscation:
      value: [proprietary]
      note: >-
        GhostBear, which it says makes VPN traffic harder to spot without naming the method. Not on iOS
        or the newer macOS app.
      sources: [help-ghostbear]
    port_forwarding:
      value: false
      sources: [features]
    split_tunnel:
      value: true
      note: Paid plans only since late 2025. Android splits by app, iOS and macOS by website, Windows by both.
      sources: [help-splitbear, free-changes, pricing]
    blocking:
      value: []
      note: Its tracker blocker is a separate Chrome extension, not part of the VPN.
      sources: [blocker]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: >-
        No Linux app or router support. The Chrome, Firefox and Edge extensions only cover the browser.
      sources: [help-devices, help-router, edge-extension]
    open_source:
      value: none
      note: Its GitHub holds libraries and forks, not the apps.
      sources: [github]
    telemetry:
      value: null
      note: >-
        The apps send crash reports and device details, and the policy doesn't say whether you can turn
        this off.
      sources: [privacy-policy]
    trackers:
      value: 0
      note: In version 4.0.9 from March 2023, the newest archived report.
      sources: [exodus]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 10.99, currency: USD }
      sources: [pricing, pricing-data]
    best:
      value: { amount: 3.33, currency: USD }
      sources: [pricing, pricing-data]
    best_term:
      value: 36
      sources: [pricing-data]
    renewal_increase:
      value: 0
      note: The 3-year plan is a one-off $120 payment that doesn't renew. The yearly plan is $69.99.
      sources: [pricing-data, help-cancel]
    free_tier:
      value: true
      note: >-
        2GB a month, or 10GB in some censored countries. Since late 2025 it can't pick a country or split
        tunnel.
      sources: [pricing, help-free-data, bandwidth-program, free-changes]
    refund_days:
      value: 30
      note: Only on the first year of an annual plan bought on its website, not monthly or app store plans.
      sources: [tos]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Its pricing page says it's "the only consumer VPN provider to perform annual security audits",
        which others also do.
      sources: [pricing]
    affiliates:
      value: true
      note: Run through Impact, paying commission on each sale.
      sources: [affiliate]
    activism:
      value: true
      note: >-
        It gives free accounts to activists through groups like Access Now and the Freedom of the Press
        Foundation, and extra free data in censored countries.
      sources: [freedom-hub, bandwidth-program]

