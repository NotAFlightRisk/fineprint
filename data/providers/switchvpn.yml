# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: SwitchVPN
icon: switchvpn.png
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://switchvpn.net
      sources: [home]
    legal_entity:
      value: CS Systems, Inc.
      note: The current terms name only "SwitchVPN". The 2016 terms and both app store listings name CS Systems, Inc., at an address in Newark, Delaware.
      sources: [terms, terms-2016, play, app-store]
    owner:
      value: null
      note: Who owns CS Systems, Inc. isn't published.
      sources: [terms-2016, play]
    founded:
      value: 2010
      evidence: claimed
      sources: [windows, trial]
    team:
      value: anonymous
      note: Its site and terms name nobody who runs it.
      sources: [home, terms]
    sister_brands:
      value: []
      sources: [app-store-developer]
    acquisitions:
      value: null
      note: CS Systems, Inc. has been named in its terms since 2016, but whether the service has ever changed hands isn't published.
      sources: [terms-2016]

  jurisdiction:
    hq:
      value: US
      sources: [play, app-store]
    entities:
      value: [US]
      sources: [play, terms-2016]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [policy, logs-faq]
    dns:
      value: none
      evidence: claimed
      sources: [policy, logs-faq]
    timestamps:
      value: none
      evidence: claimed
      sources: [trial, policy]
    bandwidth:
      value: none
      evidence: claimed
      sources: [policy, logs-faq]
    source_ip:
      value: none
      evidence: claimed
      sources: [gdpr, trial]
    proven: []
    policy: https://switchvpn.net/privacy-policy

  transparency:
    audits: []
    report: none
    canary:
      value: none
      sources: [terms]
    bug_bounty:
      value: false
      sources: [cve-2018-18860]
    incidents:
      value:
        - date: 2018-11-12
          summary: >-
            A flaw in the macOS app (CVE-2018-18860) let any local user run programs as root. The researcher's
            disclosure lists six weeks of contact attempts with no reply, and no fix when it was published.
          handled: poorly
          source: cve-2018-18860
      sources: [cve-2018-18860]

  account:
    email:
      value: required
      sources: [policy, checkout]
    personal_data:
      value: [name]
      note: The order form asks for your first and last name and country whichever way you pay.
      sources: [checkout]
    payment:
      value: [card, paypal, bitcoin]
      note: Its terms also list Alipay, and the checkout's cryptocurrency option goes through Plisio without saying which coins.
      sources: [terms, payment-help, checkout]

  security:
    protocols:
      value: [openvpn, ikev2, other]
      note: Other is PPTP, L2TP and SSTP.
      sources: [features, ovpn-configs, ikev2-list]
    post_quantum:
      value: none
      sources: [windows]
    kill_switch:
      value: app
      sources: [windows, mac, bittorrent]
    dns:
      value: first_party
      evidence: claimed
      note: Its router guides set Google's public DNS instead.
      sources: [windows, android, dd-wrt]

  infra:
    ram_only:
      value: null
      note: It doesn't say whether its servers run from RAM.
      sources: [servers]
    hosting:
      value: rented
      note: Its OpenVPN servers sit on addresses belonging to Amazon Web Services, Linode, Vultr and other hosts, though its site calls them proprietary.
      sources: [ovpn-configs, rdap-aws, rdap-linode, rdap-vultr, features]
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
      sources: [servers]
    servers:
      value: null
      note: It claims more than 250 servers, but its current OpenVPN setup files list 24.
      sources: [servers, ovpn-configs]
    countries:
      value: null
      note: It advertises 43 countries and lists 33, but its current OpenVPN and IKEv2 setup files only cover 13.
      sources: [order, servers, ovpn-configs, ikev2-list]

  features:
    connections:
      value: 3
      note: Six on the Families plan.
      sources: [order]
    multihop:
      value: false
      sources: [features]
    obfuscation:
      value: []
      note: It markets China-optimised servers but names no obfuscation method, and its China help suggests switching to L2TP.
      sources: [features, windows, china-help]
    port_forwarding:
      value: true
      note: In the Windows and Mac apps, on servers in a handful of countries.
      sources: [port-forwarding, windows]
    split_tunnel:
      value: true
      note: Only claimed for the Android app.
      sources: [android]
    blocking:
      value: []
      sources: [features]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: >-
        The iOS app was last updated in 2018 and the Android app in January 2021. The Mac app is offered for macOS
        10.15 and older, with newer Macs pointed to Tunnelblick, and Linux and routers need manual setup.
      sources: [windows, mac-old, mac-tunnelblick, app-store, play, asus-router]
    open_source:
      value: none
      sources: [windows, android]
    telemetry:
      value: null
      note: The Play listing declares no data collected, but SwitchVPN doesn't say what its apps send.
      sources: [play, policy]
    fdroid:
      value: false
      sources: [android]

  pricing:
    monthly:
      value: { amount: 6.99, currency: USD }
      sources: [order]
    best:
      value: { amount: 4.99, currency: USD }
      note: $59.88 a year.
      sources: [order]
    best_term:
      value: 12
      sources: [order]
    renewal_increase:
      value: 0
      sources: [order, checkout]
    free_tier:
      value: false
      note: There's a three-day trial for $1.
      sources: [trial]
    refund_days:
      value: 30
      sources: [terms, refund]

  ethics:
    misleading_claims:
      value: true
      note: It sells "Truly Anonymous Services", says your privacy "will never be compromised" and calls its encryption "bank-level, 2048-bit AES-256".
      sources: [order, home, trial]
    affiliates:
      value: true
      note: Affiliates get from 30% of each sale, renewals included.
      sources: [affiliates]
    review_sites:
      value: false
      sources: [home]
    activism: false

