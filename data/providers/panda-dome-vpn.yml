# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Panda Dome VPN
icon: panda-dome-vpn.svg
checked: 2026-10-27

criteria:
  identity:
    website: https://www.pandasecurity.com/en/homeusers/vpn/
    legal_entity:
      value: Panda Security, S.L.U.
      sources: [legal-notice]
    owner:
      value: Vector Capital
      note: Panda has been a wholly owned subsidiary of WatchGuard Technologies since 2020, and Vector Capital is WatchGuard's majority owner.
      sources: [watchguard-closes, vector-majority, watchguard-about]
    founded:
      value: 2018
      note: Panda announced Panda VPN in December 2017 and it was out for Windows by March 2018.
      sources: [forum-2018]
    team:
      value: partial
      note: WatchGuard names its executives, but no one running Panda's consumer products or the VPN is named.
      sources: [watchguard-about]
    sister_brands: []
    acquisitions:
      value:
        - date: 2020-06-02
          acquirer: WatchGuard Technologies
          source: watchguard-closes
      note: Announced in March 2020 and completed in June.
      sources: [watchguard-announce, watchguard-closes]

  jurisdiction:
    hq:
      value: ES
      note: Registered in Bilbao.
      sources: [legal-notice]
    entities:
      value: [ES]
      note: The legal notice and privacy policy name only Panda Security, S.L.U., plus its US parent WatchGuard Technologies, Inc.
      sources: [legal-notice, privacy-policy]

  logging:
    traffic:
      value: null
      note: >-
        Panda says it keeps no activity logs and stores none of your browsing, but its privacy policy
        doesn't single out the VPN and lists the sites you visit and traffic data among what its products collect.
      sources: [vpn, faq-logs, privacy-policy]
    dns:
      value: null
      note: >-
        Panda says it keeps no activity logs, but its privacy policy lists the URLs or domain names of sites
        you visit among what its products collect, without excluding the VPN.
      sources: [faq-logs, android-vpn, privacy-policy]
    timestamps:
      value: null
      note: >-
        Panda says it keeps no activity logs, but its privacy policy lists session data and authentication
        logs without saying whether that covers the VPN.
      sources: [faq-logs, privacy-policy]
    bandwidth:
      value: null
      note: The free plan's 150 MB daily cap needs a running count, but Panda doesn't say what it keeps or for how long.
      sources: [features-vpn]
    source_ip:
      value: null
      note: >-
        Its VPN FAQ used to say it kept no IP addresses, but the privacy policy lists them among what its
        products collect, without excluding the VPN.
      sources: [faq-logs, privacy-policy]
    proven: []
    policy: https://www.pandasecurity.com/en/homeusers/media/legal-notice/

  transparency:
    audits:
      value: []
      note: The VPN page shows antivirus lab results from AV-TEST, AV-Comparatives and SE Labs, but no audit of the VPN.
      sources: [vpn]
    report: none
    canary: none
    bug_bounty:
      value: false
      note: WatchGuard's PSIRT takes reports for Panda products but doesn't mention rewards.
      sources: [psirt]
    incidents:
      value:
        - date: 2024-07-29
          summary: >-
            Trend Micro's ZDI published two flaws in the Windows app that let a local program run code as SYSTEM, one a DLL
            hijack in the VPN process and one in its Hydra SDK service (CVE-2024-7244, CVE-2024-7245). ZDI reported them to
            WatchGuard's PSIRT in February 2024, got no reply and released them unpatched, and the PSIRT's advisories list
            neither.
          handled: poorly
          source: zdi-24-1014
        - date: 2023-07-05
          summary: >-
            A researcher found the Panda Dome VPN installer for Windows could load a planted DLL, letting a local attacker gain
            higher privileges (CVE-2023-37849). Panda sent him a fixed build within ten days and later published an advisory
            crediting him.
          handled: well
          source: advisory-2023
      sources: [zdi-24-1015, heegong-2023, psirt]

  account:
    email:
      value: required
      note: Paid plans are managed through a Panda account, which signs in with your email address.
      sources: [account]
    personal_data:
      value: []
      note: A Panda account asks for an email address, a password and your country.
      sources: [register]
    payment:
      value: [card, paypal, bank, app_store]
      note: The site lists Visa, Mastercard, Maestro, PayPal, Apple Pay, bank transfer, iDEAL and Klarna, and the Android app sells plans in-app.
      sources: [vpn, play]

  security:
    protocols:
      value: [wireguard, openvpn, other]
      note: Other is Catapult Hydra, Pango's protocol, on every platform, plus IPsec on Apple devices.
      sources: [protocols-help]
    post_quantum:
      value: none
      note: None of Panda's VPN pages mention post-quantum key exchange.
      sources: [features-vpn]
    kill_switch:
      value: app
      evidence: claimed
      note: Only Panda's blog mentions one, and none of its pages say which apps have it.
      sources: [blog-gaming]
    dns:
      value: null
      note: Panda doesn't say whose DNS servers the VPN uses.
      sources: [android-vpn]

  infra:
    ram_only:
      value: null
      note: Panda doesn't say whether its VPN servers run from RAM.
      sources: [android-vpn]
    hosting:
      value: null
      note: >-
        The apps are built on the VPN SDK and Hydra protocol of Pango, Hotspot Shield's maker, and Panda
        doesn't say who runs the servers.
      sources: [protocols-help, zdi-24-1015, privacy-policy]
    virtual_locations:
      value: null
      note: Panda calls every location a virtual location, without saying where the servers physically sit.
      sources: [android-vpn]
    servers:
      value: null
      note: The VPN page claims "thousands of servers" without a count.
      sources: [vpn]
    countries:
      value: 60
      note: Panda says it has servers in over 60 countries, and elsewhere more than 60 virtual locations, without listing them.
      sources: [features-vpn, android-vpn]

  features:
    connections:
      value: 1
      note: The cheapest plan covers one device. Five devices cost $65.37 for 2 years.
      sources: [vpn, android-vpn]
    multihop:
      value: false
      sources: [features-vpn]
    obfuscation:
      value: []
      sources: [features-vpn]
    port_forwarding:
      value: false
      note: The VPN page says it supports P2P, but nothing mentions port forwarding.
      sources: [vpn]
    blocking:
      value: []
      note: Safe Browsing is a separate Panda Dome feature, not a blocklist in the VPN.
      sources: [features-vpn]
    split_tunnel:
      value: false
      note: Not mentioned on Panda's VPN pages or app listings.
      sources: [play, app-store]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: On Android and iOS the VPN is part of the Panda Dome app. No Linux app, router support or browser extension.
      sources: [android-vpn, play, app-store]
    open_source: none
    telemetry:
      value: forced
      evidence: claimed
      note: >-
        The privacy policy says the apps upload how you use them and error data, with no opt-out stated. The free version
        also runs Google's ads SDK.
      sources: [privacy-policy, play]
    fdroid: false

  pricing:
    monthly:
      value: null
      grade: na
      note: The VPN page only sells 1, 2 and 3-year plans.
      sources: [vpn]
    best:
      value: { amount: 1.07, currency: USD }
      note: >-
        USD from the US site, which prices by location. $25.77 for the first 2 years on one device, with 40% off;
        five devices cost $65.37.
      sources: [vpn]
    best_term: 24
    renewal_increase:
      value: 67
      note: >-
        The 40% off is for the first term only, then the struck-through $42.95 applies. A site-wide banner
        separately promises to keep the price the same at renewal.
      sources: [android-vpn]
    free_tier:
      value: true
      note: 150 MB a day on one device, connected to the nearest server with no choice of location.
      sources: [features-vpn]
    refund_days:
      value: 30
      note: Within 30 days of purchase, for online orders.
      sources: [refund, account]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Sells "Online Privacy and Anonymity" and a no-logs policy, while its privacy policy lists the sites
        you visit among what its products collect.
      sources: [features-vpn, privacy-policy]
    affiliates:
      value: true
      note: Its affiliate programme pays commission on every sale.
      sources: [partners]
    review_sites:
      value: false
      note: Panda's own blog publishes VPN rankings that put Panda Dome VPN first, but it owns no separate review site.
      sources: [blog-gaming]
    activism: false

