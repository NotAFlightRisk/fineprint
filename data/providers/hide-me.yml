# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: hide.me VPN
icon: hide-me.svg
checked: 2026-10-21

criteria:
  identity:
    website: https://hide.me
    legal_entity:
      value: eVenture Limited
      note: Registered in Labuan, Malaysia, under number LL09685.
      sources: [terms]
    owner:
      value: null
      note: Its help centre calls eVenture Ltd the parent company and names nothing above it. hide.me doesn't say who holds the shares.
      sources: [company-overview]
    founded:
      value: 2012
      sources: [about]
    team:
      value: partial
      note: There's no leadership page, but its blog names founder Sebastian Schaub, who writes its announcements.
      sources: [founder, edge]
    sister_brands: []
    acquisitions:
      value: []
      sources: [is-it-safe]

  jurisdiction:
    hq:
      value: MY
      sources: [terms]
    entities:
      value: [MY]
      evidence: claimed
      note: Its founder is German, but hide.me says it isn't incorporated anywhere outside Malaysia.
      sources: [is-it-safe, edge]

  logging:
    traffic:
      value: none
      evidence: verified
      sources: [privacy-policy, securitum-2024]
    dns:
      value: none
      evidence: verified
      note: Its policy doesn't mention DNS, but Securitum found no DNS logging on the VPN servers.
      sources: [securitum-2024]
    timestamps:
      value: temporary
      evidence: claimed
      note: A troubleshooting log of your random username and internal IP address is wiped every few hours.
      sources: [privacy-policy]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: Keeps a running monthly total of each account's data for billing.
      sources: [privacy-policy]
    source_ip:
      value: none
      evidence: claimed
      sources: [privacy-policy]
    proven:
      value: [audit]
      evidence: verified
      sources: [securitum-2024]
    policy: https://hide.me/en/privacy

  transparency:
    audits:
      value:
        - date: 2024-06-06
          auditor: Securitum
          scope: no_logs
          source: securitum-2024
        - date: 2023-12-01
          auditor: MASA lab, not named
          scope: apps
          source: masa-2023
      evidence: verified
      note: >-
        hide.me also cites an earlier no-logs check by Leon Juranic of DefenseCode, which it dates to
        2015, but no report is public. The Android MASA check is dated by its announcement.
      sources: [no-logs, press]
    report:
      value: regular
      note: One report a year, each covering every request since 2013. The latest covers 2025.
      sources: [about, transparency-2025, about-2023, about-2025]
    canary:
      value: none
      sources: [about, transparency-2025]
    bug_bounty:
      value: null
      note: Its site and help centre don't mention a bug bounty or a way to report security flaws.
      sources: [help-centre]
    incidents:
      value: []
      note: >-
        Local privilege escalation flaws were published in its Windows app in 2016 and its macOS app in
        2019 (CVE-2019-12174). The macOS one was fixed in 2.4.4, but there's no record of how hide.me
        responded to either.
      sources: [exploit-db-40071, cve-2019-12174]

  account:
    email:
      value: required
      note: The free plan needs no account, and paying customers can delete their email afterwards.
      sources: [privacy-policy, pricing]
    personal_data:
      value: []
      sources: [privacy-policy]
    payment:
      value: [card, paypal, bank, app_store, bitcoin, other_crypto]
      sources: [pricing, terms]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, other]
      note: The others are SoftEther and SSTP.
      sources: [protocols]
    post_quantum:
      value: none
      note: >-
        Each WireGuard connection gets a fresh pre-shared key, but hide.me doesn't claim the channel
        it's sent over is quantum-safe.
      sources: [wireguard-keys]
    kill_switch:
      value: system
      note: >-
        The Windows and macOS apps block traffic outside the tunnel with a firewall, on by default, and
        StealthGuard can block all traffic whenever the VPN is off. Mobile apps use the system's
        always-on VPN.
      sources: [kill-switch, stealth-guard]
    dns:
      value: first_party
      note: Each VPN server runs its own resolver.
      sources: [zero-logging-dns, securitum-2024]

  infra:
    ram_only:
      value: all
      evidence: claimed
      sources: [ram-only, company-overview]
    hosting:
      value: null
      note: It says it runs and maintains every server itself, without outsiders, but not whether it owns or rents the hardware.
      sources: [network, server-count]
    virtual_locations:
      value: null
      note: Its network page explains what a virtual location is, but doesn't say whether any of its own are.
      sources: [network]
    servers:
      value: 2600
      note: Listed as more than 2,600 across 92+ locations.
      sources: [pricing]
    countries:
      value: 57
      sources: [network, press]

  features:
    connections:
      value: 10
      sources: [pricing]
    multihop:
      value: true
      sources: [multihop]
    obfuscation:
      value: [proprietary]
      note: >-
        The iOS, macOS and Android apps have a WireGuard obfuscation option that hide.me doesn't
        document. Its OpenVPN setup also uses tls-crypt, which it counts as obfuscation.
      sources: [ios-release-notes, android-release-notes, openvpn-obfuscation]
    port_forwarding:
      value: true
      note: Dynamic, opened on request through UPnP or NAT-PMP.
      sources: [port-forwarding]
    split_tunnel:
      value: true
      sources: [split-tunnel]
    blocking:
      value: [ads, trackers, malware]
      note: SmartGuard, a DNS filter.
      sources: [smartguard]

  clients:
    platforms:
      value: [windows, macos, linux_cli, ios, android, router, browser]
      sources: [software, linux, github]
    open_source:
      value: some
      note: Only the Linux command line, OpenWrt router and Ubuntu Touch clients are on GitHub.
      sources: [github, linux]
    telemetry:
      value: opt_in
      note: Anonymised crash reports and connection diagnostics, only with your consent.
      sources: [privacy-policy]
    trackers:
      value: 0
      note: In version 4.1.0 from September 2023, the newest archived report.
      sources: [exodus]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 11.99, currency: USD }
      sources: [pricing-usd]
    best:
      value: { amount: 2.69, currency: USD }
      note: >-
        $69.99 for 26 months. The 36-month plan is $119.99, or $3.33 a month.
      sources: [pricing-usd, checkout-plans]
    best_term:
      value: 26
      sources: [pricing-usd]
    renewal_increase:
      value: 0
      note: Its pricing page promises every plan renews at the same price and length.
      sources: [pricing-usd]
    free_tier:
      value: true
      note: >-
        One device and 8 locations. The pricing and free VPN pages say there's no data cap, but its
        homepage FAQ says 10 GB a month.
      sources: [pricing, free-vpn, home]
    refund_days:
      value: 30
      note: First order only. App store purchases follow the store's own refund rules.
      sources: [terms]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Its network page says you'll be "completely invisible on the internet" and "no one can track
        your digital footprint". A help centre page says it doesn't record bandwidth use, which its
        privacy policy says it totals monthly.
      sources: [network, company-overview, privacy-policy]
    affiliates:
      value: true
      sources: [affiliates]
    review_sites: false
    activism:
      value: true
      note: It says it donates to the Electronic Frontier Foundation, without saying how much.
      sources: [about]

