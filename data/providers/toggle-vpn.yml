# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Toggle VPN
icon: toggle-vpn.svg
checked: 2026-11-10

criteria:
  identity:
    website:
      value: https://toggle.org
      sources: [home]
    legal_entity:
      value: Toggle Inc.
      note: >-
        A Delaware corporation, per the terms and the Google Play listing. The App Store seller is Toggle Corp.,
        at an address in Stevenson Ranch, California.
      sources: [terms, play, app-store-eu]
    owner:
      value: null
      note: >-
        Nobody owning Toggle Inc. is named. A Minsk company, Toggle Soft (ООО Тогл Софт), recruits for Toggle VPN
        and names VPN Lumos as its other VPN.
      sources: [terms, hh]
    founded:
      value: 2025
      note: The Android app was released in July 2025.
      sources: [play, hh]
    team:
      value: partial
      note: >-
        Its press releases name a CEO, Max Stevenson. The website and the Minsk developer name nobody.
      sources: [pr-windows, home, hh]
    sister_brands:
      value: [VPN Lumos]
      sources: [hh]
    acquisitions: []

  jurisdiction:
    hq:
      value: US
      sources: [terms, policy]
    entities:
      value: [US, BY]
      note: The Belarus company is the Minsk developer that hires for Toggle VPN.
      sources: [terms, app-store-eu, hh]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [policy]
    dns:
      value: none
      evidence: claimed
      note: The policy rules out logging internet activity and browsing history, without mentioning DNS by name.
      sources: [policy]
    timestamps:
      value: null
      note: The policy doesn't mention connection times.
      sources: [policy]
    bandwidth:
      value: none
      evidence: claimed
      sources: [policy]
    source_ip:
      value: null
      note: >-
        The policy says it doesn't store IP addresses, then lists your IP address among the data it collects
        automatically, without saying for how long.
      sources: [policy]
    proven:
      value: []
      note: It calls its no-logs policy independently audited, but no audit has been published.
      sources: [download, pr-launch]
    policy: https://toggle.org/privacy-policy

  transparency:
    audits:
      value: []
      note: >-
        Its website and launch press release say independent auditors confirmed its no-logs policy, but no
        auditor or report is named.
      sources: [download, pr-launch]
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: optional
      note: >-
        The apps make an account with one tap and a security code. Buying on the website asks for an email to
        send the code to.
      sources: [pricing, play-data-safety]
    personal_data:
      value: []
      sources: [policy, play-data-safety]
    payment:
      value: [card, app_store]
      note: Apple Pay and Google Pay are also taken on the website.
      sources: [pricing, policy]

  security:
    protocols:
      value: [wireguard, other]
      note: The other is Shadowsocks.
      sources: [servers, play]
    post_quantum:
      value: none
      note: Nothing is published about its key exchange.
    kill_switch:
      value: system
      note: >-
        On Android it uses the system's always-on VPN and block-without-VPN settings. What the other apps' kill
        switch does isn't described.
      sources: [android, windows]
    dns:
      value: null
      note: It doesn't say whose DNS servers the apps use.

  infra:
    ram_only:
      value: none
      evidence: claimed
      note: It says its servers use full-disk encryption and that no session data is written to disk.
      sources: [servers]
    hosting:
      value: null
      note: It says it has bare-metal hardware in every location, but not whether it owns or rents it.
      sources: [servers]
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
    servers:
      value: 1356
      evidence: claimed
      note: The total of its server table. The same page's headline says about 1,400.
      sources: [servers]
    countries:
      value: 29
      evidence: claimed
      sources: [servers]

  features:
    connections:
      value: 10
      note: Family Sharing adds up to five more people, each on one device at a time.
      sources: [pricing]
    multihop: false
    obfuscation:
      value: [shadowsocks]
      sources: [servers]
    port_forwarding: false
    split_tunnel:
      value: true
      sources: [download, android, windows]
    blocking:
      value: [ads, trackers]
      sources: [download, play]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: There are also Android TV and Apple TV apps. A Linux app is promised but not out.
      sources: [download, windows, mac, app-store, play]
    open_source:
      value: none
      note: Its GitHub only has forks of other projects and hiring tests, not the apps.
      sources: [github]
    telemetry:
      value: null
      note: >-
        The Android app includes Firebase Analytics, Crashlytics, the Facebook SDK, Singular and Amplitude. Both
        stores' forms list device IDs for advertising or tracking, and nothing says you can turn any of it off.
      sources: [play, play-data-safety, app-store]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 11.99, currency: USD }
      note: After a 7-day free trial. It's the only plan on the website.
      sources: [pricing]
    best:
      value: { amount: 4.17, currency: USD }
      note: >-
        $49.99 a year, among the US App Store's in-app purchases. The App Store also lists other weekly and
        monthly prices without saying which are offers.
      sources: [app-store, pricing]
    best_term:
      value: 12
      sources: [app-store]
    renewal_increase:
      value: 0
      note: The website's monthly plan renews at the same price. The store plans' renewal prices aren't published.
      sources: [pricing]
    free_tier:
      value: false
      note: Only a free trial.
      sources: [pricing]
    refund_days:
      value: 30
      note: For website purchases. App Store and Google Play refunds follow the stores' own rules.
      sources: [refund, terms]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It promises "total anonymity" and an "independently audited" no-logs policy, while no audit is published
        and its own store labels list identifiers used to track you.
      sources: [play, servers, app-store]
    affiliates:
      value: null
      note: No affiliate scheme is published, though it runs a partner landing page with 20% off the first month.
      sources: [partners]
    review_sites: false
    activism: false

