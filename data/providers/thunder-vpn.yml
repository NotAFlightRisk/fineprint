    title: Secure Signal Inc. apps on Google Play
  play-2018:
    url: https://web.archive.org/web/20180717203314/https://play.google.com/store/apps/details?id=com.fast.free.unblock.thunder.vpn
    title: Thunder VPN on Google Play, offered by Signal Lab (archived July 2018)
  play-2024-01:
    url: https://web.archive.org/web/20240102022510/https://play.google.com/store/apps/details?id=com.fast.free.unblock.thunder.vpn
    title: Thunder VPN on Google Play, offered by Signal Lab in Alhambra, California (archived January 2024)
  play-2024-05:
    url: https://web.archive.org/web/20240525000538/https://play.google.com/store/apps/details?id=com.fast.free.unblock.thunder.vpn
    title: Thunder VPN on Google Play, offered by Secure Signal Inc. (archived May 2024)
  thunder-ios-2023:
    url: https://web.archive.org/web/20230423222040/https://apps.apple.com/app/id1271721929
    title: Thunder VPN - Secure VPN Proxy on the App Store, from Free Secure Connected Software Co., Ltd (archived April 2023)
  apk:
    url: https://ws75.aptoide.com/api/7/app/getMeta?package_name=com.fast.free.unblock.thunder.vpn
    title: Thunder VPN for Android 5.4.8, whose APK has its own tunnel protocol in libchannel.so, with AdMob and Firebase Analytics
  ttp-2025:
    url: https://www.techtransparencyproject.org/articles/apple-offers-apps-with-ties-to-chinese-military
    title: Tech Transparency Project, Apple Offers Apps With Ties to Chinese Military (1 April 2025)
  hidden-links-2025:
    url: https://www.petsymposium.org/foci/2025/foci-2025-0008.php
    title: 'Mixon-Baca, Knockel and Crandall, Hidden Links: Analyzing Secret Families of VPN Apps (FOCI 2025)'
