# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Hoxx VPN
icon: hoxx-vpn.png
checked: 2026-10-28

criteria:
  identity:
    website: https://hoxx.com
    legal_entity:
      value: Hoxx Inc
      note: >-
        The terms and EULA call the company Hoxx VPN Services, at the same Coral Gables, Florida
        address that the app store listings give for Hoxx Inc.
      sources: [eula, terms, play, chrome, app-store]
    owner:
      value: null
      note: Who owns Hoxx Inc isn't public.
      sources: [play]
    founded:
      value: 2016
      note: Its Firefox add-on was first listed in January 2016, and the terms date from March 2016.
      sources: [amo, terms]
    team:
      value: anonymous
      sources: [play, chrome]
    sister_brands:
      value: [SetupVPN]
      note: >-
        Hoxx Inc and SetupVPN Inc give the same suite at 815 Ponce de Leon Blvd, share the baseserver.io
        download service, and run near-identical FAQs.
      sources: [chrome, setupvpn-chrome, download, setupvpn-download, faq-abuse, setupvpn-faq]
    acquisitions: []

  jurisdiction:
    hq:
      value: US
      sources: [eula, play]
    entities:
      value: [US]
      sources: [play, chrome]

  logging:
    traffic:
      value: 'yes'
      evidence: claimed
      note: >-
        Its EULA says it keeps logs of the websites you visit for an unlimited time, deleting them only at its
        discretion, and helps the authorities with them.
      sources: [eula, faq-abuse, apk]
    dns:
      value: 'yes'
      evidence: claimed
      note: >-
        The EULA keeps logs of the websites you visit, and the Android app says it collects the domain or IP
        of each connection.
      sources: [eula, apk]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: The FAQ matches abuse reports to its logs by date, time and target website.
      sources: [faq-abuse]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: Free accounts have a daily data quota, so usage is counted per account.
      sources: [faq-general]
    source_ip:
      value: 'yes'
      evidence: claimed
      note: Its EULA says it keeps your IP address alongside the logs of the sites you visit.
      sources: [eula, apk]
    proven: []
    policy: https://hoxx.com/privacy-policy/

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: optional
      note: >-
        The website's signup and the EULA need a verified email, but the apps offer a guest login without
        one in some countries.
      sources: [register, eula, apk]
    personal_data:
      value: null
      note: The privacy policy says registering takes your name and contact number, while the register page only asks for an email address.
      sources: [policy, register]
    payment:
      value: [card, paypal, bitcoin, other_crypto]
      note: Premium is bought inside the apps. The site also lists Alipay, and Stripe and Paymentwall as processors.
      sources: [pricing, faq-premium]

  security:
    protocols:
      value: [other]
      note: >-
        The Android app is built on Jigsaw's Outline client and tunnels over Shadowsocks. The browser
        extensions are an HTTPS proxy for that browser alone.
      sources: [apk, chrome]
    post_quantum: none
    kill_switch: null
    dns: null

  infra:
    ram_only: null
    hosting:
      value: null
      note: The privacy policy names server providers among the third parties that handle your data, without saying whether it owns any servers.
      sources: [policy]
    virtual_locations: null
    servers:
      value: null
      note: The store listings say over 100 servers.
      sources: [play, app-store]
    countries:
      value: null
      note: The pricing page says 50+ locations on the free plan and more on Premium.
      sources: [pricing]

  features:
    connections:
      value: null
      note: The FAQ says you can use several browsers and computers at once, without giving a limit.
      sources: [faq-general]
    multihop: false
    obfuscation:
      value: [shadowsocks]
      note: The Android app tunnels over Shadowsocks, and the extensions are a plain HTTPS proxy.
      sources: [apk, pricing]
    port_forwarding: false
    split_tunnel:
      value: true
      note: >-
        The Android app can tunnel only chosen apps or leave chosen apps out. Premium extensions can skip
        the proxy for certain IPs with a PAC file.
      sources: [apk, pricing]
    blocking:
      value: [malware]
      evidence: claimed
      note: Premium also claims to stop ad networks tracking you, without saying how.
      sources: [pricing, faq-general]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: >-
        The Chrome, Firefox and Edge extensions are a proxy for that browser alone, and were last
        updated in early 2025. The Android, iPhone and Mac apps were updated in September 2026.
      sources: [download, chrome, amo, edge, play, app-store, mac-app-store]
    open_source:
      value: null
      note: The Firefox add-on is listed under the MPL 2.0, but the FAQ says you may read the code and not modify or reuse it.
      sources: [amo, faq-general]
    telemetry:
      value: forced
      evidence: claimed
      note: >-
        The Android app collects crash logs and in-app activity statistics as a condition of use, and the
        extensions send error messages.
      sources: [apk, faq-general, app-store]
    fdroid: false

  pricing:
    monthly:
      value: null
      note: Premium is sold inside the apps, and the site only gives a starting price.
      sources: [pricing]
    best:
      value: { amount: 1.99, currency: USD }
      note: The site's "from" price, with no plan length given.
      sources: [pricing]
    best_term: null
    renewal_increase:
      value: null
      grade: na
      note: Premium isn't a subscription, so it drops back to the free plan instead of renewing.
      sources: [faq-premium]
    free_tier:
      value: true
      note: >-
        Free accounts get a daily data quota, though the pricing page says no bandwidth restrictions.
        Free accounts unused for 180 days may be closed.
      sources: [pricing, faq-general, faq-account]
    refund_days:
      value: 7
      sources: [refund]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It promises end-to-end encryption from your browser to the site and says nobody can know what
        you're doing, while it keeps logs of the sites you visit for the authorities.
      sources: [faq-general, faq-abuse, play]
    affiliates:
      value: false
      sources: [faq-general]
    review_sites: false
    activism: false

  other:
    concerns:
      value:
        - summary: The EULA reserves the right to tag your traffic with HTTP headers that identify you.
          severity: minor
          source: eula
        - summary: >-
            Sites on its blacklist bypass the proxy, so they see your real IP address, and the list can
            change at any time.
          severity: serious
          source: eula

