# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: OVPN
icon: ovpn.svg
checked: 2026-10-22

criteria:
  identity:
    website:
      value: https://www.ovpn.com
      sources: [home]
    legal_entity:
      value: OVPN Inc.
      note: >-
        OVPN Integritet AB, the Swedish company that ran it before 2025, went into liquidation in July 2026,
        though a help article still names it.
      sources: [tos, press, register, people]
    owner:
      value: Point Wild
      note: >-
        Pango, then owned by Aura, bought OVPN in 2023. Aura spun Pango Group off in 2024, and it then merged
        with Total Security, TotalAV's maker, to form Point Wild.
      sources: [next-chapter, people, aura-split-2024, point-wild-merger]
    founded:
      value: 2014
      note: Its first paying customer signed up on 20 August 2014.
      sources: [turned-eight, about]
    team:
      value: partial
      note: >-
        The site names no one in charge. Founder David Wibergh signed the 2023 sale post, and Point Wild
        names its own executives.
      sources: [next-chapter, point-wild-team]
    sister_brands:
      value: [Hotspot Shield, Betternet, Touch VPN, UltraVPN, VPN 360, TotalAV VPN, VPN in Touch]
      note: All owned by Point Wild, through Pango or Total Security.
      sources: [aura-split-2024, hss-privacy-vpn, point-wild-merger, totalav-vpn, vpn-in-touch]
    acquisitions:
      value:
        - date: 2024-12-12
          acquirer: Point Wild
          source: point-wild-merger
        - date: 2024-09-03
          acquirer: Pango Group, spun off from Aura
          source: aura-split-2024
        - date: 2023-05-08
          acquirer: Pango, then owned by Aura
          source: next-chapter
      note: >-
        Point Wild was formed when Pango Group merged with Total Security in December 2024. The move to
        OVPN Inc. in 2025 was within the same group.
      sources: [next-chapter, aura-split-2024, point-wild-merger, tos]

  jurisdiction:
    hq:
      value: US
      note: >-
        Swedish until 2025. OVPN Inc. takes notices in Redwood City, California, and the privacy notice says
        the account and VPN services run in the EU and US.
      sources: [tos, press, privacy]
    entities:
      value: [US, SE]
      note: OVPN Integritet AB in Stockholm is still registered, in liquidation since July 2026.
      sources: [tos, register]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy, security]
    dns:
      value: none
      evidence: claimed
      sources: [privacy, security]
    timestamps:
      value: none
      evidence: claimed
      note: The device limit is enforced with a bare counter per account, without device IDs, IPs or times.
      sources: [privacy, device-counter]
    bandwidth:
      value: none
      evidence: claimed
      note: The monthly transparency reports give traffic per data centre only.
      sources: [privacy, report-2026-09]
    source_ip:
      value: temporary
      evidence: claimed
      note: >-
        On WireGuard your IP is kept in memory until the session ends, and idle peers are wiped after three
        minutes without a handshake.
      sources: [privacy, security]
    proven:
      value: [court]
      evidence: verified
      note: >-
        In 2020 the Patent and Market Court threw out film companies' demand for the customer behind a Pirate
        Bay IP, as they couldn't show OVPN held it. That predates the Pango sale, and OVPN told the court a
        since-deleted database backup could have shown who had that IP.
      sources: [court-verdict, court-win, torrentfreak]
    policy:
      value: https://www.ovpn.com/en/privacy-notice
      sources: [privacy]

  transparency:
    audits:
      value: []
      sources: [transparency, blog-feed]
    report:
      value: regular
      note: >-
        Monthly reports of data requests and traffic per data centre, though several in 2024 and 2025 came
        out months late.
      sources: [transparency, report-2026-09, blog-feed]
    canary:
      value: none
      sources: [transparency, how-secure]
    bug_bounty:
      value: true
      note: >-
        Its security.txt gives a security and bug bounty contact, and the help centre says it rewards reported
        vulnerabilities, but no terms or amounts are published.
      sources: [security-txt, how-secure]
    incidents:
      value:
        - date: 2020-06-23
          summary: >-
            Film companies backed by the Rights Alliance asked the Patent and Market Court to make OVPN name the
            customer behind a Pirate Bay IP address. OVPN fought it, blogged about the case and published the
            filings, and won with costs in September 2020.
          handled: well
          source: court-win
      sources: [court-update, court-verdict]

  account:
    email:
      value: required
      note: >-
        Checkout asks for one for the payment provider, with an option for OVPN not to keep it. The security
        page still says no email is needed.
      sources: [pricing, security]
    personal_data:
      value: []
      sources: [privacy]
    payment:
      value: [card, paypal, app_store, bitcoin, other_crypto]
      note: >-
        Other crypto is Ethereum. Cash and Monero were dropped in February 2024, though the security page still
        offers cash.
      sources: [payment-methods, crypto-payment, payment-change, app-store, security]

  security:
    protocols:
      value: [wireguard, openvpn]
      note: The mobile apps and Windows on ARM use WireGuard only.
      sources: [how-secure, wireguard, desktop-218]
    post_quantum:
      value: none
      sources: [wireguard, how-secure]
    kill_switch:
      value: system
      note: >-
        Optional in the desktop app, with an always-on mode that also blocks traffic while disconnected.
        Android relies on the system's Always-on VPN.
      sources: [killswitch-help, killswitch-release, always-on]
    dns:
      value: first_party
      sources: [dns-help, adblock-dns]

  infra:
    ram_only:
      value: all
      evidence: claimed
      sources: [security, network]
    hosting:
      value: owned
      evidence: claimed
      note: Colocated hardware in every location, with no rented or virtual servers.
      sources: [security, network, home]
    virtual_locations:
      value: none
      evidence: claimed
      sources: [network]
    servers:
      value: 96
      note: The September 2026 transparency report only lists 90 servers, in 26 of the 32 cities.
      sources: [press, network, report-2026-09]
    countries:
      value: 20
      note: Across 32 cities.
      sources: [network]

  features:
    connections:
      value: 4
      note: >-
        On a new account. Each year subscribed adds one, so the 12-month plan starts with 5 and the 36-month
        plan with 7.
      sources: [connections-help, pricing]
    multihop:
      value: true
      note: Multihop used to be a paid add-on, and the pricing page now includes it free.
      sources: [multihop, multihop-help, pricing]
    obfuscation:
      value: [shadowsocks]
      note: Stealth VPN in the desktop app runs the connection through a Shadowsocks proxy.
      sources: [stealth, stealth-help]
    port_forwarding:
      value: true
      note: >-
        Up to seven ports between 49152 and 65535. A static Public IPv4 address with every port open costs $4
        a month more.
      sources: [port-forwarding-help, public-ipv4]
    split_tunnel:
      value: true
      note: Windows x64 only.
      sources: [split-tunnel, split-tunnel-release]
    blocking:
      value: [ads, trackers]
      sources: [adblock-dns, block-ads]

  clients:
    platforms:
      value: [windows, macos, linux_gui, ios, android]
      note: >-
        The desktop app covers Ubuntu, Fedora and openSUSE. Routers and NAS boxes use manual OpenVPN or
        WireGuard setups.
      sources: [security, guides]
    open_source:
      value: none
      note: No app source is published, and the terms forbid reverse engineering.
      sources: [tos]
    telemetry:
      value: null
      note: >-
        Desktop usage statistics are opt-in. The iOS App Store listing says the app collects crash data,
        without saying whether that can be turned off.
      sources: [usage-stats-help, usage-stats-release, app-store]
    trackers:
      value: 0
      note: The newest Exodus report that would load was for version 0.9.0, from October 2022.
      sources: [exodus]

  pricing:
    monthly:
      value: { amount: 12, currency: USD }
      note: Also sold in EUR and SEK.
      sources: [pricing]
    best:
      value: { amount: 4.22, currency: USD }
      note: $151.92 for 36 months.
      sources: [pricing]
    best_term:
      value: 36
      sources: [pricing]
    renewal_increase:
      value: null
      note: Neither the pricing page nor the terms say what longer plans renew at.
      sources: [pricing, tos]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 10
      note: First purchase only, by card or PayPal.
      sources: [refund]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Its app store listings promise a "100% completely log-free VPN service" and to "guarantee full data
        protection".
      sources: [app-store, play-store]
    affiliates:
      value: true
      sources: [affiliates]
    review_sites:
      value: true
      note: Point Wild also owns Comparitech, a VPN review site, which discloses it.
      sources: [comparitech-disclosure]
    activism:
      value: false
      note: >-
        It gave WireGuard's developers a one-off donation in 2020 and people in Ukraine free accounts from 2022,
        but has backed no privacy causes since.
      sources: [wireguard-donation, ukraine, about]

