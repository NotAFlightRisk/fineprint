# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Private Internet Access
icon: private-internet-access.png
checked: 2026-11-01

criteria:
  identity:
    website: https://www.privateinternetaccess.com
    legal_entity:
      value: PIA Private Internet Access, Inc.
      sources: [tos]
    owner:
      value: Kape Technologies
      note: >-
        Kape is controlled by Teddy Sagi through Unikmind Holdings, which held 98.5% when it took Kape
        private in 2023.
      sources: [kape-holding-2023, kape-brands]
    founded:
      value: 2009
      sources: [kape-proposed]
    team:
      value: partial
      note: There's no leadership page, but the privacy policy names the data protection officer.
      sources: [privacy-policy, about]
    sister_brands:
      value: [ExpressVPN, CyberGhost, EventVPN, Intego VPN]
      note: >-
        EventVPN is a free app built by ExpressVPN's team. ZenMate's users were moved to CyberGhost in
        2023.
      sources: [kape-brands, eventvpn-launch, zenmate]
    acquisitions:
      value:
        - date: 2019-12-16
          acquirer: Kape Technologies
          source: kape-completion
      note: >-
        Announced in November 2019, when Kape agreed to buy LTMI Holdings, PIA's parent, from its
        co-founders for about $95.5 million.
      sources: [kape-proposed, kape-completion]

  jurisdiction:
    hq:
      value: US
      sources: [about, tos]
    entities:
      value: [US]
      note: >-
        PIA Private Internet Access, Inc., based in Colorado, is the only PIA company named. Its parent,
        Kape, is incorporated in the Isle of Man.
      sources: [tos, about, companies-house]

  logging:
    traffic:
      value: none
      evidence: verified
      sources: [privacy-policy, no-logs, audit-deloitte-2025]
    dns:
      value: none
      evidence: verified
      sources: [no-logs, audit-deloitte-2025]
    timestamps:
      value: none
      evidence: verified
      sources: [no-logs, audit-deloitte-2025]
    bandwidth:
      value: none
      evidence: verified
      sources: [no-logs, audit-deloitte-2025]
    source_ip:
      value: none
      evidence: verified
      sources: [no-logs, audit-deloitte-2025]
    proven:
      value: [court, audit]
      evidence: verified
      note: >-
        A 2016 FBI complaint said a subpoena got PIA's owner to say only that the IPs were on the US east
        coast, and its lawyer told a 2018 trial it keeps no activity logs. Deloitte last checked the
        servers as of October 2025.
      sources: [fbi-2016, colby-2018, audit-deloitte-2025]
    policy: https://www.privateinternetaccess.com/privacy-policy

  transparency:
    audits:
      value:
        - date: 2025-10-31
          auditor: Deloitte
          scope: no_logs
          source: audit-deloitte-2025
        - date: 2024-01-31
          auditor: Deloitte
          scope: no_logs
          source: audit-deloitte-2024
        - date: 2023-11-01
          auditor: MASA lab, not named
          scope: apps
          source: masa-2023
        - date: 2022-06-30
          auditor: Deloitte
          scope: no_logs
          source: audit-2022-post
      evidence: verified
      note: >-
        Each Deloitte report checks the setup at a single date, and the 2022 one was only shared with
        customers. The Android app's MASA review is dated by PIA's November 2023 announcement.
      sources: [audit-2025-post, audit-2024-post, audit-2022-post, masa-2023]
    report:
      value: regular
      note: Quarterly, with figures up to mid-2026 when checked.
      sources: [transparency, transparency-q2-2026]
    canary:
      value: none
      note: It explained in 2016 why it doesn't run one.
      sources: [canary-post]
    bug_bounty:
      value: true
      note: Run through YesWeHack, with rewards from $50 to $1,250.
      sources: [yeswehack, vdp]
    incidents:
      value:
        - date: 2020-07-07
          summary: >-
            A researcher found the Linux app's kill switch didn't stop forwarded traffic, such as from
            Docker containers, leaving outside the VPN. PIA first said it wasn't a vulnerability, then
            fixed it in version 2.4.0 on 9 September 2020.
          handled: well
          source: killswitch-2020
        - date: 2018-12-16
          summary: >-
            Rich Mirch reported several flaws in the Windows, macOS and Linux apps that let local
            software gain admin or root rights. PIA acknowledged them and fixed them in its rewritten
            desktop app, version 1.2.1, before he went public in June 2019.
          handled: well
          source: mirch-2019
        - date: 2018-03-23
          summary: >-
            VerSprite reported a Windows app flaw that let a local user run programs as administrator.
            PIA offered a bounty, sent a fix for testing within five days and released it on 5 April 2018.
          handled: well
          source: versprite-2018
        - date: 2017-10-18
          summary: >-
            Nightwatch Cybersecurity found that someone on your network could crash the Android app by
            swapping its server list for a huge file (CVE-2017-15882). PIA confirmed it in two days, paid
            a bounty and shipped a fix within a week.
          handled: well
          source: nightwatch-2017
        - date: 2016-07-01
          summary: >-
            PIA told users some of its Russian servers had been seized without notice, said it kept no
            logs for them to find, and pulled out of Russia.
          handled: well
          source: russia-2016
        - date: 2013-11-18
          summary: >-
            Its forum was hacked and the attacker reached the forum's database. PIA posted about it the
            same day, emailed forum users to change reused passwords and moved to a new forum, kept apart
            from the VPN.
          handled: well
          source: forum-2013
      sources: [killswitch-2020, mirch-2019, versprite-2018, nightwatch-2017, russia-2016, forum-2013]

  account:
    email:
      value: required
      sources: [privacy-policy]
    personal_data:
      value: []
      note: US buyers paying by card or similar also give their state and ZIP code for sales tax.
      sources: [privacy-policy]
    payment:
      value: [card, paypal, app_store, gift_card]
      note: >-
        Also Apple Pay, Google Pay, Amazon Pay in some countries, and wallets like iDEAL through
        Paymentwall. The privacy policy still mentions crypto through BitPay, but the payments page
        doesn't list it.
      sources: [payments, gift-cards, privacy-policy]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2]
      note: IKEv2 is only in the Apple TV app.
      sources: [windows, apple-tv]
    post_quantum:
      value: none
      sources: [settings-advanced, github]
    kill_switch:
      value: system
      note: >-
        Firewall-based and on by default on desktop, with an option to block traffic whenever the VPN's
        off. On iOS it only covers reconnects.
      sources: [kill-switch-windows, settings-basic, settings-ios]
    dns:
      value: first_party
      sources: [settings-advanced]

  infra:
    ram_only:
      value: all
      evidence: verified
      sources: [server-list, audit-deloitte-2025]
    hosting:
      value: mixed
      note: In 2022 it said it was slowly moving its fleet to colocated servers of its own, without saying how far it's got.
      sources: [audit-2022-post]
    virtual_locations:
      value: disclosed
      note: >-
        Labelled as geo-located regions in the apps. The server list the apps use marks 62 of the 113
        countries as virtual only.
      sources: [server-list, serverlist-api, settings-android]
    servers:
      value: null
      note: PIA lists 180 locations in 113 countries, but no server count.
      sources: [server-list]
    countries:
      value: 113
      sources: [server-list, serverlist-api]

  features:
    connections:
      value: unlimited
      note: The terms let it step in if it thinks unlimited devices are being abused, such as by resale.
      sources: [devices, tos]
    multihop:
      value: true
      note: On desktop, through a PIA-run Shadowsocks proxy or a SOCKS5 proxy in front of the VPN server.
      sources: [multi-hop]
    obfuscation:
      value: [shadowsocks, amneziawg]
      note: Shadowsocks on desktop, plus AmneziaWG on Linux and macOS since version 3.8.0 in October 2026.
      sources: [multi-hop, desktop-changelog]
    port_forwarding:
      value: true
      note: Not on its US servers.
      sources: [settings-android, serverlist-api]
    split_tunnel:
      value: true
      note: Not in the iOS app.
      sources: [settings-basic, settings-android, settings-ios]
    blocking:
      value: [ads, trackers, malware]
      note: Through MACE, its DNS blocklist, which isn't in the iOS app.
      sources: [mace]

  clients:
    platforms:
      value: [windows, macos, linux_gui, linux_cli, ios, android, browser]
      note: >-
        Routers are only supported by setting them up by hand with OpenVPN. The Chrome and Firefox
        extensions are proxies for the browser alone.
      sources: [download, cli, router, extensions]
    open_source:
      value: all
      note: >-
        The desktop, Android and iOS apps are MIT licensed on GitHub. The browser extensions' published
        source stops at version 3.1.0 from 2021.
      sources: [github, extension-source]
    telemetry:
      value: opt_in
      note: >-
        Anonymous connection statistics are only sent if you tick "Help improve PIA", though its no-logs
        page talks of opting out.
      sources: [privacy-policy, settings-basic, no-logs]
    fdroid:
      value: true
      sources: [fdroid]

  pricing:
    monthly:
      value: { amount: 11.95, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 2.03, currency: USD }
      note: An intro price for the first 39 months. It then renews at about $2.19 a month.
      sources: [pricing]
    best_term:
      value: 39
      note: A 3-year plan with 3 months added.
      sources: [pricing]
    renewal_increase:
      value: 8
      note: The 39-month plan is $79, then renews at $79 every 3 years.
      sources: [pricing]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 30
      note: >-
        The pricing page limits it to new subscribers, while the terms also allow it on renewals. App
        store and gift card purchases are refunded by whoever sold them.
      sources: [tos, pricing]

  ethics:
    misleading_claims:
      value: true
      note: Its router page promises "military-grade VPN encryption" and "a 100% effective Kill Switch".
      sources: [vpn-router]
    affiliates:
      value: true
      note: Its affiliate page offers up to 33% commission on new sales.
      sources: [affiliates]
    review_sites:
      value: true
      note: Its owner, Kape, also owns VPN review sites such as vpnMentor and Safety Detectives, which disclose it.
      sources: [kape-brands, vpnmentor, safety-detectives]
    activism:
      value: true
      note: >-
        It lists groups it has backed, such as the EFF, Fight for the Future and the Free Software
        Foundation, without saying when or how much.
      sources: [supported, about]

