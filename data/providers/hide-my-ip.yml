# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Hide My IP
icon: hide-my-ip.png
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://www.hidemyip.com
      sources: [home]
    legal_entity:
      value: My Privacy Tools, Inc.
      sources: [terms, play, privacy]
    owner:
      value: null
      note: No parent company is named above My Privacy Tools, Inc.
      sources: [terms]
    founded:
      value: null
      note: My Privacy Tools has sold Hide My IP since 2006, first as proxy software, but when the VPN launched isn't stated.
      sources: [home-2007, app-store]
    team:
      value: partial
      note: A 2015 court order names its vice president, who called it his company. Its site names nobody.
      sources: [wilens-order, terms]
    sister_brands:
      value: []
      sources: [app-store-developer]
    acquisitions:
      value: null
      note: My Privacy Tools, Inc. has been named on the site since 2006, but whether it has ever changed hands isn't published.
      sources: [home-2007]

  jurisdiction:
    hq:
      value: US
      note: Its privacy policy and Google Play listing give an address in San Diego, California.
      sources: [privacy]
    entities:
      value: [US]
      sources: [play]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [terms, privacy]
    dns:
      value: none
      evidence: claimed
      sources: [privacy]
    timestamps:
      value: null
      note: The terms rule out activity and usage logs, but the policy says it collects information when you use its network without saying what.
      sources: [terms, privacy]
    bandwidth:
      value: null
      note: The terms rule out usage logs, but the policy doesn't say whether data use per account is recorded.
      sources: [terms, privacy]
    source_ip:
      value: null
      note: The policy doesn't say whether the IP you connect from is recorded.
      sources: [privacy, kb-logs]
    proven:
      value: [court]
      evidence: verified
      note: >-
        Subpoenaed in a 2014 lawsuit for whoever used its IP addresses at given times, it said it kept no
        record of which customer had them, beyond perhaps a short time.
      sources: [wilens-order]
    policy: https://www.hidemyip.com/privacy-policy

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty:
      value: false
      sources: [contact]
    incidents: []

  account:
    email:
      value: required
      note: The license key is sent to it.
      sources: [checkout]
    personal_data:
      value: []
      sources: [checkout]
    payment:
      value: [card, paypal, bitcoin, other_crypto, app_store]
      note: Litecoin is the other coin it names, and it also lists AliPay.
      sources: [checkout, kb-payment, kb-google-play]

  security:
    protocols:
      value: [wireguard, openvpn]
      note: OpenVPN is for manual setup. Its Android app is built on WireGuard, which the site doesn't mention.
      sources: [web-app, kb-linux, kb-tcp-udp, apk]
    post_quantum: none
    kill_switch:
      value: app
      note: The Android and iOS apps have one; the desktop apps aren't said to.
      sources: [play, app-store]
    dns:
      value: null
      note: It doesn't say whose DNS servers the VPN uses.
      sources: [privacy]

  infra:
    ram_only:
      value: null
      note: It doesn't say whether its servers run from RAM.
      sources: [locations]
    hosting:
      value: null
      note: It doesn't say whether it owns or rents its servers.
      sources: [locations]
    virtual_locations:
      value: none
      evidence: claimed
      sources: [locations, kb-geo]
    servers:
      value: null
      note: It lists 133 locations, though its homepage says 140, and gives no server count.
      sources: [locations]
    countries:
      value: 80
      sources: [locations]

  features:
    connections:
      value: 7
      note: Its Google Play listing says 10.
      sources: [devices-faq, kb-devices, play]
    multihop:
      value: false
      sources: [play]
    obfuscation:
      value: null
      note: Its Android app bundles Xray and wstunnel, but it doesn't say whether or when they're used.
      sources: [apk]
    port_forwarding: null
    split_tunnel:
      value: null
      note: It doesn't say whether you can choose which apps use the VPN.
      sources: [app-store]
    blocking:
      value: null
      note: Its App Store listing says it blocks tracking, without saying how.
      sources: [app-store]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: Linux uses manual OpenVPN setup and routers get Smart DNS only. The iOS app was updated in October 2026.
      sources: [downloads, kb-linux, dns-proxy, play, app-store, chrome]
    open_source:
      value: none
      sources: [downloads]
    telemetry:
      value: null
      note: The App Store listing declares no data collected and Google Play declares some personal info, but neither says what the apps send.
      sources: [app-store, play]
    fdroid:
      value: false
      sources: [downloads]

  pricing:
    monthly:
      value: { amount: 4.95, currency: USD }
      sources: [home, checkout]
    best:
      value: { amount: 2.91, currency: USD }
      note: $34.95 for a year.
      sources: [home, checkout]
    best_term:
      value: 12
      sources: [home, checkout]
    renewal_increase:
      value: 0
      note: The plans aren't sold as intro deals and renew automatically at checkout.
      sources: [checkout]
    free_tier:
      value: true
      note: The apps have a few free locations, with the rest for paying users.
      sources: [app-store, try]
    refund_days:
      value: 30
      sources: [refund]

  ethics:
    misleading_claims:
      value: true
      note: It promises "online anonymity", "Military-grade encryption" and that you'll "Stay Anonymous".
      sources: [home, play]
    affiliates:
      value: true
      sources: [affiliates, kb-affiliate]
    review_sites: false
    activism: false

