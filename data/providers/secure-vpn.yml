# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Secure VPN
icon: secure-vpn.png
checked: 2026-10-28

criteria:
  identity:
    website:
      value: https://securevpn.com
      sources: [home]
    legal_entity:
      value: Webzilla Apps Inc
      note: >-
        The terms only name SecureVPN.com. Webzilla Apps Inc is the Google Play developer and the company
        named on the website, while the iOS app is sold by SecureVPN.com Inc.
      sources: [terms, home, press, play, app-store]
    owner:
      value: null
      note: Its 2015 launch release says it was set up by XBT Holding, a hosting group. Who owns it now isn't published.
      sources: [launch, press]
    founded:
      value: 2015
      sources: [launch]
    team:
      value: anonymous
      sources: [press, privacy, terms]
    sister_brands:
      value: [Fastzilla VPN]
      note: >-
        Fastzilla VPN shares its Google Play developer and App Store seller. It isn't the Secure VPN from
        Secure Signal Inc in 2025 research, or the Signal Secure VPN that TTP tied to Qihoo 360.
      sources: [play-dev, app-store, hidden-links-2025, ttp-spot-check-2025]
    acquisitions: []

  jurisdiction:
    hq:
      value: US
      note: Webzilla Apps Inc gives an address in West Palm Beach, Florida, and the website says Lake Worth, Florida.
      sources: [play, press]
    entities:
      value: [US]
      sources: [play]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy]
    dns:
      value: null
      note: The policy only says it doesn't log VPN traffic. An older article on its site says it keeps no server logs at all.
      sources: [privacy, no-logs-article]
    timestamps:
      value: null
      note: >-
        The current policy doesn't say whether it records when you connect, though an older article on its site says
        it keeps no server logs.
      sources: [privacy, no-logs-article]
    bandwidth:
      value: null
      note: It doesn't say, though the free iOS version caps how much data you can use.
      sources: [privacy, app-store]
    source_ip:
      value: null
      note: >-
        The policy collects "technical identifiers" without saying what they are. An older article on its site says
        it keeps no server logs, which the current policy doesn't repeat.
      sources: [privacy, no-logs-article]
    proven: []
    policy: https://securevpn.com/?page=privacy_policy

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: optional
      note: The free apps need no registration. Buying on the website needs an email address.
      sources: [play, pricing, privacy]
    personal_data: []
    payment:
      value: [card, paypal, app_store]
      sources: [pricing, app-store]

  security:
    protocols:
      value: [openvpn, other]
      note: Other is IPsec, which the Mac app uses. The Windows app uses OpenVPN, and both are offered for setting up other devices by hand.
      sources: [faq, mac-app, windows-app]
    post_quantum:
      value: none
      note: Nothing is published about its key exchange.
      sources: [faq, home]
    kill_switch:
      value: null
      note: >-
        An older article on its site says its apps block all traffic outside the tunnel, but neither desktop app has
        a kill switch setting, and nothing says whether the phone apps have one.
      sources: [leak-article, windows-app, mac-app]
    dns:
      value: null
      note: An older article on its site recommends using its DNS servers, but it doesn't say which ones the apps use.
      sources: [faq, faster-article]

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: null
      note: It doesn't say whether it owns or rents its servers.
    virtual_locations:
      value: null
      note: It doesn't say where its servers are or whether any locations are virtual.
    servers:
      value: null
      note: It doesn't publish a server count.
    countries:
      value: null
      note: An article from around 2015 put its servers in six countries, but there's no current list of locations.
      sources: [censorship-article, home]

  features:
    connections:
      value: 5
      sources: [pricing, terms]
    multihop: false
    obfuscation: []
    port_forwarding: false
    split_tunnel: false
    blocking: []

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: >-
        The apps look unmaintained: the iOS app was last updated in July 2021, the Windows and Mac downloads
        date from March 2021, and the Android app was last updated in June 2024. The Windows app still ships
        OpenVPN 2.3.6 and OpenSSL 1.0.2 from early 2015.
      sources: [faq, app-store, play, windows-app]
    open_source:
      value: none
      note: The terms forbid reverse engineering the apps.
      sources: [terms]
    telemetry:
      value: null
      note: >-
        The store listings say the apps share device IDs, approximate location, usage, crash and diagnostic
        data, some of it for advertising. The privacy policy only mentions account and technical identifiers, and
        neither says whether you can opt out.
      sources: [play-data-safety, app-store, privacy]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 9.99, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 3.75, currency: USD }
      note: $45 billed yearly.
      sources: [pricing]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: null
      note: The "up to 62% off" is the saving against the monthly price, and it doesn't say what plans renew at.
      sources: [pricing, terms]
    free_tier:
      value: true
      note: Ad-supported. The iOS listing caps free use at 1,000 MB of data.
      sources: [play, app-store]
    refund_days:
      value: 7
      note: Website purchases.
      sources: [pricing]

  ethics:
    misleading_claims:
      value: true
      note: It says the service keeps your online activity "100% private", lets you "surf the web anonymously" and uses "military grade" encryption.
      sources: [home, play]
    affiliates: false
    review_sites: false
    activism: false

