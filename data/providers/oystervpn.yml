# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: OysterVPN
icon: oystervpn.svg
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://oystervpn.com
      sources: [home]
    legal_entity:
      value: Oyster Digital Solutions Limited
      note: An Irish company registered in Dublin in April 2022.
      sources: [terms, privacy, cro, play]
    owner:
      value: null
      note: Who owns Oyster Digital Solutions Limited isn't published.
      sources: [cro, play]
    founded:
      value: 2022
      note: Its company was registered in April 2022 and the Android app came out that July.
      sources: [cro, play]
    team:
      value: partial
      note: Its AppSumo listing names its founder, Jason Gray. Its own site and policies name nobody.
      sources: [appsumo, home, privacy]
    sister_brands:
      value: []
      note: Its Google Play and App Store developer accounts list only OysterVPN and a live chat app, Voo.Chat.
      sources: [play-dev, app-store-dev]
    acquisitions:
      value: []
      sources: [cro]

  jurisdiction:
    hq:
      value: IE
      sources: [cro, location-faq]
    entities:
      value: [IE]
      sources: [cro, play]

  logging:
    traffic:
      value: null
      note: >-
        The privacy policy lists "DNS queries and traffic destinations" among the data it must collect, but also
        says it doesn't store the sites you visit. Until July 2025 the same list sat under what it doesn't collect.
      sources: [privacy, privacy-2024, no-logs-faq]
    dns:
      value: null
      note: >-
        The privacy policy lists "DNS queries and traffic destinations" among the data it must collect, but also
        says it doesn't store the sites you visit. Until July 2025 the same list sat under what it doesn't collect.
      sources: [privacy, privacy-2024, no-logs-faq]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: >-
        The privacy policy lists when you connect to a VPN server among the data it must collect, kept for your
        subscription plus 30 days. Until July 2025 the same list sat under what it doesn't collect.
      sources: [privacy, privacy-2024]
    bandwidth:
      value: null
      note: >-
        Its help centre says it keeps no data on bandwidth use, but lifetime plans sold since June 2024 have a
        monthly fair-use data limit.
      sources: [no-logs-faq, terms]
    source_ip:
      value: null
      note: >-
        The privacy policy says it collects which VPN servers and IP addresses you used, without saying whether
        that includes your own. Its help centre says it keeps no IP address data.
      sources: [privacy, no-logs-faq]
    proven: []
    policy: https://oystervpn.com/privacy-policy/

  transparency:
    audits:
      value: []
      note: The privacy policy says it carries out security audits, but none has been published.
      sources: [privacy]
    report:
      value: none
      sources: [home]
    canary:
      value: none
      sources: [home]
    bug_bounty:
      value: false
      sources: [home]
    incidents:
      value: []

  account:
    email:
      value: required
      sources: [checkout]
    personal_data:
      value: []
      sources: [checkout]
    payment:
      value: [card, paypal, app_store]
      note: Its pricing page title mentions Bitcoin, but checkout offers only cards and PayPal.
      sources: [checkout, payment-faq, pricing, play]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, proprietary, other]
      note: Its own protocol is Lightshell. Other is L2TP/IPsec and PPTP.
      sources: [faqs, protocols-faq, secure-protocols, wireguard-pr]
    post_quantum:
      value: none
      sources: [secure-protocols, wireguard-pr]
    kill_switch:
      value: null
      note: It says the kill switch blocks traffic when the VPN drops, but not whether it works at system level.
      sources: [kill-switch]
    dns:
      value: first_party
      evidence: claimed
      sources: [dns-faq]

  infra:
    ram_only:
      value: null
      note: It doesn't say whether its servers run from RAM.
      sources: [servers]
    hosting:
      value: null
      note: It doesn't say whether it owns or rents its servers.
      sources: [servers]
    virtual_locations:
      value: null
      note: Its help centre explains virtual servers without saying whether any of its own locations are virtual.
      sources: [virtual-servers, servers]
    servers:
      value: null
      note: Its plans list 413+ servers, while its server page counts 39.
      sources: [pricing, servers]
    countries:
      value: 32
      note: Its server page lists 39 countries but shows no servers in seven of them. Its plans say 40+.
      sources: [servers, pricing]

  features:
    connections:
      value: 5
      note: More are available as a paid add-on through support.
      sources: [pricing, devices-faq]
    multihop:
      value: false
      sources: [features]
    obfuscation:
      value: null
      note: Its no-logs page mentions an obfuscation or Camouflage mode without saying how it works or which apps have it.
      sources: [log-less, features]
    port_forwarding:
      value: false
      sources: [features]
    split_tunnel:
      value: true
      note: On Android and Windows only.
      sources: [split]
    blocking:
      value: [ads, malware]
      sources: [ad-blocker, anti-malware]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: >-
        Also Apple TV, Fire TV and Android TV apps. The browser extensions are proxies. Linux and routers use
        manual setup. The Android app was updated in September 2026.
      sources: [download, windows-app, mac-app, app-store, play, chrome-ext, linux, routers]
    open_source:
      value: none
      sources: [download, windows-app]
    telemetry:
      value: null
      note: >-
        App diagnostic reports are optional, but the privacy policy also uses Google Analytics in the apps
        without saying whether that can be turned off.
      sources: [privacy]
    fdroid:
      value: false
      sources: [download]

  pricing:
    monthly:
      value: { amount: 5.99, currency: USD }
      note: Its current offer makes the first $5.99 payment cover three months.
      sources: [pricing]
    best:
      value: { amount: 2.00, currency: USD }
      note: >-
        The monthly plan's first payment of $5.99 covers three months, which OysterVPN rounds to $1.99 a month.
        There's also a lifetime plan at $59.99.
      sources: [pricing]
    best_term:
      value: 3
      sources: [pricing]
    renewal_increase:
      value: 200
      note: After three months it's $5.99 a month. The yearly plan is $39.99 and renews at the same price.
      sources: [pricing]
    free_tier:
      value: false
      note: There's no free trial either.
      sources: [free-trial-faq]
    refund_days:
      value: 30
      note: Not for purchases through app stores, or for renewals.
      sources: [refund, terms, faqs]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Its terms say you "become anonymous" by masking your IP address, and it promises "military-grade
        encryption" and to "Browse the web anonymously".
      sources: [terms, play, log-less]
    affiliates:
      value: true
      note: Its affiliate programme pays 40% of new sales and 35% of renewals, and invites tech reviewers to join.
      sources: [affiliates]
    review_sites:
      value: false
      sources: [home]
    activism:
      value: false
      sources: [home]

