# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: SetupVPN
icon: setupvpn.png
checked: 2026-10-28

criteria:
  identity:
    website: https://setupvpn.com
    legal_entity:
      value: SetupVPN Inc
      note: The terms name SetupVPN Inc in Coral Gables, Florida, though they say the site's content is copyrighted under Bulgarian law.
      sources: [terms, play, chrome, app-store]
    owner:
      value: null
      note: Who owns SetupVPN Inc isn't public.
      sources: [play]
    founded:
      value: 2015
      note: The site says it has served clients since 2015. Its Firefox add-on was first listed in April 2016.
      sources: [home, amo]
    team:
      value: partial
      note: The Chrome Web Store's trader details name one person for SetupVPN Inc. Its own site names nobody.
      sources: [chrome, home]
    sister_brands:
      value: [Hoxx VPN]
      note: >-
        SetupVPN Inc and Hoxx Inc give the same suite at 815 Ponce de Leon Blvd, share the baseserver.io
        download service, and run near-identical FAQs.
      sources: [chrome, hoxx-chrome, download, hoxx-download, faq-abuse, hoxx-faq]
    acquisitions: []

  jurisdiction:
    hq:
      value: US
      sources: [terms, play]
    entities:
      value: [US]
      sources: [chrome]

  logging:
    traffic:
      value: 'yes'
      evidence: claimed
      note: >-
        The FAQ says it keeps proxy logs, including the websites you visit, for an unstated time, and
        works with the authorities when they ask for them.
      sources: [faq-abuse, faq-account]
    dns:
      value: 'yes'
      evidence: claimed
      note: DNS isn't mentioned as such, but the proxy logs it keeps hold the websites you visit.
      sources: [faq-abuse]
    timestamps:
      value: null
      note: The FAQ asks for the date and time of anything it's asked to look up, but doesn't say what its logs hold.
      sources: [faq-abuse]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: Free accounts have a daily data quota, so usage is counted per account.
      sources: [faq-general]
    source_ip:
      value: 'yes'
      evidence: claimed
      note: Its EULA says it collects and tracks your IP address, device details and usage statistics.
      sources: [eula]
    proven: []
    policy: https://setupvpn.com/privacy-policy/

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: optional
      evidence: claimed
      note: The site says you can register anonymously with a few clicks, while the FAQ talks about verifying your email address.
      sources: [how-it-works, faq-account, chrome-crx]
    personal_data:
      value: []
      note: The privacy policy says it may ask for your name, address and phone number, but signing up takes an email address at most.
      sources: [policy, how-it-works, chrome-crx]
    payment:
      value: [card, paypal, bitcoin]
      note: Premium is bought inside the apps. The FAQ also lists Alipay, and Stripe and Paymentwall as processors.
      sources: [faq-premium]

  security:
    protocols:
      value: [other]
      note: >-
        The Android app uses Shadowsocks through Jigsaw's Outline client code, and the browser extensions
        are an HTTP or HTTPS proxy for that browser alone. The other apps' protocols aren't published.
      sources: [android-apk, chrome-crx, firefox-xpi]
    post_quantum: none
    kill_switch: null
    dns: null

  infra:
    ram_only: null
    hosting: null
    virtual_locations: null
    servers:
      value: null
      note: The store listings say over 100 servers.
      sources: [chrome, play]
    countries:
      value: null
      note: The site says over 100 locations, and the Android app only lists the ones users near you have connected to.
      sources: [home, android-apk]

  features:
    connections:
      value: null
      note: The FAQ says you can use several browsers and computers at once, without giving a limit.
      sources: [faq-general]
    multihop: false
    obfuscation:
      value: [shadowsocks]
      note: Shadowsocks is the Android app's protocol, and the site says it gets around government filtering.
      sources: [android-apk, home]
    port_forwarding: false
    split_tunnel:
      value: true
      note: The Android app can leave chosen apps out of the VPN, or send only chosen apps through it.
      sources: [android-apk]
    blocking:
      value: [malware]
      evidence: claimed
      note: The FAQ also claims it stops ad networks tracking you, without saying how.
      sources: [faq-general]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: >-
        The Chrome, Firefox and Edge extensions are a proxy for that browser alone. Firefox's was last
        updated in June 2024, Chrome's and Edge's and the Windows app in January 2025, and the Android,
        iPhone and Mac apps in 2026.
      sources: [download, chrome, amo, edge, windows, play, app-store, mac-app-store]
    open_source:
      value: null
      note: >-
        The Firefox add-on is listed under the GPL 3.0, but it ships minified with no published source,
        and the FAQ says you may not modify or reuse the code. The Android app builds on the open source
        Outline client without publishing its own.
      sources: [amo, firefox-xpi, faq-general, android-apk]
    telemetry:
      value: forced
      note: >-
        The browser extensions report any address that fails a DNS lookup, with the page you were on and
        your account ID, and the code doesn't wait for the proxy to be on. The Android app sends crash
        reports and usage events, with no setting to stop either.
      sources: [chrome-crx, firefox-xpi, android-apk, eula]
    fdroid: false

  pricing:
    monthly:
      value: null
      note: Premium is only sold inside the apps, with no published prices.
      sources: [faq-premium]
    best:
      value: null
      note: Premium is only sold inside the apps, with no published prices.
      sources: [faq-premium]
    best_term: null
    renewal_increase:
      value: null
      grade: na
      note: Premium isn't a subscription, so it drops back to the free plan instead of renewing.
      sources: [faq-premium]
    free_tier:
      value: true
      note: >-
        Free accounts get a daily data quota, though the store listings say unlimited bandwidth. Free
        accounts unused for 180 days may be closed.
      sources: [faq-general, faq-account, chrome]
    refund_days:
      value: null
      note: No refund window is given, and the FAQ says slow speeds don't get a refund.
      sources: [terms, eula, faq-premium]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It promises 4096-bit military grade encryption, end-to-end encryption and unlimited bandwidth,
        while free accounts have a daily quota and it keeps logs of the sites you visit for the authorities.
      sources: [chrome, play, faq-general, faq-abuse]
    affiliates:
      value: false
      sources: [faq-general]
    review_sites: false
    activism: false

