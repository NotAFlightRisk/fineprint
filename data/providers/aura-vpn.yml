# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Aura VPN
icon: aura-vpn.png
checked: 2026-10-22

criteria:
  identity:
    website: https://www.aura.com/vpn
    legal_entity:
      value: Aura Sub, LLC
      note: A subsidiary of Aura Consolidated Group, Inc., a Delaware company based in Boston.
      sources: [terms, play, s1]
    owner:
      value: null
      note: >-
        Aura Consolidated Group, Inc. has been listed on the Australian Securities Exchange as AXQ since
        July 2026. WndrCo is its biggest holder, with about 23%.
      sources: [s1]
    founded:
      value: 2021
      note: The earliest archived Aura pricing page, from June 2021, lists it as WiFi Security VPN.
      sources: [wayback-2021]
    team:
      value: partial
      note: Aura's executives are named, but no one running the VPN is.
      sources: [leadership]
    sister_brands:
      value: []
      note: >-
        Point Wild, which runs the VPN service, is a separate company, though Aura's CEO chairs it and
        WndrCo's partners sit on both boards.
      sources: [s1]
    acquisitions:
      value: []
      note: Aura split from Pango, now Point Wild, in 2024, with the same shareholders owning both.
      sources: [aura-split-2024]

  jurisdiction:
    hq:
      value: US
      sources: [terms]
    entities:
      value: [US, CH, AU, GB]
      note: >-
        Aura Sub, LLC sells it from Boston. The group also has Aura Growth GmbH in Switzerland and, since
        taking over Qoria in July 2026, companies in Australia and the UK.
      sources: [terms, s1, s1-subsidiaries]

  logging:
    traffic:
      value: aggregate
      evidence: claimed
      note: >-
        It doesn't inspect what you send, but it logs the domains people visit, without full URLs or
        anything that identifies them, and aggregates them about monthly.
      sources: [vpn-notice]
    dns:
      value: aggregate
      evidence: claimed
      note: Domains visited are logged without a user or device attached and aggregated about monthly.
      sources: [vpn-notice]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: >-
        It logs how long each VPN session lasts and ties usage to a hash of your device, without saying
        how long it keeps it. Its AI features also analyse VPN connection metadata.
      sources: [vpn-notice, privacy-policy]
    bandwidth:
      value: 'yes'
      evidence: claimed
      note: It logs the data each session uses against your device hash, without saying how long it keeps it.
      sources: [vpn-notice]
    source_ip:
      value: temporary
      evidence: claimed
      note: >-
        Kept encrypted until the session ends, for fraud checks on payments. It also uses your IP to work
        out your rough location and ISP, and to attribute ads.
      sources: [vpn-notice]
    proven:
      value: []
      note: No audit of Aura's VPN has been published. Aon's 2023 no-logs review covered Hotspot Shield, Point Wild's own VPN.
      sources: [audit-aon-2023]
    policy: https://www.aura.com/privacy/vpn-products

  transparency:
    audits:
      value: []
      note: >-
        None published for the VPN. Aura cites ISO 27001 and SOC 2 Type II, which cover how it manages
        security, not the VPN itself.
      sources: [data-security]
    report:
      value: none
      note: Its privacy policy says it challenges requests it thinks are unlawful or overbroad, but it publishes no report.
      sources: [privacy-policy]
    canary: none
    bug_bounty:
      value: false
      note: Its security standards mention scans and penetration tests, but no bug bounty or disclosure programme.
      sources: [security-standards]
    incidents:
      value:
        - date: 2026-03-01
          summary: >-
            A phone phishing attack gave an intruder an hour in an employee's account in March 2026,
            exposing about 900,000 marketing records, with contact details for under 20,000 current and
            15,000 former customers, and some IP addresses. Aura published a statement and an update,
            notified customers and law enforcement, and said no passwords or financial data were taken.
          handled: well
          source: breach-2026
      note: The day of the attack isn't given, so it's dated to the month.
      sources: [breach-2026, breach-2026-update]

  account:
    email:
      value: required
      sources: [enroll]
    personal_data:
      value: [name, address, phone, dob]
      note: The free-trial sign-up also asks for your Social Security number, checked against Equifax.
      sources: [enroll]
    payment:
      value: [card, paypal, app_store]
      note: Prepaid cards aren't accepted. The Android app also sells subscriptions through Google Play.
      sources: [enroll, play]

  security:
    protocols:
      value: null
      note: Aura doesn't name one. Its S-1 says it licenses Point Wild's Hydra VPN backend.
      sources: [vpn-page, s1]
    post_quantum:
      value: none
      note: Nothing Aura publishes mentions post-quantum key exchange.
      sources: [vpn-page]
    kill_switch:
      value: app
      note: A setting on Windows, iOS and Android, not macOS, and an add-on that not every plan includes.
      sources: [kill-switch]
    dns:
      value: null
      note: Aura doesn't say whose DNS servers answer your lookups.
      sources: [vpn-notice]

  infra:
    ram_only:
      value: null
      note: Aura doesn't say whether its VPN servers run from RAM.
      sources: [vpn-notice]
    hosting:
      value: null
      note: >-
        Aura only says its servers are with infrastructure providers. Its S-1 says Point Wild, Hotspot
        Shield's owner, provides the VPN service and SDKs under a platform-as-a-service deal.
      sources: [vpn-notice, s1]
    virtual_locations:
      value: null
      note: Aura calls every location virtual, without saying where the servers physically sit.
      sources: [locations]
    servers:
      value: null
      note: Aura gives no server count, only 100+ virtual locations.
      sources: [vpn-page]
    countries:
      value: 85
      note: Counted from its location list. Aura says choosing a location isn't available on every plan.
      sources: [locations, change-location]

  features:
    connections:
      value: 3
      note: The cheapest plan, Antivirus, covers 3 devices. The Individual plan covers 10, and the others 10 per adult.
      sources: [antivirus-plans, pricing, vpn-page]
    multihop:
      value: false
      sources: [vpn-page]
    obfuscation:
      value: []
      note: None offered, and Aura says the VPN doesn't work in China or the Middle East.
      sources: [what-is-vpn]
    port_forwarding:
      value: false
      sources: [vpn-page]
    split_tunnel:
      value: true
      note: An add-on not every plan includes, and not on macOS. Android picks apps, iOS websites, Windows both.
      sources: [split-tunneling]
    blocking:
      value: [malware]
      note: It blocks known scam and phishing sites. Ad and tracker blocking is a separate browser extension on dearer plans.
      sources: [vpn-page, vpn-plans]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: It runs inside the Aura app. Routers, smart TVs and games consoles aren't supported.
      sources: [compatibility]
    open_source:
      value: none
      sources: [terms]
    telemetry:
      value: null
      note: >-
        The privacy policy says it collects how often and how long you use its services, without mentioning
        a way to turn this off.
      sources: [privacy-policy]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 15, currency: USD }
      note: The Individual plan, billed monthly. The cheaper plans that include the VPN are only sold yearly.
      sources: [pricing, antivirus-plans]
    best:
      value: { amount: 3, currency: USD }
      note: >-
        The Antivirus plan, $35.99 for the first year, bundles the VPN with antivirus for 3 devices. Only the
        dearest plan on that page lists virtual locations.
      sources: [antivirus-plans]
    best_term:
      value: 12
      sources: [antivirus-plans]
    renewal_increase:
      value: 94
      note: >-
        $35.99 for the first year, then $69.99 a year. Aura's VPN landing page sells a similar 3-device plan
        for $36 that renews at $44.99.
      sources: [antivirus-plans, vpn-plans]
    free_tier:
      value: false
      note: Only a 14-day free trial.
      sources: [pricing]
    refund_days:
      value: 60
      note: Only for annual plans bought from Aura directly, not monthly plans or app store purchases.
      sources: [refund-policy]

  ethics:
    misleading_claims:
      value: true
      note: It promises "military-grade encryption" and that you can "browse privately wherever you are".
      sources: [vpn-page]
    affiliates:
      value: true
      note: It pays $65 per qualified sign-up, and says Security.org, whose ranking it quotes, may be paid as its affiliate.
      sources: [affiliate-program, play]
    review_sites:
      value: false
      note: >-
        Comparitech, a VPN review site, was in Aura's group from late 2021 until the 2024 split. It now
        belongs to Point Wild, which runs Aura's VPN and is chaired by Aura's CEO.
      sources: [comparitech-disclosure, s1]
    activism: false

