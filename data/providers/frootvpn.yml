# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: FrootVPN
icon: frootvpn.svg
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://frootvpn.com
      sources: [home]
    legal_entity:
      value: Edelino Commerce Inc.
      note: >-
        The terms and privacy policy only say Frootvpn.com. The legal statement names Edelino Commerce Inc. of
        the Seychelles, and its own 2019 website called it Edelino Commerce Ltd, at a Victoria address.
      sources: [legal, edelino-2019]
    owner:
      value: null
      note: Nothing published says who owns Edelino Commerce.
      sources: [edelino-2019]
    founded:
      value: 2014
      note: The earliest archived copy of the live service is from October 2014.
      sources: [wayback-2014]
    team:
      value: anonymous
      note: No one is named. The canary is signed only as the CTO of Edelino Commerce.
      sources: [about, canary]
    sister_brands:
      value: [Anonine, BoxPN, Easy Hide IP, VPNTunnel]
      note: >-
        Anonine, BoxPN and Easy Hide IP name Edelino Commerce Inc. on their sites, and it sells the Anonine,
        BoxPN and VPNTunnel iOS apps, though VPNTunnel's own site names Digital Sales Solutions LLC.
      sources: [anonine, boxpn, easy-hide-ip, vpntunnel-app, vpntunnel]
    acquisitions:
      value: null
      note: >-
        In 2017 the site named Frootynet AB of Stockholm, and from 2019 Edelino Commerce Inc. in the Seychelles.
        Whether that was a sale isn't published.
      sources: [legal-2017, legal-2019]

  jurisdiction:
    hq:
      value: SC
      evidence: claimed
      note: The terms' refund clause still cites Swedish consumer law.
      sources: [legal, terms]
    entities:
      value: [SC]
      sources: [legal, edelino-2019]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy-policy]
    dns:
      value: none
      evidence: claimed
      sources: [legal]
    timestamps:
      value: none
      evidence: claimed
      sources: [privacy-policy]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: It keeps how much traffic each account has used, and how many connections it has open.
      sources: [legal]
    source_ip:
      value: none
      evidence: claimed
      sources: [privacy-policy]
    proven:
      value: []
      sources: [canary]
    policy: https://frootvpn.com/privacy-policy

  transparency:
    audits:
      value: []
      sources: [about]
    report:
      value: none
      sources: [about, canary]
    canary:
      value: maintained
      note: >-
        PGP-signed and re-signed about once a year, most recently on 13 August 2026. The July 2021 statement was
        still up in June 2023.
      sources: [canary, canary-2023, canary-2024]
    bug_bounty:
      value: false
      sources: [help-centre]
    incidents: []

  account:
    email:
      value: required
      sources: [order, privacy-policy]
    personal_data:
      value: []
      sources: [order, privacy-policy]
    payment:
      value: [card, paypal]
      note: Cards are taken through PayPal. The only other option is Perfect Money, an online payment service.
      sources: [order]

  security:
    protocols:
      value: [openvpn, ikev2, other]
      note: Other is L2TP/IPsec, IPsec IKEv1, SSTP and PPTP. Everything but the Windows client is set up by hand.
      sources: [protocols, help-centre, ikev2-ios, free-trial]
    post_quantum:
      value: none
      sources: [protocols, help-centre]
    kill_switch:
      value: app
      note: Only in the Windows client.
      sources: [kill-switch]
    dns:
      value: null
      note: It doesn't say which DNS servers answer inside the tunnel.
      sources: [help-centre]

  infra:
    ram_only:
      value: null
      note: It says its servers keep no access logs, but not whether they run from RAM.
      sources: [legal]
    hosting:
      value: null
      note: >-
        It doesn't say. Its network is shared with sister brand Easy Hide IP: 714 of the 732 server IPs it listed
        in December 2020 were on Easy Hide IP's list a month later.
      sources: [servers-2020, ehip-servers-2021]
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
      sources: [servers]
    servers:
      value: 150
      note: It says "150+ VPN servers". Its server status page listed none on 2026-10-27.
      sources: [order, servers]
    countries:
      value: 32
      note: It says "over 32 countries".
      sources: [order]

  features:
    connections:
      value: 5
      sources: [home]
    multihop:
      value: false
      sources: [features]
    obfuscation:
      value: [stunnel]
      note: OpenVPN wrapped in Stunnel, set up by hand.
      sources: [stunnel-mac, stunnel-android]
    port_forwarding:
      value: false
      note: Incoming connections to users are never allowed.
      sources: [port-fail]
    split_tunnel:
      value: false
      sources: [features]
    blocking:
      value: []
      sources: [features]

  clients:
    platforms:
      value: [windows]
      note: >-
        The Windows client downloads from the account area. Everything else, routers included, uses manual
        OpenVPN, IKEv2, L2TP or PPTP setups.
      sources: [windows-client, kill-switch, help-centre]
    open_source:
      value: none
      sources: [windows-client]
    telemetry:
      value: null
      note: It doesn't say whether the Windows client sends usage or crash data.
      sources: [windows-client, privacy-policy]
    trackers:
      value: null
      grade: na
      note: There's no Android app. Android uses manual OpenVPN, IPsec, L2TP or PPTP setups.
      sources: [android-openvpn, help-centre]
    fdroid:
      value: false
      sources: [help-centre]

  pricing:
    monthly:
      value: { amount: 29.98, currency: USD }
      sources: [home]
    best:
      value: { amount: 6.36, currency: USD }
      note: 76.32 USD a year. A quarter costs 40.45 USD.
      sources: [home]
    best_term:
      value: 12
      sources: [home]
    renewal_increase:
      value: 0
      note: Each plan is billed at the same price every term, and automatic renewal is optional at checkout.
      sources: [home, order]
    free_tier:
      value: false
      sources: [order]
    refund_days:
      value: 30
      note: The terms only promise a refund if the service didn't meet "reasonable expectations".
      sources: [terms, home]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It says no one can trace you, "not even the best hackers and spying agencies, or even your government",
        and sells "military grade encryption".
      sources: [home, order]
    affiliates:
      value: true
      note: Up to 50% commission.
      sources: [affiliate]
    review_sites:
      value: null
      note: No sign it owns any, but who owns Edelino Commerce isn't published.
    activism:
      value: false
      sources: [about]

  other:
    concerns:
      value:
        - summary: >-
            Visitors who arrive through an affiliate link have their IP address logged and stored indefinitely,
            so a later order can be credited to the affiliate.
          severity: minor
          source: affiliate

