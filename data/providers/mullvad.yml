# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Mullvad VPN
icon: mullvad.svg
checked: 2026-10-18

criteria:
  identity:
    website:
      value: https://mullvad.net
      sources: [about]
    legal_entity:
      value: Mullvad VPN AB
      sources: [privacy-policy, terms]
    owner:
      value: Amagicom AB
      note: Both Amagicom AB and Mullvad VPN AB are wholly owned by founders Fredrik Strömberg and Daniel Berntsson.
      sources: [about]
    founded:
      value: 2009
      sources: [about]
    team:
      value: public
      note: The two founders are named in full, the rest of the team by first name.
      sources: [about]
    sister_brands:
      value: []
      note: Mozilla VPN runs on Mullvad's servers under a partnership, but Mullvad doesn't own it.
      sources: [resellers]
    acquisitions:
      value: []
      sources: [about]

  jurisdiction:
    hq:
      value: SE
      sources: [terms]
    entities:
      value: [SE]
      sources: [about, raid-2023-update]

  logging:
    traffic:
      value: none
      evidence: verified
      note: Swedish police searched the office with a warrant in 2023 and left without any customer data.
      sources: [policy, raid-2023, audit-assured-relay-2022]
    dns:
      value: none
      evidence: verified
      sources: [policy, raid-2023, audit-assured-relay-2022]
    timestamps:
      value: none
      evidence: verified
      note: Connections per account are counted in memory to enforce the five-device limit, and not stored.
      sources: [policy, raid-2023, audit-assured-relay-2022]
    bandwidth:
      value: none
      evidence: verified
      note: Only each server's total bandwidth is recorded, for monitoring.
      sources: [policy, raid-2023, audit-assured-relay-2022]
    source_ip:
      value: none
      evidence: verified
      sources: [policy, raid-2023, audit-assured-relay-2022]
    proven:
      value: [seizure, audit]
      evidence: verified
      note: Police searched the Gothenburg office in April 2023 at Germany's request and left with nothing. Server audits in 2022 and 2023 found no logging of user activity.
      sources: [raid-2023, raid-2023-update, audit-assured-relay-2022, audit-ros-2023]
    policy: https://mullvad.net/en/help/no-logging-data-policy

  transparency:
    audits:
      value:
        - date: 2026-04-10
          auditor: Leviathan Security Group
          scope: apps
          source: audit-leviathan-2026
        - date: 2026-02-17
          auditor: Assured
          scope: apps
          source: audit-assured-gotatun-2026
        - date: 2026-01-20
          auditor: X41 D-Sec
          scope: apps
          source: audit-x41-2026
        - date: 2025-10-13
          auditor: Assured
          scope: apps
          source: audit-assured-webapp-2025
        - date: 2025-03-20
          auditor: Assured
          scope: apps
          source: audit-assured-loader-2025
        - date: 2025-02-24
          auditor: NCC Group
          scope: apps
          source: audit-ncc-2025
        - date: 2024-12-10
          auditor: X41 D-Sec
          scope: apps
          source: audit-x41-2024
        - date: 2024-06-27
          auditor: Cure53
          scope: infra
          source: audit-cure53-2024
        - date: 2023-08-07
          auditor: Radically Open Security
          scope: infra
          source: audit-ros-2023
        - date: 2022-12-20
          auditor: Assured
          scope: apps
          source: audit-assured-api-2022
        - date: 2022-10-14
          auditor: Atredis Partners
          scope: apps
          source: audit-atredis-2022
        - date: 2022-09-13
          auditor: Assured
          scope: infra
          source: audit-assured-dns-2022
        - date: 2022-06-21
          auditor: Assured
          scope: infra
          source: audit-assured-relay-2022
        - date: 2021-01-19
          auditor: Cure53
          scope: infra
          source: audit-cure53-2021
        - date: 2020-06-12
          auditor: Cure53
          scope: apps
          source: audit-cure53-2020
        - date: 2018-09-20
          auditor: Cure53
          scope: apps
          source: audit-cure53-2018
      evidence: verified
      note: The VPN servers were last audited by Cure53 in June 2024, just over two years ago. Everything since covers the apps, website and account and payment systems.
      sources: [audits-page]
    report:
      value: none
      note: Mullvad says it answers data requests by pointing to its no-logging policy, but publishes no figures.
      sources: [gov-requests, policies]
    canary:
      value: none
      sources: [policies]
    bug_bounty:
      value: false
      note: It has a disclosure policy and promises not to sue researchers, but doesn't pay.
      sources: [bug-report]
    incidents:
      value:
        - date: 2026-05-15
          summary: A third-party write-up showed users got exit IPs at the same relative spot on every server, so sites could often link someone who switched servers. Mullvad disclosed it five days later and its fix covered 96% of servers by October 2026.
          handled: well
          source: exit-ip
        - date: 2024-04-22
          summary: A Reddit user found DNS queries leaking on Android around reconnects. The root cause is in Android; Mullvad confirmed it, published details and shipped a partial workaround in May 2024.
          handled: well
          source: android-dns-leak
        - date: 2023-04-18
          summary: Swedish police searched the Gothenburg office with a warrant, at Germany's request, to seize customer data. They left with nothing, as none was stored.
          handled: well
          source: raid-2023
      sources: [exit-ip-rollout, android-changelog, raid-2023-update]

  account:
    email:
      value: none
      note: Signing up just generates a random account number.
      sources: [policy]
    personal_data:
      value: []
      sources: [policy]
    payment:
      value:
        [card, paypal, bank, app_store, bitcoin, lightning, monero, other_crypto, cash, gift_card]
      note: Other crypto is Bitcoin Cash. Gift cards are activation codes sold through Amazon and other resellers.
      sources: [pricing, terms, lightning, restrictive, resellers]

  security:
    protocols:
      value: [wireguard]
      note: OpenVPN left the desktop apps in December 2025 and its servers were gone by 15 January 2026.
      sources: [openvpn-removal, terms]
    post_quantum:
      value: default
      note: On by default on desktop since January 2025 and on Android and iOS since late 2025.
      sources: [pq-desktop, review-2025, android-changelog, ios-changelog]
    kill_switch:
      value: system
      note: Always on while connected and can't be turned off. An optional lockdown mode also blocks traffic while disconnected.
      sources: [faq, using-app]
    dns:
      value: first_party
      note: The separate public encrypted DNS service shuts on 2 November 2026, which doesn't affect DNS inside the VPN.
      sources: [dns-help, quad9]

  infra:
    ram_only:
      value: all
      evidence: claimed
      sources: [server-list, ram-only]
    hosting:
      value: mixed
      note: 120 of 553 WireGuard servers were listed as owned on 2026-10-18. The rest are dedicated servers rented from hosts.
      sources: [server-list, relays-api]
    virtual_locations:
      value: none
      sources: [server-list]
    servers:
      value: 553
      note: WireGuard servers on the list on 2026-10-18, 535 of them online. Leaves out 13 bridge servers.
      sources: [servers, relays-api]
    countries:
      value: 50
      sources: [servers, relays-api]

  features:
    connections:
      value: 5
      sources: [pricing, terms]
    multihop:
      value: true
      sources: [multihop-help, multihop-modes]
    obfuscation:
      value: [shadowsocks, udp2tcp, quic, proprietary]
      note: Its own method is LWO, open source WireGuard header scrambling.
      sources: [restrictive, lwo]
    port_forwarding:
      value: false
      note: Dropped in 2023 over abuse.
      sources: [port-forwarding]
    split_tunnel:
      value: true
      note: Windows, macOS, Linux and Android, not iOS.
      sources: [split-tunnel]
    blocking:
      value: [ads, trackers, malware]
      note: Also has adult content, gambling and social media lists.
      sources: [dns-blocklists]

  clients:
    platforms:
      value: [windows, macos, linux_gui, linux_cli, ios, android]
      note: Routers use WireGuard config files rather than an app. The Firefox extension only works alongside the VPN app, so isn't counted.
      sources: [downloads, cli]
    open_source:
      value: all
      note: GPL-3.0, covering the desktop, Android and iOS apps.
      sources: [source-code]
    telemetry:
      value: none
      evidence: claimed
      note: The apps only make a daily update check, sending the app and OS version, which Mullvad counts in aggregate.
      sources: [telemetry-doc]
    trackers:
      value: 0
      note: The newest Exodus report that would load was for version 2025.6, from August 2025.
      sources: [exodus]
    fdroid:
      value: true
      sources: [fdroid]

  pricing:
    monthly:
      value: { amount: 5, currency: EUR }
      sources: [pricing]
    best:
      value: { amount: 5, currency: EUR }
      note: Every plan length costs the same. Crypto payments get 10% off.
      sources: [pricing]
    best_term:
      value: 1
      sources: [pricing]
    renewal_increase:
      value: 0
      note: One flat rate since 2009, with no intro deals.
      sources: [pricing]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 14
      note: No refunds on cash or crypto payments. Cut from 30 days in January 2025.
      sources: [terms, refund-change]

  ethics:
    misleading_claims:
      value: false
      sources: [vpn-page]
    affiliates:
      value: false
      note: Sells activation codes through resellers such as Amazon, but pays no affiliates or influencers.
      sources: [affiliates]
    review_sites:
      value: false
      sources: [affiliates]
    activism:
      value: true
      note: Campaigns against the EU's Chat Control proposal, is a paying Tor Project member and sponsors Quad9.
      sources: [chat-control, tor-shallot, quad9]

