# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Touch VPN
icon: touch-vpn.png
checked: 2026-10-26

criteria:
  identity:
    website: https://www.touchvpn.net
    legal_entity:
      value: VPN Proxy Pro, LLC
      note: >-
        The terms add its affiliate TouchVPN LLC and call it a division of Pango Group. The App Store names
        TouchVPN Inc as the seller, and Google Play's developer details give CF Newco, Inc. at Pango's Boston
        address.
      sources: [tos, privacy-policy, ios-app, play]
    owner:
      value: Point Wild
      note: >-
        AnchorFree, Hotspot Shield's maker, took over Touch VPN from its developer Northghost in 2019. Aura
        bought AnchorFree, by then called Pango, in 2020 and spun Pango off in 2024, and Pango Group then
        merged with Total Security to form Point Wild.
      sources: [policy-2018, policy-2019, aura-pango-2020, aura-split-2024, point-wild-merger, comparitech-disclosure]
    founded:
      value: null
      note: Touch VPN doesn't say when it launched. Its Android app, then listed under Northghost, was last updated in January 2015.
      sources: [play-2015]
    team:
      value: partial
      note: There's no Touch VPN leadership page, but Pango's site names its president and other executives.
      sources: [pango-team]
    sister_brands:
      value: [Hotspot Shield, Betternet, UltraVPN, VPN 360, TotalAV VPN, OVPN, VPN in Touch]
      note: TotalAV's VPN joined the family when Pango Group merged with TotalAV's maker, Total Security.
      sources: [aura-split-2024, privacy-vpn, point-wild-merger, totalav-vpn, ovpn-next-chapter, vpn-in-touch]
    acquisitions:
      value:
        - date: 2024-12-12
          acquirer: Point Wild
          source: point-wild-merger
        - date: 2024-09-03
          acquirer: Pango Group, spun off from Aura
          source: aura-split-2024
        - date: 2020-07-07
          acquirer: Aura
          source: aura-pango-2020
        - date: 2019-01-01
          acquirer: AnchorFree, now Pango
          source: policy-2019
      note: >-
        Only the year of the AnchorFree takeover is known: Touch VPN's privacy policy named Northghost in
        December 2018 and AnchorFree by April 2019. Point Wild was formed when Pango Group merged with Total
        Security in December 2024.
      sources: [policy-2018, policy-2019, aura-pango-2020, aura-split-2024, point-wild-merger]

  jurisdiction:
    hq:
      value: US
      sources: [tos]
    entities:
      value: [US]
      note: VPN Proxy Pro, LLC is in Boston. The policy says data may go to group companies, including Pango GmbH in Switzerland.
      sources: [tos, privacy-policy]

  logging:
    traffic:
      value: aggregate
      evidence: claimed
      note: >-
        It doesn't inspect what you send, but it logs the domains people visit, without full URLs or
        anything that identifies them, and aggregates them about monthly.
      sources: [privacy-notice]
    dns:
      value: aggregate
      evidence: claimed
      note: Domains visited are logged without a user or device attached and aggregated about monthly.
      sources: [privacy-notice]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: >-
        It logs how long each VPN session lasts and ties usage data to a hash of your device, without
        saying how long it keeps it.
      sources: [privacy-notice, privacy-policy]
    bandwidth:
      value: 'yes'
      evidence: claimed
      note: >-
        It logs the data each session uses and measures it against a device hash, partly to enforce the
        free app's limits, without saying how long it keeps it.
      sources: [privacy-notice]
    source_ip:
      value: temporary
      evidence: claimed
      note: >-
        Kept encrypted until the session ends. It also uses your IP to work out your rough location and
        ISP, and to attribute ads.
      sources: [privacy-notice]
    proven:
      value: []
      note: Pango's 2023 Aon reviews cover Hotspot Shield, Betternet, UltraVPN and VPN360, not Touch VPN.
      sources: [point-wild-reports]
    policy: https://www.touchvpn.net/privacy-notice.html

  transparency:
    audits:
      value: []
      note: Pango's 2023 Aon reviews cover Hotspot Shield, Betternet, UltraVPN and VPN360, not Touch VPN.
      sources: [point-wild-reports]
    report:
      value: irregular
      note: The newest is Pango's group-wide report for 2023, published by Point Wild.
      sources: [pango-transparency-2023, point-wild-reports]
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: required
      note: The free app works without an account.
      sources: [android-features, ios-sign-in]
    personal_data:
      value: null
      note: The privacy policy says creating an account may collect your name as well as your email, without saying which you have to give.
      sources: [privacy-policy]
    payment:
      value: [app_store]
      note: Touch VPN has no pricing page of its own, so Premium is bought in the apps.
      sources: [ios-app, play, cancel-ios]

  security:
    protocols:
      value: [proprietary, openvpn, wireguard]
      note: >-
        The Android app offers Hydra, Pango's own protocol, plus OpenVPN and WireGuard. Help articles for
        iOS and Mac also name IKEv2.
      sources: [android-settings, ios-settings]
    post_quantum: none
    kill_switch:
      value: app
      note: A setting that cuts the internet if the VPN drops.
      sources: [android-settings, ios-settings]
    dns:
      value: null
      note: It claims DNS leak protection, but not whose servers answer DNS requests.
      sources: [ios-settings]

  infra:
    ram_only:
      value: null
      note: Touch VPN doesn't say its servers run from RAM.
    hosting:
      value: rented
      sources: [privacy-notice]
    virtual_locations:
      value: null
      note: >-
        It calls every location "virtual", and one help article offers India via Singapore, but its
        location lists just say India.
      sources: [android-locations, speed-test]
    servers:
      value: 5900
      note: The homepage says over 5,900, in the same breath as both 80+ and 90+ countries.
      sources: [home]
    countries:
      value: null
      note: The homepage says both 80+ and 90+ countries, while the help centre's location list has 56.
      sources: [home, android-locations]

  features:
    connections:
      value: 5
      note: For Premium. The App Store listing says up to 5 users with 5 devices each.
      sources: [premium-mac, ios-app]
    multihop: false
    obfuscation:
      value: null
      note: Touch VPN doesn't say whether Hydra disguises traffic, though Hotspot Shield says the same protocol does.
      sources: [android-settings, hss-protocols]
    port_forwarding: false
    split_tunnel:
      value: null
      note: Help articles for iOS and Mac claim it, but the Android settings don't include it.
      sources: [ios-settings, mac-advanced, android-settings]
    blocking:
      value: [malware]
      note: It may block sites known to be malicious.
      sources: [privacy-notice]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: The Chrome, Firefox and Edge extensions only cover the browser. There's no Linux or router app.
      sources: [devices, chrome, firefox]
    open_source: none
    telemetry:
      value: null
      note: >-
        The policy says it ties how you use the app to a hash of your device for analytics and marketing,
        but doesn't mention a way to turn this off.
      sources: [privacy-notice, privacy-policy]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 12.99, currency: USD }
      note: Premium, from the US App Store.
      sources: [ios-app]
    best:
      value: { amount: 6.67, currency: USD }
      note: $79.99 a year for Premium on iOS. The Mac App Store lists $77.99.
      sources: [ios-app, mac-app]
    best_term:
      value: 12
      sources: [ios-app]
    renewal_increase:
      value: 0
      note: The App Store prices are what each plan renews at.
      sources: [ios-app]
    free_tier:
      value: true
      note: Ad-supported, on one automatically picked location with usage limits. Other locations need Premium.
      sources: [virtual-location, privacy-notice, ios-app]
    refund_days:
      value: 0
      note: >-
        The terms say direct purchases aren't refundable unless the law requires it. App Store purchases go
        through Apple's own refund process.
      sources: [tos, refund]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It promises "banking-level security", that "your online identity is anonymous", and a help article
        says it stores nothing about your online activity, while its privacy notice lists session lengths,
        bandwidth and domains.
      sources: [home, no-logs-faq, privacy-notice]
    affiliates:
      value: null
      note: Touch VPN doesn't publish an affiliate scheme of its own, though its sister Hotspot Shield runs one.
      sources: [hss-affiliates]
    review_sites:
      value: true
      note: Point Wild also owns Comparitech, a VPN review site, which discloses it.
      sources: [comparitech-disclosure]
    activism: false

