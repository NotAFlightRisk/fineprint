# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Trend Micro VPN
icon: trend-micro-vpn.svg
checked: 2026-10-21

criteria:
  identity:
    website: https://www.trendmicro.com/en_us/forHome/products/trend-micro-vpn.html
    legal_entity:
      value: Trend Micro Incorporated
      note: >-
        The Irving, Texas company sells it in the US and Canada. Elsewhere it depends on where you live,
        such as Trend Micro (Ireland) Limited in the UK and Europe.
      sources: [consumer-terms, play]
    owner:
      value: null
      note: Trend Micro Incorporated in Japan is listed on the Tokyo Stock Exchange (4704).
      sources: [ir]
    founded:
      value: null
      note: Trend Micro doesn't say when it launched. It was sold as VPN Proxy One Pro and WiFi Protection before the rename.
      sources: [rename]
    team:
      value: partial
      note: Trend Micro's executives are named, but no one running the VPN is.
      sources: [leaders]
    sister_brands:
      value: []
      note: VPN Proxy One Pro and WiFi Protection were merged into it.
      sources: [rename]
    acquisitions:
      value: []
      sources: [rename]

  jurisdiction:
    hq:
      value: JP
      note: Trend Micro is listed in Tokyo. US customers deal with Trend Micro Incorporated in Irving, Texas.
      sources: [ir, consumer-terms]
    entities:
      value: [JP, US, BR, CO, MX, IE, AE, AU, SG, TW, HK, KR]
      note: The companies its consumer terms name as the seller, by country.
      sources: [consumer-terms]

  logging:
    traffic:
      value: 'yes'
      evidence: claimed
      note: >-
        The data collection notices list scanned URLs, and HTTP URLs for traffic routing and a proxy cache,
        among what the VPN sends Trend Micro. They don't say how long either is kept.
      sources: [notice, notice-ios, notice-mac]
    dns:
      value: null
      note: The notices don't mention DNS queries, though the URLs they collect include the domain.
      sources: [notice-ios, notice-mac]
    timestamps:
      value: null
      note: The notices list app session length for analytics, but say nothing about VPN connection times.
      sources: [notice, notice-ios]
    bandwidth:
      value: null
      note: Not mentioned in the data collection notices.
      sources: [notice-ios, notice-mac]
    source_ip:
      value: null
      note: >-
        The iOS and Mac notices list an IP address as collected for traffic routing, and the main notice
        puts one in crash and issue logs. None says which address or for how long.
      sources: [notice-ios, notice-mac, notice]
    proven:
      value: []
      note: No audit has been published.
      sources: [support]
    policy: https://helpcenter.trendmicro.com/en-us/article/TMKA-20103

  transparency:
    audits:
      value: []
      note: No security or no-logs audit of the VPN has been published. Its ISO 27001 certificate names it, but that covers how Trend Micro manages security, not the service itself.
      sources: [support, iso-27001]
    report:
      value: none
      note: Its government requests policy says that once it gets a request it reports yearly, but only to data protection authorities that ask.
      sources: [gov-policy]
    canary:
      value: none
      sources: [gov-policy]
    bug_bounty:
      value: true
      note: Through the Zero Day Initiative, Trend's own programme that pays researchers, which reported all three VPN flaws below.
      sources: [zdi, bulletin-2024-07]
    incidents:
      value:
        - date: 2026-07-22
          summary: >-
            The Windows app looked for an OpenSSL config file in a place a local user could write to, letting
            them run code as SYSTEM (CVE-2026-67212). Fixed in 6.0.1036, with a security bulletin.
          handled: well
          source: bulletin-2026-07
        - date: 2024-07-06
          summary: >-
            A file overwrite flaw in the Windows app's logging could let a local user gain higher privileges
            (CVE-2024-41183). Trend Micro fixed it in 5.8.1030 and published a security bulletin.
          handled: well
          source: bulletin-2024-07
        - date: 2024-05-28
          summary: >-
            HTTP endpoints in the Windows app let a local user overwrite or create files, crashing it or in some
            cases gaining higher privileges (CVE-2024-36473). Fixed in 5.8.1025, with a security bulletin.
          handled: well
          source: bulletin-2024-05
        - date: 2022-06-15
          summary: >-
            Overly permissive folders in the Windows app let a local user gain higher privileges
            (CVE-2022-33158). Fixed in 5.3.1056, with a security bulletin.
          handled: well
          source: bulletin-2022
      sources: [bulletin-2024-07, bulletin-2024-05, bulletin-2022]

  account:
    email:
      value: required
      sources: [notice]
    personal_data:
      value: [name]
      note: The licence check collects your first and last name, and a phone number in Japan.
      sources: [notice]
    payment:
      value: [card, paypal, app_store]
      note: The online store also takes Google Pay, and the apps sell plans in-app.
      sources: [payment-methods, purchase]

  security:
    protocols:
      value: [openvpn, wireguard]
      note: A Smart setting, which Trend Micro recommends, picks between the two.
      sources: [protocols]
    post_quantum:
      value: none
      sources: [protocols]
    kill_switch:
      value: none
      note: Not mentioned. VPN Always ON only turns the VPN on for the Wi-Fi networks you pick.
      sources: [how-to]
    dns:
      value: null
      note: Trend Micro doesn't say whose DNS servers the VPN uses.
      sources: [protocols]

  infra:
    ram_only:
      value: null
      note: Trend Micro doesn't say whether its VPN servers run from RAM.
      sources: [how-to]
    hosting:
      value: null
      note: Trend Micro's subprocessor list names Amazon Web Services and Microsoft for VPN Proxy One Pro, without saying whether they run the VPN servers.
      sources: [subprocessors]
    virtual_locations:
      value: null
      note: Its server list doesn't say whether any location is virtual.
      sources: [how-to]
    servers:
      value: null
      note: Trend Micro only says "multiple servers around the world".
      sources: [play]
    countries:
      value: 17
      note: Counted from the location list in its help.
      sources: [how-to]

  features:
    connections:
      value: 1
      note: The $29.95 plan covers one device. The 5-device plan is $59.95 a year.
      sources: [product]
    multihop:
      value: false
      sources: [how-to]
    obfuscation:
      value: []
      sources: [protocols, how-to]
    port_forwarding:
      value: false
      sources: [how-to]
    split_tunnel:
      value: false
      sources: [how-to]
    blocking:
      value: [malware]
      note: Web Threat Prevention checks the URLs you visit and blocks malicious and scam sites.
      sources: [product]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      sources: [product]
    open_source:
      value: none
      sources: [support]
    telemetry:
      value: forced
      evidence: claimed
      note: >-
        Usage data goes to Trend Micro and to AppsFlyer, Firebase, Google Analytics and App Center, and can't
        be turned off. Only tying it to your device ID is optional.
      sources: [notice]
    fdroid: false

  pricing:
    monthly:
      value: null
      note: The US page only sells a yearly plan. The apps also sell a monthly one in-app.
      sources: [product, purchase]
    best:
      value: { amount: 2.5, currency: USD }
      note: USD from the US site. $29.95 a year for one device.
      sources: [product]
    best_term: 12
    renewal_increase:
      value: 0
      note: The page lists $29.95 as the renewal price too, and the terms say it renews at the then-current renewal price.
      sources: [product, renewal-terms]
    free_tier:
      value: false
      note: Only a 7-day free trial.
      sources: [play]
    refund_days:
      value: 30
      note: For purchases on Trend Micro's website or in shops. App store purchases follow the store's rules.
      sources: [consumer-terms]

  ethics:
    misleading_claims:
      value: true
      note: Promises you can "stay anonymous" and have "bank-grade data encryption".
      sources: [product, support]
    affiliates:
      value: true
      note: The product page links to an affiliate signup through CJ.
      sources: [product]

