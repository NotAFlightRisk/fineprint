# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: PureVPN
icon: purevpn.png
checked: 2026-11-01

criteria:
  identity:
    website: https://www.purevpn.com
    legal_entity:
      value: GZ Systems Limited
      sources: [tos, privacy-policy]
    owner:
      value: Disrupt
      note: >-
        Disrupt, a UAE-based group run by PureVPN's founders, lists PureSquare (PureVPN) among its
        companies, and gaditek.com now redirects to it. The shareholding isn't published.
      sources: [disrupt, about]
    founded:
      value: 2007
      sources: [about]
    team:
      value: partial
      note: >-
        There's no leadership page, but its transparency report quotes CEO Uzair Gadit, and Disrupt
        names him and his brothers as founders.
      sources: [transparency, disrupt, about]
    sister_brands:
      value: [Ivacy VPN]
      note: >-
        PureVPN's help centre says Ivacy merged with PureVPN as "Ivacy Powered by PureVPN" and moved its
        users over.
      sources: [ivacy-merge]
    acquisitions:
      value: []
      sources: [about, disrupt]

  jurisdiction:
    hq:
      value: VG
      note: It moved from Hong Kong to the British Virgin Islands in 2021.
      sources: [tos, hq-move]
    entities:
      value: [VG, CY]
      note: >-
        The terms name GZT Associates Limited in Cyprus as an associated company. Disrupt, the group
        behind it, says it's headquartered in the UAE.
      sources: [tos, disrupt]

  logging:
    traffic:
      value: none
      evidence: verified
      sources: [privacy-policy, kpmg-2023]
    dns:
      value: none
      evidence: claimed
      note: >-
        With the Tracker and Ad Blocker on, it briefly keeps the names and counts of blocked trackers in
        memory, without user details.
      sources: [privacy-policy]
    timestamps:
      value: aggregate
      evidence: claimed
      note: >-
        Keeps the day each user connected, for support, though not the time. KPMG checked that exact
        connection times aren't logged.
      sources: [privacy-policy, kpmg-2023]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: Keeps a total of the data each user transfers, to enforce fair use.
      sources: [privacy-policy, tos]
    source_ip:
      value: none
      evidence: verified
      note: >-
        It does keep your ISP's name for support. A Dedicated IP add-on stays on record for 25 days after
        the subscription ends.
      sources: [privacy-policy, kpmg-2023]
    proven:
      value: [audit]
      evidence: verified
      note: >-
        KPMG last checked the setup in early 2023. In 2017 PureVPN's records helped the FBI identify a
        customer, before its current no-logs policy.
      sources: [kpmg-2023, torrentfreak-2017]
    policy: https://www.purevpn.com/privacy-policy

  transparency:
    audits:
      value:
        - date: 2023-04-17
          auditor: KPMG
          scope: no_logs
          source: kpmg-2023
        - date: 2021-01-01
          auditor: KPMG
          scope: no_logs
          source: kpmg-2021
        - date: 2020-01-01
          auditor: KPMG
          scope: no_logs
          source: kpmg-2020
        - date: 2019-06-28
          auditor: Altius IT
          scope: no_logs
          source: altius-2019
      evidence: verified
      note: >-
        Only KPMG's 2023 letter and Altius IT's 2019 report have been published. The 2020 and 2021 KPMG
        checks are known from announcements, so they're dated by year.
      sources: [kpmg-2023, no-log-assessment, kpmg-2021, kpmg-2020, altius-2019]
    report:
      value: regular
      note: Quarterly, with figures up to Q2 2026 when checked.
      sources: [transparency, transparency-court, transparency-subpoena]
    canary:
      value: stale
      note: >-
        The Trust Center says it has had no court orders or subpoenas, but its own transparency report
        lists 14 court orders and 53 subpoenas since 2021.
      sources: [trust-center, transparency-court, transparency-subpoena]
    bug_bounty:
      value: true
      note: >-
        Its disclosure policy pays up to $1,500 a bug at PureVPN's discretion, and says researchers must
        not disclose a flaw publicly.
      sources: [vdp]
    incidents:
      value:
        - date: 2025-09-17
          summary: >-
            A researcher found the Linux apps leaked IPv6 traffic after a network change and wiped the
            system's firewall rules (CVE-2025-59691 and CVE-2025-59692). PureVPN confirmed both two days
            later and sent the researcher a fixed Linux build on 19 October.
          handled: well
          source: anagogistis-2025
        - date: 2023-11-01
          summary: >-
            In November 2023 Rafay Baloch reported that the Linux app leaked DNS queries outside the VPN
            (CVE-2023-48957), which PureVPN fixed within days. It declined to fix a local code execution
            flaw he also found, saying it was down to Chromium.
          handled: well
          source: baloch-2023
        - date: 2018-09-27
          summary: >-
            Trustwave found the Windows app stored login details in plain text, readable by any local
            user. It was reported in August 2017 and fixed in June 2018, and a second flaw that reveals
            the saved password was left as an accepted risk.
          handled: poorly
          source: trustwave-2018
        - date: 2017-10-06
          summary: >-
            An FBI affidavit in a cyberstalking case said PureVPN linked a customer to his home and work
            IP addresses. PureVPN advertised no logs at the time, though its policy admitted to keeping
            connection times.
          handled: poorly
          source: torrentfreak-2017
        - date: 2013-10-05
          summary: >-
            Attackers used a zero-day flaw in its WHMCS billing system to take some customers' names and
            email addresses, then emailed them a fake notice that PureVPN was shutting down and had handed
            their data to the authorities. PureVPN denied the email the same day and confirmed the breach
            within two days.
          handled: well
          source: cso-2013
      sources: [anagogistis-2025, advisory-2025, baloch-2023, trustwave-2018, securityaffairs-2018, torrentfreak-2017, doj-2017, cso-2013, techcrunch-2013]

  account:
    email:
      value: required
      sources: [pricing]
    personal_data:
      value: [name]
      note: The privacy policy says signup asks for your name, though checkout itself only asks for an email and password.
      sources: [pricing, privacy-policy]
    payment:
      value: [card, paypal, app_store, bitcoin, other_crypto]
      note: Crypto goes through CoinPayments, and those payments can't be refunded.
      sources: [pricing, refund]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, other]
      note: Other covers L2TP, SSTP and PPTP for manual setup.
      sources: [protocols, servers]
    post_quantum:
      value: null
      note: >-
        It offers "quantum-resistant" servers in five countries, but describes them as using keys made
        by a quantum computer, not a post-quantum key exchange.
      sources: [trust-center, servers]
    kill_switch:
      value: null
      note: It has an Internet Kill Switch, but PureVPN's pages don't say whether it works at system level.
      sources: [kill-switch]
    dns:
      value: first_party
      sources: [dns-leak]

  infra:
    ram_only:
      value: none
      evidence: claimed
      note: PureVPN says its servers run from hard disks with full-disk encryption instead.
      sources: [ram-only]
    hosting:
      value: null
      note: PureVPN doesn't say whether it owns or rents its servers.
      sources: [trust-center]
    virtual_locations:
      value: disclosed
      note: >-
        A help article updated in February 2026 lists the locations that are still virtual. It's not clear
        whether the apps mark them.
      sources: [virtual-locations]
    servers:
      value: 6000
      note: Listed as 6,000+.
      sources: [servers]
    countries:
      value: 65
      note: Listed as 65+, though the manual setup table on the same page still names 94 countries.
      sources: [servers]

  features:
    connections:
      value: 10
      note: More with the paid Multi Login add-on.
      sources: [home]
    obfuscation:
      value: [proprietary]
      note: Obfuscated servers, which PureVPN says disguise VPN traffic as HTTPS without naming the method.
      sources: [home]
    port_forwarding:
      value: true
      note: A paid add-on, $1.49 a month on the 2-year plan.
      sources: [port-forwarding, pricing]
    split_tunnel:
      value: true
      note: On Windows, Android, Fire TV and Android TV only.
      sources: [split]
    blocking:
      value: [ads, trackers]
      note: Through its Tracker and Ad Blocker, included in every plan.
      sources: [pricing, privacy-policy]

  clients:
    platforms:
      value: [windows, macos, linux_gui, linux_cli, ios, android, router, browser]
      note: >-
        Routers get a DD-WRT applet or manual setup. The Chrome, Firefox and Edge extensions are proxies
        for the browser alone.
      sources: [download, linux, router]
    open_source:
      value: none
      note: Only its leak-testing tools are open source, not the apps.
      sources: [trust-center, tos]
    telemetry:
      value: null
      note: >-
        The policy lists the tools used for app analytics and crash reports, among them Google Analytics,
        Firebase, Mixpanel, Facebook Pixel and Sentry. It doesn't say whether you can turn this off.
      sources: [privacy-policy]
    trackers:
      value: 9
      note: >-
        Adjust, Facebook Login, Facebook Share, Crashlytics, Firebase Analytics, Huawei Mobile Services,
        Insider, Mixpanel and Sentry, in version 8.86.129 from August 2025, the newest archived report.
      sources: [exodus]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 12.95, currency: USD }
      note: The Standard plan. Plus and Max add extras such as a password manager.
      sources: [pricing, renewal]
    best:
      value: { amount: 2.16, currency: USD }
      note: >-
        An intro price on the 2-year Standard plan, which PureVPN rounds to $2.15. It then renews at about
        $4 a month.
      sources: [pricing, renewal]
    best_term:
      value: 27
      note: A 2-year plan with 3 months added.
      sources: [pricing]
    renewal_increase:
      value: 85
      note: The 27-month plan is $58.20, then renews at $47.95 a year.
      sources: [pricing, renewal]
    free_tier:
      value: false
      note: There's a 7-day trial, which renews into a paid plan unless cancelled.
      sources: [refund]
    refund_days:
      value: 31
      note: Not for renewals, or for crypto, App Store or Google Play payments.
      sources: [refund]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Its privacy policy calls crypto through CoinPayments "100% anonymous" and says "even we can't see
        what you do online", and its server page promises "complete anonymity".
      sources: [privacy-policy, servers]
    affiliates:
      value: true
      note: Its affiliate page offers 100% of the first month's price, or 40% on longer plans plus 35% recurring.
      sources: [affiliates]

