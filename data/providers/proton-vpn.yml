# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Proton VPN
icon: proton-vpn.svg
checked: 2026-10-18

criteria:
  identity:
    website: https://protonvpn.com
    legal_entity:
      value: Proton AG
      sources: [privacy-policy, who-owns]
    owner:
      value: Proton Foundation
      note: The foundation is the main shareholder. Proton staff own most of the rest, with FONGIT and some users holding the remainder.
      sources: [who-owns, foundation]
    founded:
      value: 2017
      sources: [transparency, open-source]
    team:
      value: public
      sources: [team]
    sister_brands: []
    acquisitions:
      value:
        - date: 2024-06-17
          acquirer: Proton Foundation
          source: non-profit
      note: >-
        Proton's founders gave shares to the non-profit Proton Foundation they set up, making it the
        main shareholder. It wasn't a sale.
      sources: [non-profit, who-owns]

  jurisdiction:
    hq:
      value: CH
      sources: [privacy-policy, proton-privacy]
    entities:
      value: [CH, LU, MK, TW]
      note: >-
        The group companies Proton's privacy policy names. Proton also has offices in France, the UK,
        Spain, Lithuania and Czechia.
      sources: [proton-privacy, team]

  logging:
    traffic:
      value: none
      evidence: verified
      note: >-
        Free servers check traffic on the fly to block BitTorrent. The 2025 audit found none of it
        is stored.
      sources: [no-logs, audit-2025]
    dns:
      value: none
      evidence: verified
      sources: [audit-2025, no-logs-audits]
    timestamps:
      value: none
      evidence: verified
      sources: [no-logs, audit-2025]
    bandwidth:
      value: null
      note: Neither the policy nor the audits say whether per-user data use is recorded.
      sources: [privacy-policy, no-logs]
    source_ip:
      value: none
      evidence: verified
      note: >-
        This is for VPN connections. Proton's account-wide policy says login IPs may be kept for a
        while to fight abuse.
      sources: [no-logs, audit-2025, proton-privacy]
    proven:
      value: [court, audit]
      note: >-
        Proton says it couldn't answer any of the 458 legally binding Swiss orders for VPN user data
        it got from 2019 to mid-2026, including a 2019 court case, as it keeps no logs. Only Proton
        has published those cases.
      sources: [transparency, no-logs, no-logs-audits]
    policy: https://protonvpn.com/privacy-policy

  transparency:
    audits:
      value:
        - date: 2026-05-27
          auditor: Securitum
          scope: no_logs
          source: audit-2026
        - date: 2025-09-19
          auditor: Securitum
          scope: no_logs
          source: audit-2025
        - date: 2025-01-01
          auditor: Ruben Santamarta
          scope: apps
          source: audit-apps-2025
        - date: 2024-09-01
          auditor: Ruben Santamarta
          scope: apps
          source: audit-extension-2024
        - date: 2024-07-12
          auditor: Securitum
          scope: no_logs
          source: audit-2024
        - date: 2023-05-01
          auditor: Securitum
          scope: no_logs
          source: audit-2023
        - date: 2022-03-24
          auditor: Securitum
          scope: no_logs
          source: audit-2022
        - date: 2019-11-22
          auditor: SEC Consult
          scope: apps
          source: audit-2019-ios
        - date: 2019-11-22
          auditor: SEC Consult
          scope: apps
          source: audit-2019-macos
        - date: 2019-11-15
          auditor: SEC Consult
          scope: apps
          source: audit-2019-android
        - date: 2019-11-15
          auditor: SEC Consult
          scope: apps
          source: audit-2019-windows
      evidence: verified
      note: >-
        Dates are the last day of testing. Santamarta's audits of the apps and the browser extension
        are dated to the month by Privacy Guides.
      sources: [no-logs-audits, open-source, privacy-guides, audit-2026-news]
    report:
      value: regular
      sources: [transparency, proton-transparency]
    canary:
      value: none
      note: >-
        Proton says a canary isn't meaningful under Swiss law, which requires the target of a data
        request to be told eventually.
      sources: [transparency]
    bug_bounty:
      value: true
      sources: [bug-bounty]
    incidents:
      value:
        - date: 2018-09-07
          summary: >-
            Cisco Talos found the Windows app could be made to run code as admin (CVE-2018-4010),
            getting round Proton's fix for an earlier bug. Proton patched it before it went public.
          handled: well
          source: talos-2018
      sources: [talos-2018]

  account:
    email:
      value: optional
      note: >-
        Proton VPN's own sign-up asks for an outside email, but a Proton account made with a new
        Proton Mail address works without one. Sign-ups may be asked to verify by CAPTCHA, email or
        SMS.
      sources: [free-account, proton-privacy]
    personal_data:
      value: []
      sources: [proton-privacy]
    payment:
      value: [card, paypal, bank, app_store, bitcoin, cash]
      sources: [payment, bitcoin, cancel]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, proprietary]
      note: >-
        Among the apps, OpenVPN is only on Linux and IKEv2 only on macOS. Its own protocol is Stealth,
        WireGuard over TLS.
      sources: [protocols, stealth]
    post_quantum:
      value: none
      note: Proton lists post-quantum encryption as planned for its new protocol engine.
      sources: [proton-protocols]
    kill_switch:
      value: system
      note: >-
        The advanced kill switch on Windows, the Linux app and iOS (beta) blocks everything outside
        the tunnel, even after a restart, and Android's always-on setting does the same. macOS only
        gets the standard one, which Proton says can leak your IP when switching servers.
      sources: [kill-switch]
    dns:
      value: first_party
      sources: [netshield, audit-2025]

  infra:
    ram_only:
      value: none
      note: Servers use full-disk encryption instead. Proton argues RAM-only adds little.
      sources: [ram-only, privacy-policy]
    hosting:
      value: mixed
      note: Proton owns all its Secure Core servers and most of its servers in Switzerland and Germany.
      sources: [privacy-policy, secure-core]
    virtual_locations:
      value: disclosed
      note: Proton calls them Smart Routing and lists where each one really is.
      sources: [smart-routing]
    servers:
      value: 20839
      sources: [servers]
    countries:
      value: 149
      note: Includes Smart Routing locations, whose servers sit in another country.
      sources: [servers, smart-routing]

  features:
    connections:
      value: 10
      note: One on the free plan.
      sources: [pricing]
    multihop:
      value: true
      note: Secure Core sends traffic through Proton's own servers in Switzerland, Iceland or Sweden first.
      sources: [secure-core]
    obfuscation:
      value: [proprietary, udp2tcp]
      note: Stealth wraps WireGuard in TLS, and plain WireGuard can also run over TCP.
      sources: [stealth, protocols]
    port_forwarding:
      value: true
      note: Paid plans, on P2P servers.
      sources: [port-forwarding]
    split_tunnel:
      value: true
      note: Not on iOS.
      sources: [split-tunnel]
    blocking:
      value: [ads, trackers, malware]
      note: Paid plans only.
      sources: [netshield]

  clients:
    platforms:
      value: [windows, macos, linux_gui, linux_cli, ios, android, browser]
      sources: [download, linux]
    open_source:
      value: all
      sources: [github, open-source]
    telemetry:
      value: opt_out
      note: >-
        Anonymous usage stats and crash reports are on by default. Proton says they're deleted after
        30 days.
      sources: [usage-stats, fdroid]
    trackers:
      value: 1
      note: Sentry crash reporting, in version 5.20.74.0.
      sources: [exodus]
    fdroid:
      value: true
      sources: [fdroid]

  pricing:
    monthly:
      value: { amount: 9.99, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 3.49, currency: USD }
      note: An intro price for the first two years. After that it renews at $6.99 a month.
      sources: [pricing]
    best_term:
      value: 24
      sources: [pricing]
    renewal_increase:
      value: 100
      note: The 2-year plan is $83.76 up front, then renews at $83.88 a year ($6.99 a month).
      sources: [pricing]
    free_tier:
      value: true
      note: One device, and servers in 10 countries.
      sources: [pricing, free-account]
    refund_days:
      value: 30
      note: A full refund, once per user. Cash and bank transfer payments aren't refundable.
      sources: [terms, cancel]

  ethics:
    misleading_claims:
      value: false
      note: >-
        Slogans like "Expose nothing" aside, its pages make no claims of total anonymity or
        "military-grade" encryption.
      sources: [home]
    affiliates:
      value: true
      sources: [affiliates]
    review_sites: false
    activism:
      value: true
      note: The Proton Foundation, its main shareholder, says it has given over $5 million in grants.
      sources: [foundation]

