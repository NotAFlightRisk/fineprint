# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Mozilla VPN
icon: mozilla-vpn.png
checked: 2026-10-22

criteria:
  identity:
    website:
      value: https://www.mozilla.org/en-US/products/vpn/
      sources: [vpn-page]
    legal_entity:
      value: Mozilla Corporation
      sources: [terms, organizations]
    owner:
      value: Mozilla Foundation
      note: The nonprofit at the top of the Mozilla group. Since June 2026 Mozilla.org runs the group's companies on its behalf.
      sources: [organizations, mozilla-org]
    founded:
      value: 2020
      note: Launched on 15 July 2020 after months of beta testing. Mullvad dates the partnership to July 2019.
      sources: [launch-2020, mullvad-partners]
    team:
      value: public
      sources: [leadership]
    sister_brands:
      value: []
      note: Firefox has had its own free VPN for browser traffic since version 149 in 2026, which isn't sold separately.
      sources: [builtin-vpn]
    acquisitions:
      value: []
      sources: [organizations, launch-2020]

  jurisdiction:
    hq:
      value: US
      sources: [terms]
    entities:
      value: [US]
      note: The terms and privacy notice only name Mozilla Corporation.
      sources: [terms]

  logging:
    traffic:
      value: none
      evidence: claimed
      note: Your traffic only passes through Mullvad's servers, which Mullvad's own server audits found keep no logs of user activity.
      sources: [privacy-notice, mullvad-audit-relay-2022]
    dns:
      value: none
      evidence: claimed
      sources: [privacy-notice, mullvad-policy]
    timestamps:
      value: none
      evidence: claimed
      sources: [privacy-notice, mullvad-policy]
    bandwidth:
      value: none
      evidence: claimed
      sources: [privacy-notice, mullvad-policy]
    source_ip:
      value: none
      evidence: claimed
      note: That's for VPN connections. Mozilla's own servers keep the IP you sign up and use the service from in their logs for 90 days.
      sources: [privacy-notice, mullvad-policy]
    proven:
      value: []
      note: Mullvad's audits cover the servers it runs on, not Mozilla's side. Mozilla's own audits are of its apps.
      sources: [mullvad-audit-relay-2022, audit-cure53-2023]
    policy: https://www.mozilla.org/en-US/privacy/subscription-services/

  transparency:
    audits:
      value:
        - date: 2023-06-02
          auditor: Cure53
          scope: apps
          source: audit-cure53-2023
        - date: 2021-04-02
          auditor: Cure53
          scope: apps
          source: audit-cure53-2021
      evidence: verified
      note: >-
        Both tested the apps on all five platforms, dated to the end of the calendar week testing finished in.
        Cure53's first review, in August 2020, wasn't published, and Mullvad audits the servers separately.
      sources: [audit-blog-2023, audit-blog-2021]
    report:
      value: regular
      note: >-
        Mozilla-wide figures, not broken out for the VPN. The 2025 global report promised for spring 2026
        hasn't appeared, after a February DSA report that only counts EU government requests.
      sources: [transparency, transparency-2025]
    canary:
      value: none
      sources: [transparency]
    bug_bounty:
      value: true
      note: Mozilla's HackerOne bounty covers the VPN's backend at vpn.mozilla.org. The apps aren't in its client bounty, which only covers Firefox.
      sources: [hackerone, client-bounty]
    incidents:
      value:
        - date: 2025-05-30
          summary: Positive Technologies found a flaw that let a local user on macOS get root (CVE-2025-5687). Mozilla fixed it in version 2.28.0 and published an advisory on 30 May 2025.
          handled: well
          source: mfsa-2025-48
        - date: 2023-05-04
          summary: >-
            SUSE found that any local user could set up or switch off the Linux app's VPN through its root
            daemon (CVE-2023-4104). SUSE said Mozilla never formally replied, broke the embargo with a public
            pull request and only shared its plans at the 90-day deadline. The fix came in 2.16.1 at the end of
            August 2023.
          handled: poorly
          source: oss-security-2023
        - date: 2022-02-23
          summary: The Windows app loaded an OpenSSL config file from an unsecured folder, letting a local user run code as SYSTEM (CVE-2022-0517). Mozilla fixed it in 2.7.1 and published an advisory.
          handled: well
          source: mfsa-2022-08
      note: The macOS and Windows flaws are dated by their advisories, as the bug reports aren't public.
      sources: [advisories, mfsa-2023-39]

  account:
    email:
      value: required
      note: It needs a Mozilla account.
      sources: [terms, privacy-notice]
    personal_data:
      value: []
      note: Apart from your card, the checkout asks for a country and postcode, which the privacy notice calls your billing address.
      sources: [privacy-notice, checkout-src]
    payment:
      value: [card, paypal, app_store]
      note: Through Stripe, PayPal or Google Pay on the website, or in-app through Apple and Google.
      sources: [privacy-notice, terms]

  security:
    protocols:
      value: [wireguard]
      sources: [features]
    post_quantum:
      value: none
      note: Mullvad's own app has post-quantum tunnels on the same servers, but Mozilla's client has no such option.
      sources: [source-code, mullvad-pq]
    kill_switch:
      value: system
      note: Always on while connected, on every platform, with no setting to turn it off.
      sources: [kill-switch]
    dns:
      value: first_party
      note: Mullvad's resolvers on the VPN servers, which also do the ad, tracker and malware blocking. You can set your own instead.
      sources: [dns-help, dns-src]

  infra:
    ram_only:
      value: all
      evidence: claimed
      note: Mullvad's servers, which it says all run from RAM.
      sources: [mullvad-ram-only, mullvad-partners]
    hosting:
      value: null
      note: It runs on Mullvad's servers, which Mullvad partly owns and partly rents.
      sources: [mullvad-partners, mullvad-server-list]
    virtual_locations:
      value: none
      evidence: claimed
      note: Its server list is Mullvad's, which has none.
      sources: [features, mullvad-server-list]
    servers:
      value: 500
      note: Its page says more than 500.
      sources: [features]
    countries:
      value: 30
      note: Its pages say 30+.
      sources: [features, what-is-a-vpn]

  features:
    connections:
      value: 5
      sources: [terms, vpn-page]
    multihop:
      value: true
      sources: [multihop]
    obfuscation:
      value: [udp2tcp, proprietary]
      note: Mullvad's LWO and UDP over TCP, added in version 2.40 in October 2026, but not on every platform.
      sources: [obfuscation-src, release-2-40]
    port_forwarding:
      value: false
      note: None of its pages mention it, and Mullvad dropped it from its servers in 2023.
      sources: [features, mullvad-port-forwarding]
    split_tunnel:
      value: true
      note: Windows, Android and Linux only.
      sources: [features, split-tunnel]
    blocking:
      value: [ads, trackers, malware]
      sources: [features, dns-src]

  clients:
    platforms:
      value: [windows, macos, linux_gui, ios, android]
      note: The Firefox extension only works alongside the Windows app, so isn't counted.
      sources: [download, vpn-page]
    open_source:
      value: all
      note: MPL 2.0, with one codebase for every platform.
      sources: [source-code, license]
    telemetry:
      value: opt_in
      evidence: claimed
      note: >-
        Crash and error reports to Sentry only go if you agree when setting it up, which is off by default.
        The policy also says mobile installs send campaign data that Mozilla shares with Adjust.
      sources: [privacy-notice, onboarding-src, data-help]
    fdroid:
      value: false
      note: A version without Google Play services has been on GitHub since April 2026, but not on F-Droid.
      sources: [fdroid-search, release-2-36]

  pricing:
    monthly:
      value: { amount: 9.99, currency: USD }
      note: USD from the US page, as the price changes with your country.
      sources: [pricing]
    best:
      value: { amount: 4.99, currency: USD }
      note: $59.88 a year.
      sources: [pricing]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 0
      evidence: claimed
      note: The yearly plan's 50% saving is against the monthly price, not an intro offer.
      sources: [pricing, terms]
    free_tier:
      value: false
      note: Firefox's separate built-in VPN is free, but only covers the browser and stops at 50 GB a month.
      sources: [terms, builtin-vpn]
    refund_days:
      value: 30
      note: Only for your first subscription, and not when bought through the app stores.
      sources: [terms, pricing]

  ethics:
    misleading_claims:
      value: false
      sources: [vpn-page, what-is-a-vpn]
    affiliates:
      value: true
      sources: [affiliate-faq]
    review_sites:
      value: false
      sources: [organizations]
    activism:
      value: true
      note: Mozilla lobbies on privacy, surveillance and encryption laws, as each transparency report's policy section sets out.
      sources: [transparency-2024b]

