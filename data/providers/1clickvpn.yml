# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: 1ClickVPN
icon: 1clickvpn.png
checked: 2026-10-28

criteria:
  identity:
    website: https://1clickvpn.net
    legal_entity:
      value: Kodice LLC
      note: >-
        Kodice LLC's own site gives a business centre address in Sharjah, UAE, and sells online ad traffic. The
        Chrome listing names no company.
      sources: [terms, kodice, cws]
    owner:
      value: null
      note: Who owns Kodice LLC isn't public.
      sources: [terms]
    founded:
      value: null
      note: >-
        No launch date is given. Its domain dates from September 2019, the site offered the Chrome extension by
        February 2020, and it had over 700,000 users by that August.
      sources: [rdap, home-2020, cws-2020]
    team:
      value: anonymous
      sources: [about, cws]
    sister_brands:
      value: null
      note: >-
        1ClickVPN Proxy at 1clickvpn.com, which Koi Security caught collecting AI chats, is a different
        product sold by Sugar - Smart Shopping Inc. In Russia the extension points you to AltaVPN's Telegram bot
        instead, without saying who runs it.
      sources: [com-play, koi-2025, crx]
    acquisitions: []

  jurisdiction:
    hq:
      value: AE
      evidence: claimed
      note: The terms are governed by UAE law, with disputes going to a UAE arbitration centre.
      sources: [kodice, terms]
    entities:
      value: [AE]
      sources: [kodice]

  logging:
    traffic:
      value: 'yes'
      evidence: claimed
      note: >-
        The privacy policy collects the URLs you visit with their times, a pseudonymous ID and your IP
        address, and passes an anonymised version to analytics partners. The 2021 terms promise no traffic logs.
      sources: [policy, cws, terms]
    dns:
      value: 'yes'
      evidence: claimed
      note: The policy collects the URLs you visit, which include each site's domain name.
      sources: [policy]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: >-
        The policy collects session timestamps and connection duration, kept as long as "necessary". The
        terms say only the last session status is kept, for 15 minutes after you disconnect.
      sources: [policy, terms]
    bandwidth:
      value: none
      evidence: claimed
      sources: [terms]
    source_ip:
      value: 'yes'
      evidence: claimed
      note: The policy collects your IP address for service delivery and security, while the terms say IP addresses aren't stored.
      sources: [policy, terms]
    proven: []
    policy: https://1clickvpn.net/privacy

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: required
      note: The free extension needs no account. Premium needs one with an email address.
      sources: [cws, terms, faq]
    personal_data:
      value: []
      note: Signing up asks only for an email address and password, though the policy lists a name among account details.
      sources: [signup, policy]
    payment:
      value: [card, paypal]
      note: Also Google Pay, Apple Pay, Telegram Stars and crypto, without saying which coins.
      sources: [payment, terms]

  security:
    protocols:
      value: [other]
      note: A proxy for that browser alone, set through Chrome's proxy settings, which the Chrome listing says uses SSL (TLS) encryption.
      sources: [crx, cws]
    post_quantum: none
    kill_switch:
      value: none
      note: If the proxy fails or the network drops, the extension turns itself off and the browser carries on without it.
      sources: [crx]
    dns: null

  infra:
    ram_only: null
    hosting: null
    virtual_locations: null
    servers:
      value: 500
      evidence: claimed
      sources: [faq, cws]
    countries:
      value: 10
      evidence: claimed
      note: Premium gets 10 countries and the free plan 3.
      sources: [pricing, faq]

  features:
    connections:
      value: 5
      note: Premium covers 5 devices and the free plan 3.
      sources: [pricing]
    multihop: false
    obfuscation:
      value: null
      note: >-
        The Chrome listing says it bypasses censorship, without saying how. In Russia the extension doesn't
        connect at all, and recommends a different VPN.
      sources: [cws, crx]
    port_forwarding: false
    split_tunnel:
      value: false
      note: >-
        The extension covers the whole browser. The Chrome listing promises protection for selected websites,
        but version 2.1.0 has no such setting.
      sources: [crx, cws]
    blocking:
      value: [ads, trackers, malware]
      evidence: claimed
      note: The extension's built-in ad blocker, with no detail on how it works.
      sources: [cws, pricing]

  clients:
    platforms:
      value: [browser]
      note: >-
        A proxy for the browser alone. The Chrome extension was updated in October 2026, the Edge one last
        in January 2022, and the Firefox one is no longer listed. The site has Android and iOS download pages,
        but they don't link to any app.
      sources: [cws, edge, amo-2025, android, ios, terms]
    open_source:
      value: none
      sources: [terms]
    telemetry:
      value: forced
      evidence: claimed
      note: >-
        The Chrome extension reports every page you open, with the page you came from, the time and an install ID,
        to its own Sentry server, and has no setting to stop it. The policy also lists crash logs and diagnostics.
      sources: [crx, policy]
    trackers:
      value: null
      grade: na
      note: There's no Android app.
      sources: [android]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 3.99, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 1.99, currency: USD }
      note: Billed yearly.
      sources: [pricing]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 0
      note: The yearly plan's 50% off is against the monthly price, and nothing says it renews higher.
      sources: [pricing, terms]
    free_tier:
      value: true
      note: The free plan gets 3 countries and 3 devices.
      sources: [pricing]
    refund_days:
      value: 2
      note: Refunds are only within 48 hours of the first purchase.
      sources: [terms]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It says its SSL encryption makes you "fully anonymous" and that your browsing is never stored, while
        its privacy policy collects the URLs you visit. The Chrome listing also promises WebRTC leak protection,
        which the extension doesn't have the permission to provide.
      sources: [about, cws, policy, crx]
    affiliates: null
    review_sites: false
    activism: false

  other:
    concerns:
      value:
        - summary: >-
            The Chrome extension sends the address of every page you open, and the page you came from, to its
            own server under an install ID, whether or not the VPN is connected.
          severity: serious
          source: crx

