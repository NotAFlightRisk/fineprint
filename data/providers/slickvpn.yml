# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: SlickVPN
icon: slickvpn.png
checked: 2026-10-28

criteria:
  identity:
    website:
      value: https://www.slickvpn.com
      sources: [about]
    legal_entity:
      value: Slick Networks, Inc.
      note: Named as data controller in the privacy policy, at a mailbox address in Weston, Florida.
      sources: [privacy, terms]
    owner:
      value: null
      note: >-
        Who owns Slick Networks, Inc. isn't published. It gave an address in Anderson, South Carolina
        until 2014, and its OpenVPN configs are served from the members' site of NewsDemon, a Usenet
        provider run by K&L Technologies, Inc. of South Carolina.
      sources: [privacy-2014, locations, newsdemon-terms]
    founded:
      value: 2012
      note: Its site was selling plans by July 2012, the month its UK company was set up.
      sources: [site-2012, companies-house]
    team:
      value: anonymous
      note: Nobody who runs it is named on its site.
      sources: [about]
    sister_brands:
      value: []
    acquisitions:
      value: null
      note: Who has owned it over the years isn't published.

  jurisdiction:
    hq:
      value: US
      note: The terms are governed by US law.
      sources: [terms]
    entities:
      value: [US]
      note: Its 2016 canary also names Slick Networks, LTD, a UK company that had already been struck off in December 2015.
      sources: [privacy, canary, companies-house]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy]
    dns:
      value: none
      evidence: claimed
      sources: [privacy]
    timestamps:
      value: none
      evidence: claimed
      note: The policy says it doesn't record connection times "tied to your identity".
      sources: [privacy]
    bandwidth:
      value: null
      note: It doesn't say whether it logs data use.
      sources: [privacy]
    source_ip:
      value: none
      evidence: claimed
      sources: [privacy]
    proven:
      value: []
    policy: https://www.slickvpn.com/privacy-policy/

  transparency:
    audits:
      value: []
    report:
      value: none
    canary:
      value: stale
      note: It promises a signed statement every two weeks, but the one on the page is dated 6 May 2016.
      sources: [canary]
    bug_bounty:
      value: false
    incidents:
      value: []

  account:
    email:
      value: required
      sources: [checkout]
    personal_data:
      value: []
      sources: [checkout]
    payment:
      value: [card, paypal, bitcoin]
      note: Bitcoin goes through BitPay. Its FAQ still offers cash, cheque or money order by invoice, but checkout doesn't.
      sources: [checkout, faq]

  security:
    protocols:
      value: [openvpn, other]
      note: Other is IPsec for Apple devices. PPTP has been dropped.
      sources: [protocols, mac-ipsec]
    post_quantum:
      value: none
      sources: [protocols]
    kill_switch:
      value: app
      note: The desktop client's leak protection swaps out your default route while connected, so traffic stops if the tunnel drops.
      sources: [mac-client-pkg]
    dns:
      value: null
      note: It doesn't say whose DNS servers the tunnel uses. Its DNS leak guide has you set Cloudflare's or Google's resolver on your adapter.
      sources: [dns-guide]

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: rented
      note: Its gateways sit on addresses belonging to hosts such as QuickPacket, ReliableSite, Vital Network Group and Linode.
      sources: [locations, rdap-quickpacket, rdap-reliablesite, rdap-vng, rdap-linode]
    virtual_locations:
      value: null
      note: It doesn't say whether any of its locations are virtual.
      sources: [locations]
    servers:
      value: 11
      note: Listed as 11 active gateways, though its About page still claims servers in over 45 countries.
      sources: [locations, about]
    countries:
      value: 4
      note: The US, UK, Netherlands and Singapore.
      sources: [locations]

  features:
    connections:
      value: 5
      note: Five at once, from no more than two IP addresses. The FAQ still describes older PRO and CORE plans.
      sources: [faq]
    multihop:
      value: true
      note: Called HYDRA, from specific gateways.
      sources: [hydra]
    obfuscation:
      value: []
      sources: [protocols]
    port_forwarding:
      value: null
    split_tunnel:
      value: false
      note: The desktop client has no option for it.
      sources: [mac-client-pkg, win-client]
    blocking:
      value: []

  clients:
    platforms:
      value: [windows, macos]
      note: >-
        Linux, iOS, Android and routers are set up by hand with OpenVPN or IPsec. The current macOS client, built
        in 2018, still bundles OpenVPN 2.3.9 and OpenSSL 1.0.2e from 2015.
      sources: [help, win-client, mac-install, mac-client-pkg]
    open_source:
      value: none
    telemetry:
      value: null
      note: The macOS client only calls home for update checks, server lists and account messages, but it doesn't say whether any app sends usage data.
      sources: [mac-client-pkg]
    trackers:
      value: null
      grade: na
      note: There's no Android app.
      sources: [help]
    fdroid:
      value: false
      note: There's no Android app.
      sources: [help]

  pricing:
    monthly:
      value: { amount: 10, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 4, currency: USD }
      note: The yearly plan at $48.
      sources: [pricing]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 0
      note: Billed $48 every year. The $120 "regular price" it's shown against isn't what it renews at.
      sources: [pricing]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 30
      sources: [refund]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It calls HYDRA "The Most Secure VPN In The World" and says it makes tracking you "impossible". Its
        About page claims servers in over 45 countries, while its locations page lists 4.
      sources: [hydra, about, locations]
    affiliates:
      value: null
      note: It ran an affiliate scheme, and checkout still loads its tracker, but the affiliate pages have errored since 2021.
      sources: [affiliates-2020, affiliates-now, checkout]
    review_sites:
      value: null
    activism:
      value: true
      evidence: claimed
      note: Its FAQ says it's a sustaining donor to the EFF.
      sources: [faq]

  other:
    concerns:
      value:
        - summary: Its Ubuntu 22.04 guide has you set OpenSSL's security level to 0 to connect, which lets the tunnel use weak, outdated TLS settings.
          severity: minor
          source: linux-2204

