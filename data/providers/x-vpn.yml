# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: X-VPN
icon: x-vpn.png
checked: 2026-10-25

criteria:
  identity:
    website:
      value: https://xvpn.io
      sources: [home]
    legal_entity:
      value: LightningLink Networks Pte. Ltd.
      note: >-
        A Singapore company incorporated in July 2025, which took over from Hong Kong's Free Connected
        Limited by October 2025. It also sells the apps on Google Play and the App Store.
      sources: [terms, privacy, register, play, app-store, privacy-2025, ttp-2025-06]
    owner:
      value: null
      note: >-
        In 2025 the Tech Transparency Project found Free Connected Limited's Hong Kong filings showed it
        "owned by a Chinese tech firm, Chengdu Zhuozhuo Technology Co., Ltd." Who owns the Singapore company
        isn't public.
      sources: [ttp-2025-04, register]
    founded:
      value: 2017
      sources: [about, privacy-2025]
    team:
      value: anonymous
      note: Nobody running it is named on its site, and Singapore's open register data only gives a count of officers.
      sources: [about, register]
    sister_brands:
      value: [GhostGuard, PotatoVPN]
      note: >-
        2025 research found PotatoVPN's Android app shares X-VPN's proprietary protocol, native library and
        hard-coded key, and their terms share wording. GhostGuard is sold by PotatoVPN's company.
      sources: [hidden-links-2025, potatovpn-terms, ghostguard]
    acquisitions:
      value: null
      note: >-
        No sale is on record. The service moved from Free Connected Limited in Hong Kong to a new Singapore
        company in 2025, months after TTP's report, without saying whether the owners changed.
      sources: [privacy-2025, register, ttp-2025-04]

  jurisdiction:
    hq:
      value: SG
      sources: [terms, register]
    entities:
      value: [SG]
      note: Free Connected Limited in Hong Kong ran it until 2025, and it isn't said whether that company is still involved.
      sources: [register, privacy-2025]

  logging:
    traffic:
      value: none
      evidence: verified
      sources: [privacy, audit-2026]
    dns:
      value: none
      evidence: verified
      sources: [privacy, audit-2026]
    timestamps:
      value: none
      evidence: verified
      sources: [privacy, audit-2026]
    bandwidth:
      value: none
      evidence: claimed
      note: Only server-wide bandwidth totals, for capacity planning, though the free plan has a daily data allowance on some platforms.
      sources: [privacy, free-vpn]
    source_ip:
      value: none
      evidence: verified
      sources: [privacy, audit-2026]
    proven:
      value: [audit]
      sources: [audit-2026]
    policy: https://xvpn.io/policy

  transparency:
    audits:
      value:
        - date: 2026-09-24
          auditor: Vantage Point Security
          scope: apps
          source: audit-talaria
        - date: 2026-02-28
          auditor: Deloitte & Touche LLP
          scope: no_logs
          source: audit-2026
      evidence: verified
      note: >-
        Vantage Point reviewed the source of Talaria, its open source protocol library, and found four
        informational issues, since fixed. Deloitte's is a limited assurance report on the no-logs setup as of
        one day, with two control findings.
      sources: [audit-center, talaria-post]
    report:
      value: regular
      note: First published in late 2025 with yearly figures back to 2017, and quarterly since. It lists 71 law enforcement requests and none answered with data.
      sources: [transparency, trust-center]
    canary:
      value: none
      note: Its press page says the Trust Center has a warrant canary, but there's only a count of gag orders in its transparency table.
      sources: [press, trust-center]
    bug_bounty:
      value: true
      note: From $50 to $500 a bug.
      sources: [bug-bounty]
    incidents:
      value:
        - date: 2026-06-07
          summary: >-
            A local privilege escalation bug (CVE-2026-2638) in the Mac app from its website, reported by
            Fluid Attacks. Fixed in version 77.5.1 and disclosed with a full write-up.
          handled: well
          source: cve-statement
        - date: 2026-06-05
          summary: >-
            Malware operators bundled the Windows app with a DLL it would load unchecked, to spread STX RAT.
            X-VPN fixed the loading in ten days and its own downloads weren't affected.
          handled: well
          source: stx-rat
      sources: [cve-2026-2638]

  account:
    email:
      value: required
      note: The free apps need no account. Premium needs one, and the address isn't verified, so a disposable one works.
      sources: [create-account, audit-2026]
    personal_data: []
    payment:
      value: [card, paypal, app_store, bitcoin, other_crypto]
      note: Crypto goes through CoinPayments as a one-off payment that can't be refunded.
      sources: [payment-methods, pricing]

  security:
    protocols:
      value: [wireguard, openvpn, proprietary, other]
      note: Its own Everest and Talaria protocols, plus V2Ray, and L2TP for routers.
      sources: [protocols, talaria-post, router]
    post_quantum:
      value: optional
      note: Only on its Everest TLS and TLS-2 protocols.
      sources: [post-quantum]
    kill_switch:
      value: system
      note: Off until you turn it on, and Premium only.
      sources: [kill-switch, kill-switch-help, free-vpn]
    dns:
      value: first_party
      evidence: claimed
      sources: [private-dns]

  infra:
    ram_only:
      value: all
      evidence: verified
      sources: [ram-only, audit-2026]
    hosting:
      value: rented
      note: Bare metal servers leased in third-party data centres, plus Google Cloud, AWS and Oracle.
      sources: [transparency, vpn-server]
    virtual_locations:
      value: null
      note: Its list includes Bhutan, Laos, Myanmar and Iraq, but it doesn't say whether any locations are virtual.
      sources: [servers]
    servers:
      value: 10000
      note: Given as 10,000+. Its transparency report's server counts (62,400 for Q2 2026) are estimates multiplied up from monthly data.
      sources: [servers, transparency]
    countries:
      value: 95
      note: Countries and territories on its server list. Its own pages say 80+.
      sources: [servers]

  features:
    connections:
      value: 5
      note: The terms also cap an account at three devices of the same platform.
      sources: [devices, terms]
    multihop:
      value: true
      note: Called Double VPN.
      sources: [features]
    obfuscation:
      value: [proprietary, v2ray, quic]
      sources: [obfuscation, protocols, about]
    port_forwarding: false
    split_tunnel:
      value: true
      sources: [split-tunnel]
    blocking:
      value: [ads, trackers, malware]
      sources: [web-protection]

  clients:
    platforms:
      value: [windows, macos, linux_cli, ios, android, router, browser]
      note: Plus Apple TV, Android TV and Fire TV apps. Routers are set up by hand with OpenVPN or L2TP.
      sources: [about, linux, router]
    open_source:
      value: some
      note: Only its Talaria protocol library, under the AGPL. The apps are closed.
      sources: [talaria-repo, everest]
    telemetry:
      value: null
      note: >-
        The policy says the apps send aggregated usage and crash statistics, with Firebase on mobile and ad
        SDKs in the free version, without saying whether you can turn this off.
      sources: [privacy]
    trackers:
      value: 3
      note: Google AdMob, Crashlytics and Firebase Analytics, in version 207.0.5.
      sources: [exodus]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 11.99, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 2.59, currency: USD }
      note: $69.99 for the first two years plus three bonus months, then $71.99 a year. A year is $47.99, renewing at $71.99.
      sources: [pricing, renewal-terms]
    best_term:
      value: 27
      sources: [pricing]
    renewal_increase:
      value: 131
      sources: [pricing, renewal-terms]
    free_tier:
      value: true
      note: 26 locations in 15 countries, with ads in the mobile apps.
      sources: [free-vpn]
    refund_days:
      value: 30
      note: First purchases only, and not for crypto payments.
      sources: [terms, pricing]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It says RAM-only servers make logging "physically impossible", obfuscation gives "complete anonymity",
        and the free plan has "no ads, and no tracking" while its Android app carries AdMob and Firebase.
      sources: [ram-only, obfuscation, free-vpn, exodus]
    affiliates:
      value: true
      note: Students who post videos about it get affiliate commission on sales.
      sources: [ambassador]
    review_sites: false
    activism:
      value: true
      note: Says it's an EFF supporter and an Internet Society organisation member.
      sources: [about, trust-center]

