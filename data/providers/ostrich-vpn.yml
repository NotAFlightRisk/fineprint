  itunes-lookup:
    url: https://itunes.apple.com/lookup?id=1532634346&country=us
    title: Ostrich VPN - Proxy Master, App Store lookup (released 15 March 2021)
  apk:
    url: https://web.archive.org/web/20260207025226/https://www.ostrichvpn.net/
    title: >-
      Ostrich VPN site linking its Android 3.5.1 APK (archived February 2026), an ics-openvpn, strongSwan
      and leaf VMess build with AdMob, Firebase Analytics and GameAnalytics
  ttp-2025:
    url: https://www.techtransparencyproject.org/articles/apple-offers-apps-with-ties-to-chinese-military
