# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Browsec
icon: browsec.svg
checked: 2026-10-27

criteria:
  identity:
    website: https://browsec.com
    legal_entity:
      value: Browsec Inc
      note: Browsec says it's a Delaware company. Its Google Play and App Store listings name Browsec Inc, at an Alexandria, Virginia address.
      sources: [terms, policy, about, play, app-store]
    owner:
      value: null
      note: Who owns Browsec Inc isn't public.
      sources: [about]
    founded:
      value: 2012
      sources: [about]
    team:
      value: anonymous
      sources: [about]
    sister_brands:
      value: []
      sources: [play-dev, app-store-dev]
    acquisitions: []

  jurisdiction:
    hq:
      value: US
      sources: [about, play]
    entities:
      value: [US]
      note: The terms say Browsec Inc itself takes payment for orders from Russia, where Paddle doesn't sell.
      sources: [terms]

  logging:
    traffic:
      value: null
      note: Its site and help pages say it never tracks or accesses the sites you visit, but the privacy policy makes no such promise.
      sources: [about, help-android, policy]
    dns:
      value: null
      sources: [policy]
    timestamps:
      value: null
      note: The policy keeps device activity records, without saying what's in them or for how long, even after an account is deleted.
      sources: [policy]
    bandwidth:
      value: null
      sources: [policy]
    source_ip:
      value: null
      sources: [policy]
    proven: []
    policy: https://browsec.com/en/privacypolicy

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: required
      note: Free use needs no account. Premium needs an account with a confirmed email address.
      sources: [faq, create-account]
    personal_data: []
    payment:
      value: [card, paypal, app_store]
      note: Paddle sells it outside Russia. The FAQ also mentions unnamed local payment methods in some regions.
      sources: [payment-methods, faq, terms]

  security:
    protocols:
      value: [ikev2, other]
      note: >-
        The mobile apps use IKEv2/IPsec and Xray, and the desktop apps bundle Xray and sing-box. The
        browser extensions are an HTTPS proxy, so they only cover that browser.
      sources: [faq, desktop-release]
    post_quantum: none
    kill_switch:
      value: app
      evidence: claimed
      note: >-
        The extension blocks the browser's traffic if the proxy drops. On Android it points you to the
        system's Always-on VPN setting, which is off until you turn it on.
      sources: [kill-switch-extension, kill-switch-android]
    dns:
      value: third_party
      note: The desktop app sends lookups through the tunnel to Cloudflare's 1.1.1.1, with Google's resolvers as a fallback.
      sources: [desktop-1-4-2]

  infra:
    ram_only:
      value: null
      note: It doesn't say whether its servers run from RAM.
      sources: [locations]
    hosting:
      value: null
      note: It doesn't say whether it owns or rents its servers.
      sources: [locations]
    virtual_locations:
      value: null
      note: It calls its locations virtual locations, without saying where the servers physically sit.
      sources: [locations, dns-leak]
    servers:
      value: 1374
      note: Elsewhere it says 1,000+ servers.
      sources: [home, dns-leak]
    countries:
      value: 45
      note: 46 locations including two in the US. The plans page leaves out New Zealand.
      sources: [order, locations, plans]

  features:
    connections:
      value: 5
      note: Each browser profile counts as a device, and you can only swap a device once a day.
      sources: [devices, faq]
    multihop: false
    obfuscation:
      value: [v2ray]
      note: V2Ray here is Xray with VLESS, in the mobile and desktop apps.
      sources: [faq, desktop-release]
    port_forwarding: false
    split_tunnel:
      value: true
      note: Per app on Android and desktop. The extension's Smart Settings pick per site, with one rule on the free plan.
      sources: [split-tunnel, windows, smart-settings]
    blocking: []

  clients:
    platforms:
      value: [windows, macos, linux_gui, ios, android, browser]
      note: >-
        The extensions for Chrome, Firefox, Edge and Opera are a proxy for that browser alone. The desktop
        apps cover the whole machine but need Premium, and the Linux one is a .deb for Ubuntu and Debian only.
      sources: [about, faq, linux]
    open_source:
      value: none
      sources: [desktop-release]
    telemetry:
      value: forced
      evidence: claimed
      note: >-
        The policy says the software has to record operational data while the service is on. The Chrome
        extension sends usage events to Google Analytics and Jitsu, and only the Firefox add-on has a switch to stop it.
      sources: [policy, chrome-extension]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 6.99, currency: USD }
      sources: [plans]
    best:
      value: { amount: 2.99, currency: USD }
      sources: [plans]
    best_term:
      value: 24
      sources: [plans]
    renewal_increase:
      value: 0
      note: Plans renew at the price they start at, $71.99 every two years or $39.99 a year, though a first 2-year purchase currently adds two free months.
      sources: [order, monthly-to-yearly]
    free_tier:
      value: true
      note: Free use gets a handful of locations, which vary by platform, at much lower speeds.
      sources: [plans, faq]
    refund_days:
      value: 7
      sources: [terms, faq]

  ethics:
    misleading_claims:
      value: true
      note: It sells "military-grade encryption" and anonymity, and says it never tracks your activity, while its policy records activity data.
      sources: [about, policy]
    affiliates:
      value: null
      note: It doesn't say whether it pays affiliates.
      sources: [terms]
    review_sites: false
    activism: false

