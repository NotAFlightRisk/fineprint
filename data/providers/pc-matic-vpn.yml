# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: PC Matic VPN
icon: pc-matic-vpn.png
checked: 2026-10-28

criteria:
  identity:
    website: https://www.pcmatic.com/vpn/
    legal_entity:
      value: PC Matic, Inc.
      sources: [terms]
    owner:
      value: null
      note: PC Matic names no parent company. Its founder, Rob Cheng, is executive chairman.
      sources: [leadership]
    founded:
      value: 2023
      note: Its VPN page dates from June 2023 and the iOS app from July 2023. The current two-tier plans launched in July 2026.
      sources: [vpn-2023, ios-lookup, tiers-2026]
    team:
      value: public
      sources: [leadership]
    sister_brands:
      value: []
      sources: [about]
    acquisitions:
      value: []
      sources: [about, leadership]

  jurisdiction:
    hq:
      value: US
      note: PC Matic is in Sioux City, Iowa.
      sources: [play, refund]
    entities:
      value: [US]
      sources: [terms]

  logging:
    traffic:
      value: none
      evidence: claimed
      note: >-
        The network is WLVPN's, a white-label service run by Ziff Davis, and PC Matic's policy doesn't say
        what WLVPN keeps.
      sources: [privacy, wlvpn]
    dns:
      value: none
      evidence: claimed
      sources: [privacy]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: The policy lists connection timestamps among the data the VPN collects, with no retention period for them.
      sources: [privacy]
    bandwidth:
      value: null
      note: >-
        The policy lists "VPN server connection metadata" without saying what that covers. Data use is
        unlimited.
      sources: [privacy, tiers-2026]
    source_ip:
      value: 'yes'
      evidence: claimed
      note: >-
        The policy lists your IP address "for connection establishment" among the data the VPN collects, with
        no retention period for it.
      sources: [privacy]
    proven:
      value: []
      note: No audit of PC Matic VPN has been published.
    policy: https://www.pcmatic.com/privacy/

  transparency:
    audits:
      value: []
      note: No audit of PC Matic VPN has been published. WLVPN's own claims of independent checks don't name PC Matic.
      sources: [wlvpn-home]
    report:
      value: none
      sources: [privacy]
    canary: none
    bug_bounty:
      value: false
      note: Security reports go to an email address, with no reward on offer.
      sources: [privacy]
    incidents: []

  account:
    email:
      value: required
      note: You sign in to the apps with your PC Matic account.
      sources: [cart, kb-install]
    personal_data:
      value: []
      sources: [cart]
    payment:
      value: [card, paypal]
      note: Cards go through Stripe. The mobile apps don't sell subscriptions.
      sources: [cart, app-store, play]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2]
      note: The iOS app also offers IPSec, and macOS only WireGuard and IKEv2.
      sources: [kb-android, kb-ios, kb-mac, kb-website]
    post_quantum:
      value: none
      sources: [kb-ios, kb-windows]
    kill_switch:
      value: app
      note: >-
        On Windows, a full-device kill switch you turn on yourself on Standard and that's on by default on
        Stealth. On Android it points you to the system's Always-on VPN setting.
      sources: [kb-kill-switch, product, kb-android]
    dns:
      value: null
      note: It promises DNS leak protection but doesn't say whose DNS servers answer inside the tunnel.
      sources: [product, kb-windows]

  infra:
    ram_only:
      value: null
      note: Neither PC Matic nor WLVPN says whether the servers run from RAM.
      sources: [wlvpn-home]
    hosting:
      value: null
      note: >-
        It runs on WLVPN, the IPVanish-powered white-label network owned by Ziff Davis. Its status page reads
        WLVPN's, and its Android app is built on WLVPN's SDK and talks to api.wlvpn.com.
      sources: [status, status-js, apk, wlvpn]
    virtual_locations:
      value: null
      note: >-
        Stealth claims 140+ locations, while WLVPN lists physical servers in 80 cities. PC Matic doesn't say
        whether any of its locations are virtual.
      sources: [product, wlvpn-home]
    servers:
      value: null
      note: PC Matic gives no server count. WLVPN, whose network it uses, lists 2,200 servers.
      sources: [wlvpn-home]
    countries:
      value: null
      note: >-
        PC Matic counts locations, not countries: 25 on Standard and 140+ on Stealth. WLVPN lists servers in
        50 countries.
      sources: [product, wlvpn-home]

  features:
    connections:
      value: 5
      sources: [cart, tiers-2026]
    multihop:
      value: true
      note: >-
        Only Stealth lets you pick entry and exit servers, and only on Windows. What it calls multi-hop on
        Standard is an automatic fallback server.
      sources: [product, tiers-2026]
    obfuscation:
      value: []
      sources: [kb-website, kb-windows]
    port_forwarding:
      value: false
      note: IPVanish, which runs on the same network, doesn't support it either.
      sources: [kb-website, ipvanish-port-forwarding]
    split_tunnel:
      value: true
      note: On Windows, for apps and websites.
      sources: [kb-setup, kb-website]
    blocking:
      value: null
      note: The Windows app has a Threat Protection setting, but PC Matic doesn't say what it blocks.
      sources: [kb-windows, kb-stealth-disconnect]

  clients:
    platforms:
      value: [windows, macos, ios, android, router]
      note: >-
        Routers get a WireGuard or OpenVPN config, and only on Stealth. The iOS app is still version 1.0 from
        July 2023.
      sources: [kb-install, kb-router, ios-lookup]
    open_source:
      value: none
      sources: [eula]
    telemetry:
      value: null
      note: >-
        The VPN sends diagnostic data, and Google Play's label says diagnostics are shared with other
        companies. Neither says whether you can turn it off.
      sources: [privacy, play-data]
    fdroid: false

  pricing:
    monthly:
      value: null
      grade: na
      note: Only yearly plans are sold.
      sources: [product]
    best:
      value: { amount: 2.5, currency: USD }
      note: Standard, at $30 for the first year. Stealth, with every location, multi-hop and router configs, is $80.
      sources: [product]
    best_term: 12
    renewal_increase:
      value: 67
      note: Standard renews at $50 a year, and Stealth at $100.
      sources: [tiers-2026]
    free_tier:
      value: false
      sources: [tiers-2026]
    refund_days:
      value: 30
      note: First purchases only. Renewals and app store purchases aren't refunded.
      sources: [refund]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It promises to make you "anonymous" with "military-grade encryption", and calls itself the fastest
        VPN in the world off an unnamed third party's test.
      sources: [product]
    affiliates:
      value: true
      sources: [affiliates]
    review_sites:
      value: false
      note: Nothing ties PC Matic to one. Its network comes from WLVPN, part of Ziff Davis, which owns PCMag.
      sources: [wlvpn, zd-10k-2025]
    activism: false

