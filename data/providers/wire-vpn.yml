# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: WireVPN
icon: wire-vpn.png
checked: 2026-10-28

criteria:
  identity:
    website:
      value: https://www.wirevpn.app
      sources: [home]
    legal_entity:
      value: WEILAI NETWORK TECHNOLOGY CO., LIMITED
      note: >-
        A UK company that sells both store apps. The privacy policy and user agreement don't name any company,
        and the Google Play developer account goes by WIRE LTD.
      sources: [play, app-store, companies-house]
    owner:
      value: Zhihua Sheng
      note: >-
        WEILAI's sole director and only person with significant control, holding 75% or more. In 2025 the Tech
        Transparency Project found he lives in China and the company's accounts showed it dormant with £100 in
        assets.
      sources: [ttp-2025, companies-house-officers, companies-house-psc]
    founded:
      value: 2021
      note: WEILAI was incorporated in November 2021, and the iOS app came out in March 2022.
      sources: [companies-house, app-store-lookup]
    team:
      value: partial
      note: Its site names no one who runs it, but Companies House names the director and owner.
      sources: [home, companies-house-officers]
    sister_brands:
      value: []
      note: >-
        WEILAI sells no other apps. The WireVPN site's iOS download link and most of its blog are for iSharkVPN,
        sold by ROCKET NETWORK TECHNOLOGY CO., LTD, and TTP found a second "Wirevpn" iOS app with an identical
        privacy policy on a developer account that now sells iSharkVPN, but no register ties iSharkVPN to WEILAI's
        owner.
      sources: [app-store-developer, play-developer, ttp-2025, downloads, ishark-lookup]
    acquisitions:
      value: []
      sources: [app-store-lookup, companies-house]

  jurisdiction:
    hq:
      value: GB
      evidence: claimed
      note: >-
        Its only company is registered in the UK, but the director and controlling shareholder lives in China and
        the user agreement is governed by the laws of the People's Republic of China.
      sources: [companies-house, companies-house-officers, user-agreement]
    entities:
      value: [GB]
      note: The registered office has moved several times in 2026, most recently to Bromley.
      sources: [companies-house, companies-house-filings]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy]
    dns:
      value: none
      evidence: claimed
      sources: [privacy]
    timestamps:
      value: none
      evidence: claimed
      sources: [privacy]
    bandwidth:
      value: none
      evidence: claimed
      sources: [privacy]
    source_ip:
      value: none
      evidence: claimed
      sources: [privacy]
    proven: []
    policy: https://api.wirevpn.app/files/privacy_policy.html

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents:
      value:
        - date: 2026-07-07
          summary: >-
            Infoblox reported that WireVPN's Windows builds, signed with WEILAI's certificate and talking to
            WireVPN's own domains, behave like residential proxy software, turning PCs into exit nodes for other
            people's traffic, and tied them to a malware operation running since 2022. WEILAI denied it and said
            the files Infoblox examined aren't official WireVPN software.
          handled: poorly
          source: infoblox

  account:
    email:
      value: optional
      note: Most features work without an account.
      sources: [privacy]
    personal_data: []
    payment:
      value: []
      note: Neither app sells anything, though the policy says a premium subscription would go through Apple or Google.
      sources: [app-store, privacy]

  security:
    protocols:
      value: [proprietary]
      note: >-
        Its own closed relay protocol, AES with an XOR layer behind a tun2socks tunnel on Android and a traffic
        redirecting driver on Windows. Nothing about it is published.
      sources: [apk, downloads]
    post_quantum:
      value: none
      note: Nothing is published about its key exchange.
    kill_switch:
      value: none
      note: Neither the Android nor the Windows app has one.
      sources: [apk, downloads]
    dns:
      value: null
      note: The app takes its DNS servers from the VPN server's config, with Google's 8.8.8.8 built in as well.
      sources: [apk]

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: null
      note: It doesn't say whether it owns or rents its servers.
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
    servers:
      value: 4600
      evidence: claimed
      note: Other pages on its site claim more than 3,600, and over 100.
      sources: [home, android-page, free]
    countries:
      value: 76
      evidence: claimed
      note: Other pages on its site claim more than 100 countries, and 6.
      sources: [home, android-page, free]

  features:
    connections:
      value: null
      note: The homepage says unlimited devices, but the user agreement says one account can't be used on several computers at once.
      sources: [home, agreement]
    multihop: false
    obfuscation:
      value: null
      note: There's no setting for it, and its own relay protocol isn't published, so whether it's built to get past blocks isn't clear.
      sources: [apk]
    port_forwarding: false
    split_tunnel:
      value: false
      note: >-
        There's no setting for it, though the app takes lists of domains and IPs to route differently from its
        servers, one of them named china_domain_list.
      sources: [apk]
    blocking:
      value: []
      sources: [apk]

  clients:
    platforms:
      value: [windows, ios, android]
      note: The site's macOS download link is dead, and its iOS link goes to iSharkVPN rather than WireVPN.
      sources: [app-store, play, windows, downloads]
    open_source: none
    telemetry:
      value: forced
      note: >-
        The policy says it collects device model, OS, language, region, app version and crash reports, and Android
        version 3.6.0 bundles Firebase Crashlytics and AppsFlyer with no setting to turn them off.
      sources: [privacy, apk]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 0, currency: USD }
      note: Free and paid for by ads, with no in-app purchases in either app.
      sources: [app-store, play]
    best:
      value: { amount: 0, currency: USD }
      sources: [app-store]
    best_term:
      value: null
      grade: na
      note: It's free.
      sources: [play]
    renewal_increase:
      value: 0
      note: Nothing renews.
    free_tier:
      value: true
      sources: [app-store, play]
    refund_days:
      value: null
      grade: na
      note: It's free, though the user agreement says nothing sold is refunded.
      sources: [play, user-agreement]

  ethics:
    misleading_claims:
      value: true
      note: >-
        The policy says every third-party SDK including Firebase and Google Mobile Ads has been removed and the app
        collects no data, but Android version 3.6.0 still bundles Google Mobile Ads, Firebase and AppsFlyer. The
        Play listing promises "a zero advertising application environment" while marked as containing ads, and
        its site reuses PIA's and iTop VPN's marketing copy.
      sources: [privacy, apk, play, servers, free]
    affiliates: false
    review_sites: false
    activism: false

  other:
    concerns:
      - summary: >-
          The user agreement is governed by Chinese law and bans using the app for anything that "endangers national
          security, national reunification, and social stability", and the account can be closed with records kept
          for the authorities.
        severity: minor
        source: user-agreement

