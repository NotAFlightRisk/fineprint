# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Tor VPN
icon: tor-vpn.svg
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://download.torproject.org/tor-vpn-for-android/
      sources: [download]
    legal_entity:
      value: The Tor Project, Inc.
      note: A US 501(c)(3) nonprofit.
      sources: [policy, propublica, play]
    owner:
      value: null
      grade: na
      note: A nonprofit with no parent company. It's funded by US federal agencies, private foundations and individual donors.
      sources: [propublica, who-funds]
    founded:
      value: 2025
      note: A limited beta release in autumn 2025. The Tor Project itself was founded in 2006.
      sources: [blog-beta, history]
    team:
      value: public
      sources: [people]
    sister_brands:
      value: []
      sources: [download]
    acquisitions: []

  jurisdiction:
    hq:
      value: US
      sources: [propublica, play]
    entities:
      value: [US]
      sources: [propublica]

  logging:
    traffic:
      value: none
      evidence: claimed
      note: >-
        The Tor Project runs none of the relays. Volunteer operators are asked not to look at or record
        traffic, and the exit relay that carries it doesn't know who you are.
      sources: [policy, relay-expectations, about]
    dns:
      value: none
      evidence: claimed
      note: Lookups are made by the volunteer exit relay, which can't see your IP address.
      sources: [troubleshooting, relay-expectations]
    timestamps:
      value: none
      evidence: claimed
      note: Relay operators are asked not to reveal the timing or volume of anyone's connections.
      sources: [policy, relay-expectations]
    bandwidth:
      value: none
      evidence: claimed
      note: Session stats stay on your phone and are dropped when the session ends.
      sources: [policy]
    source_ip:
      value: none
      evidence: claimed
      note: Only the first relay sees your IP address, and it can't see where your traffic goes.
      sources: [about, no-logs, relay-expectations]
    proven:
      value: []
      note: Its audit covered the app, not the relays.
      sources: [audit-2025]
    policy: https://www.torproject.org/about/privacy_policy/

  transparency:
    audits:
      value:
        - date: 2025-06-27
          auditor: Cure53
          scope: apps
          source: audit-2025
      evidence: verified
      note: Covered the Android app and its onionmasq tunnel library over two weeks in June 2025, not the Tor network.
      sources: [audit-blog]
    report: none
    canary: none
    bug_bounty:
      value: true
      note: The Tor Project's HackerOne bounty pays for bugs in Tor and Arti, which the app runs on. The app itself isn't listed in scope.
      sources: [hackerone]
    incidents:
      value:
        - date: 2026-10-05
          summary: >-
            Attackers hacked some volunteers' relay servers and turned them into exits that intercepted SSH
            connections. The Tor Project flagged them and had them rejected from the network.
          handled: well
          source: relay-incident-2026
      sources: [relay-incident-2026]

  account:
    email:
      value: none
      note: There are no accounts.
      sources: [policy]
    personal_data:
      value: []
      sources: [policy]
    payment:
      value: []
      note: It's free. The Tor Project takes donations.
      sources: [download]

  security:
    protocols:
      value: [other]
      note: Traffic goes over the Tor network through Arti, Tor's Rust client, rather than a VPN protocol.
      sources: [about, fdroid]
    post_quantum:
      value: none
      note: Post-quantum circuit handshakes are still a design proposal for Tor.
      sources: [pq-proposal]
    kill_switch:
      value: none
      note: >-
        It has no kill switch of its own. Its Kill switch screen sends you to Android's Always-on VPN and
        Block connections without VPN settings, which are off by default.
      sources: [kill-switch, threat-model]
    dns:
      value: third_party
      note: Lookups are answered by whichever resolver the volunteer exit relay uses.
      sources: [troubleshooting]

  infra:
    ram_only:
      value: null
      note: Relays are volunteers' own machines, and Tor doesn't ask them to run from RAM.
      sources: [relay-expectations]
    hosting:
      value: null
      note: The Tor Project runs none of the relays. Thousands of volunteers host them on hardware they choose.
      sources: [download, relay-expectations]
    virtual_locations:
      value: none
      note: A relay's country comes from a GeoIP lookup of its address, not from what its operator says.
      sources: [onionoo-docs, exit-location]
    servers:
      value: 9183
      note: Running relays on 2026-10-26, 2,744 of them exits.
      sources: [onionoo]
    countries:
      value: 78
      note: Countries with a running relay on 2026-10-26. Exits were in 54 of them.
      sources: [onionoo]

  features:
    connections:
      value: unlimited
      note: There are no accounts, so nothing limits devices.
      sources: [policy]
    multihop:
      value: true
      note: Every connection goes through three relays, and each app gets its own circuit.
      sources: [about, fdroid]
    obfuscation:
      value: [obfs4, proprietary]
      note: >-
        Its own methods are Tor's Snowflake and WebTunnel bridges. The beta doesn't have all of Tor's
        anti-censorship features yet.
      sources: [bridges, fdroid, changelog]
    port_forwarding:
      value: null
      note: Tor VPN doesn't document it.
      sources: [about]
    split_tunnel:
      value: true
      note: By app. Tor Browser and Orbot are left out by default.
      sources: [config-apps]
    blocking: []

  clients:
    platforms:
      value: [android]
      note: Android 7 or newer. Tablets and Chromebooks aren't supported.
      sources: [install]
    open_source:
      value: all
      note: BSD-3-Clause, with reproducible builds.
      sources: [source-code, fdroid, changelog]
    telemetry:
      value: none
      evidence: claimed
      sources: [policy, fdroid]
    fdroid:
      value: true
      sources: [fdroid]

  pricing:
    monthly:
      value: { amount: 0, currency: USD }
      note: Free, and the Tor Project says it always will be.
      sources: [download]
    best:
      value: { amount: 0, currency: USD }
      sources: [install]
    best_term:
      value: null
      grade: na
      note: It's free.
      sources: [install]
    renewal_increase:
      value: 0
      note: Nothing renews.
      sources: [install]
    free_tier:
      value: true
      sources: [download, install]
    refund_days:
      value: null
      grade: na
      note: It's free.
      sources: [install]

  ethics:
    misleading_claims:
      value: false
      note: >-
        The Play listing says it hides your IP address from your apps, while its threat model says apps
        can read it on mobile data. The listing does warn that Android data can still identify you.
      sources: [play, threat-model]
    affiliates: false
    review_sites: false
    activism:
      value: true
      note: A nonprofit that builds free tools against surveillance and censorship.
      sources: [history]

  other:
    concerns:
      value:
        - summary: >-
            The Tor Project calls it beta software that may leak information, and says not to rely on it
            for anything sensitive.
          severity: minor
          source: support
        - summary: >-
            Exit relays are run by volunteers, and a bad one can read anything you send unencrypted, though
            it can't tell who sent it.
          severity: serious
          source: tor-vs-proxies

