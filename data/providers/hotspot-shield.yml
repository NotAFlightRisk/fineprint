# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Hotspot Shield
icon: hotspot-shield.png
checked: 2026-10-21

criteria:
  identity:
    website: https://www.hotspotshield.com
    legal_entity:
      value: Anchorfree, LLC
      note: Or Pango GmbH in Switzerland, depending on where you buy.
      sources: [tos, privacy-policy]
    owner:
      value: Point Wild
      note: >-
        Aura bought Pango, Hotspot Shield's maker, in 2020 and spun it off to its own shareholders in
        2024. Pango Group then merged with Total Security, TotalAV's maker, to form Point Wild.
      sources: [aura-pango-2020, aura-split-2024, point-wild-merger, comparitech-disclosure]
    team:
      value: partial
      note: There's no Hotspot Shield leadership page, but Pango's site names its president and other executives.
      sources: [pango-team]
    sister_brands:
      value: [Betternet, Touch VPN, UltraVPN, VPN 360, TotalAV VPN, OVPN, VPN in Touch]
      note: TotalAV's VPN joined the family when Pango Group merged with TotalAV's maker, Total Security.
      sources: [aura-split-2024, privacy-vpn, point-wild-merger, totalav-vpn, ovpn-next-chapter, vpn-in-touch]
    acquisitions:
      value:
        - date: 2024-12-12
          acquirer: Point Wild
          source: point-wild-merger
        - date: 2024-09-03
          acquirer: Pango Group, spun off from Aura
          source: aura-split-2024
        - date: 2020-07-07
          acquirer: Aura
          source: aura-pango-2020
      note: >-
        Point Wild was formed when Pango Group merged with Total Security in December 2024. The 2024
        spin-off gave Aura's shareholders matching shares in Pango Group.
      sources: [aura-pango-2020, aura-split-2024, point-wild-merger, comparitech-disclosure]

  jurisdiction:
    hq:
      value: US
      sources: [tos]
    entities:
      value: [US, CH]
      note: Anchorfree, LLC is in Boston and Pango GmbH in Stans, Switzerland.
      sources: [privacy-policy, tos]

  logging:
    traffic:
      value: aggregate
      evidence: verified
      note: >-
        It doesn't inspect what you send, but it logs the domains people visit, without full URLs or
        anything that identifies them, and aggregates them about monthly.
      sources: [privacy-vpn, audit-aon-2023]
    dns:
      value: aggregate
      evidence: verified
      note: Domains visited are logged without a user or device attached and aggregated about monthly.
      sources: [privacy-vpn, audit-aon-2023]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: >-
        It logs how long each VPN session lasts and ties usage data to a random ID for your device,
        without saying how long it keeps it.
      sources: [privacy-vpn, privacy-policy]
    bandwidth:
      value: 'yes'
      evidence: claimed
      note: >-
        It logs the data each session uses and measures it against a random device ID, partly to enforce
        the free plan's limits, without saying how long it keeps it.
      sources: [privacy-vpn]
    source_ip:
      value: temporary
      evidence: verified
      note: >-
        Kept encrypted until the session ends. It also uses your IP to work out your rough location and
        ISP, and to attribute ads.
      sources: [privacy-vpn, audit-aon-2023]
    proven:
      value: [audit]
      evidence: verified
      note: Aon's 2023 review checked that browsing activity isn't logged with your IP or another identifier.
      sources: [audit-aon-2023]
    policy: https://www.hotspotshield.com/privacy-policy/vpn/

  transparency:
    audits:
      value:
        - date: 2023-08-25
          auditor: Aon
          scope: no_logs
          source: audit-aon-2023
      evidence: verified
      note: >-
        Only a four-page summary of Aon's review is published, dated by the report. The Android app has
        no Google MASA listing.
      sources: [security-audit, audit-aon-2023]
    report:
      value: irregular
      note: Its site calls the report annual, but the newest is Pango's for 2023, published by Point Wild.
      sources: [pango-transparency-2023, point-wild-reports, free-vpn]
    canary: none
    bug_bounty:
      value: false
      note: Pango used to list fixed vulnerabilities and thank reporters on a security page, which has since gone.
      sources: [pango-security, cymptom-2020]
    incidents:
      value:
        - date: 2020-06-14
          summary: >-
            Cymptom reported a Windows app flaw that let a local user overwrite any file as SYSTEM
            (CVE-2020-17365). Hotspot Shield replied in two days, sent a fix to test in July and
            published the update in September 2020.
          handled: well
          source: cymptom-2020
        - date: 2018-03-12
          summary: >-
            Researchers hired by a VPN review site found the Chrome extension could leak your real IP
            address (CVE-2018-7878 to CVE-2018-7880). Hotspot Shield fixed them promptly, after version
            3.2.14, while two other VPNs named hadn't responded.
          handled: well
          source: pango-security
        - date: 2018-01-30
          summary: >-
            Paulos Yibelo published a flaw in the app's local web server that let websites read VPN
            status, Wi-Fi name and country (CVE-2018-6460). AnchorFree hadn't answered his December
            report, disputed that real IPs leaked, then shipped a fix on 6 February.
          handled: poorly
          source: ssd-2018
        - date: 2017-08-07
          summary: >-
            The Center for Democracy & Technology asked the FTC to investigate the free app, saying it
            injected ads and tracking code and redirected traffic despite promising privacy. AnchorFree
            called the claims unfounded, and no FTC action is on record.
          handled: poorly
          source: cdt-2017
      sources: [cymptom-2020, pango-security, securityaffairs-2018, ssd-2018, zdnet-2018, cdt-2017, eweek-2017]

  account:
    email:
      value: required
      note: The free app works without an account.
      sources: [privacy-vpn]
    personal_data:
      value: null
      note: The privacy policy says buying may need your billing name and address, depending on how you pay.
      sources: [privacy-policy]
    payment:
      value: [card, paypal, app_store]
      sources: [paypal, app-store, privacy-policy]

  security:
    protocols:
      value: [proprietary, wireguard, ikev2]
      note: >-
        Hydra, its own protocol built on OpenVPN, is the default. Aon also found OpenVPN in 2023, but the
        apps' settings no longer list it.
      sources: [protocols, features-settings, security-article, audit-aon-2023]
    post_quantum:
      value: none
      note: Nothing on its site or help centre mentions post-quantum key exchange.
      sources: [protocols, security-article]
    kill_switch:
      value: app
      note: A setting on Windows, Android and iOS that cuts the internet if the VPN drops, but not after you disconnect yourself.
      sources: [kill-switch, features-settings]
    dns:
      value: null
      note: It says DNS requests are encrypted, but not whose servers answer them.
      sources: [dns-leaks]

  infra:
    ram_only:
      value: null
      note: Hotspot Shield doesn't say its servers run from RAM.
      sources: [server-locations, security-article]
    hosting:
      value: rented
      sources: [privacy-vpn]
    virtual_locations:
      value: disclosed
      note: >-
        The server page lists India as served via Singapore. It doesn't say whether any of its other
        locations are virtual.
      sources: [server-locations]
    servers:
      value: null
      note: Its own pages variously claim 800+, 1,800+ and 3,200+ servers.
      sources: [server-locations, pricing, security-audit]
    countries:
      value: 85
      note: Counted from its server locations page, which says 80+, including India via Singapore.
      sources: [server-locations]

  features:
    connections:
      value: 10
      note: Free accounts get one.
      sources: [devices]
    multihop:
      value: true
      note: Android only.
      sources: [multihop]
    obfuscation:
      value: [proprietary]
      note: Hotspot Shield says Hydra looks like ordinary encrypted web traffic and is hard for censors to block.
      sources: [protocols]
    port_forwarding:
      value: false
      sources: [features-settings]
    split_tunnel:
      value: true
      note: On iOS it only works for websites, not apps.
      sources: [features-settings]
    blocking:
      value: [malware]
      note: It blocks sites known for malware or phishing, not ads or trackers.
      sources: [pricing, antivirus]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: >-
        Also Android TV. The help centre says Linux and routers aren't supported. The Chrome and Firefox
        extensions only cover the browser.
      sources: [devices, firefox, chrome]
    open_source:
      value: none
      sources: [protocols, security-article]
    telemetry:
      value: null
      note: >-
        The policy says it collects which app features you use and when, tied to a random device ID, but
        doesn't mention a way to turn this off.
      sources: [privacy-policy, privacy-vpn]
    trackers:
      value: 10
      note: >-
        Mostly ad networks such as AdMob, ironSource, Pangle and Unity Ads, in version 10.1.2 from
        February 2023, the newest archived report.
      sources: [exodus]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 12.99, currency: USD }
      note: Premium, shown as $1.99 for the first month and $12.99 a month after.
      sources: [pricing, plan-script]
    best:
      value: { amount: 2.42, currency: USD }
      note: An intro price of $29 for the first year of Premium. It then renews at $95.99 a year, about $8 a month.
      sources: [pricing]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 231
      note: The 1-year plan is $29, then renews at $95.99 a year.
      sources: [pricing, plan-script]
    free_tier:
      value: true
      note: >-
        Basic is ad-supported and limited to one device and the US location, with a daily data cap on
        iOS and Android that watching ads can lift.
      sources: [pricing, basic-premium]
    refund_days:
      value: 45
      note: For purchases made directly or through Google Play.
      sources: [pricing, refund-google-play]

  ethics:
    misleading_claims:
      value: true
      note: It promises "military-grade encryption" and that you can "browse anonymously".
      sources: [pricing, security-audit]
    affiliates:
      value: true
      sources: [affiliates]
    review_sites:
      value: true
      note: Point Wild also owns Comparitech, a VPN review site, which discloses it.
      sources: [comparitech-disclosure]

