# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: VPN 360
icon: vpn-360.png
checked: 2026-10-26

criteria:
  identity:
    website: https://www.vpn360.com
    legal_entity:
      value: Anchorfree LLC
      note: >-
        The terms also name Pango GmbH in Switzerland, which the App Store lists as the seller. Google
        Play's developer details give Pango, LLC at the same Boston address.
      sources: [tos, privacy-policy, ios-app, play]
    owner:
      value: Point Wild
      note: >-
        TouchVPN Inc., the maker of its sister Touch VPN, took over VPN 360 from its Hong Kong developer in
        December 2018, and Touch VPN was AnchorFree's by 2019. Aura bought AnchorFree, by then called
        Pango, in 2020 and spun Pango off in 2024, and Pango Group then merged with Total Security to form
        Point Wild.
      sources: [ios-2018, ios-2018-touchvpn, touch-policy-2019, aura-pango-2020, aura-split-2024, point-wild-merger, comparitech-disclosure]
    founded:
      value: 2017
      note: The iPhone app came out in January 2017, from Infinity Software Co., Limited in Hong Kong.
      sources: [app-lookup, policy-2017, ios-2018]
    team:
      value: partial
      note: There's no VPN 360 leadership page, but Pango's site names its president and other executives.
      sources: [pango-team]
    sister_brands:
      value: [Hotspot Shield, Betternet, Touch VPN, UltraVPN, TotalAV VPN, OVPN]
      note: TotalAV's VPN joined the family when Pango Group merged with TotalAV's maker, Total Security.
      sources: [aura-split-2024, privacy-vpn, point-wild-merger, totalav-vpn, ovpn-next-chapter]
    acquisitions:
      value:
        - date: 2024-12-12
          acquirer: Point Wild
          source: point-wild-merger
        - date: 2024-09-03
          acquirer: Pango Group, spun off from Aura
          source: aura-split-2024
        - date: 2020-07-07
          acquirer: Aura
          source: aura-pango-2020
        - date: 2018-12-01
          acquirer: TouchVPN Inc., Touch VPN's maker, now part of Pango
          source: ios-2018-touchvpn
      note: >-
        The App Store seller changed from Infinity Software Co., Limited to TouchVPN Inc. in mid-December
        2018, and Google Play listed TouchVPN Inc. by April 2019. Point Wild was formed when Pango Group
        merged with Total Security in December 2024.
      sources: [ios-2018, ios-2018-touchvpn, play-2019, aura-pango-2020, aura-split-2024, point-wild-merger]

  jurisdiction:
    hq:
      value: US
      sources: [tos]
    entities:
      value: [US, CH]
      note: Anchorfree LLC is in Boston and Pango GmbH in Stans, Switzerland.
      sources: [tos, privacy-policy]

  logging:
    traffic:
      value: aggregate
      evidence: verified
      note: >-
        It doesn't inspect what you send, but it logs the domains people visit, without full URLs or
        anything that identifies them, and aggregates them about monthly.
      sources: [privacy-notice, audit-aon-2023]
    dns:
      value: aggregate
      evidence: verified
      note: Domains visited are logged without a user or device attached and aggregated about monthly.
      sources: [privacy-notice, audit-aon-2023]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: >-
        It logs how long each VPN session lasts and ties usage data to a hash of your device, without
        saying how long it keeps it.
      sources: [privacy-notice, privacy-policy]
    bandwidth:
      value: 'yes'
      evidence: claimed
      note: >-
        It logs the data each session uses and measures it against a device hash, partly to enforce the
        free app's limits, without saying how long it keeps it.
      sources: [privacy-notice]
    source_ip:
      value: temporary
      evidence: verified
      note: >-
        Kept encrypted until the session ends. It also uses your IP to work out your rough location and
        ISP, and to attribute ads.
      sources: [privacy-notice, audit-aon-2023]
    proven:
      value: [audit]
      evidence: verified
      note: Aon's 2023 review checked that browsing activity isn't logged with your IP or another identifier.
      sources: [audit-aon-2023]
    policy: https://www.vpn360.com/privacy-notice/

  transparency:
    audits:
      value:
        - date: 2023-08-25
          auditor: Aon
          scope: no_logs
          source: audit-aon-2023
        - date: 2023-01-30
          auditor: NowSecure
          scope: apps
          source: masa-2023
      evidence: verified
      note: Only a four-page summary of Aon's review is published, dated by the report. NowSecure's is a MASA check of Android version 5.13.0.
      sources: [point-wild-reports, audit-aon-2023]
    report:
      value: irregular
      note: The newest is Pango's group-wide report for 2023, published by Point Wild.
      sources: [pango-transparency-2023, point-wild-reports]
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: required
      note: The free app works without an account.
      sources: [tos, play]
    personal_data:
      value: null
      note: The privacy policy says creating an account may collect your name as well as your email, without saying which you have to give.
      sources: [privacy-policy]
    payment:
      value: [card, paypal, app_store]
      sources: [cancel-renewal, purchase]

  security:
    protocols:
      value: [proprietary, openvpn, other]
      note: >-
        Aon found Hydra, Pango's own protocol, plus OpenVPN and IPSec in 2023. VPN 360 now just says it
        has multiple protocols.
      sources: [audit-aon-2023, pricing]
    post_quantum: none
    kill_switch:
      value: app
      note: A setting in the Windows app that stops traffic if the VPN drops. It isn't documented for the phone apps.
      sources: [windows-settings]
    dns:
      value: null
      note: It claims DNS leak protection, but not whose servers answer DNS requests.
      sources: [pricing]

  infra:
    ram_only:
      value: null
      note: VPN 360 doesn't say its servers run from RAM.
    hosting:
      value: rented
      sources: [privacy-notice]
    virtual_locations:
      value: disclosed
      note: >-
        The homepage map shows India as served via Singapore. It doesn't say whether any of its other
        locations are virtual.
      sources: [home]
    servers:
      value: null
      note: Its pricing page says 800+ servers, while its App Store and Google Play listings say 1,800+.
      sources: [pricing, ios-app, play]
    countries:
      value: 85
      sources: [home]

  features:
    connections:
      value: 5
      note: For Premium. Its App Store and Google Play listings say 10, as did the pricing page until mid-2026.
      sources: [pricing, ios-app, play, pricing-2026]
    multihop:
      value: null
      note: It offers Tor over VPN, but doesn't mention routing through two of its own servers.
      sources: [pricing]
    obfuscation:
      value: [proprietary]
      note: It lists "traffic obfuscations" without naming a method.
      sources: [pricing]
    port_forwarding: false
    split_tunnel:
      value: null
      note: VPN 360 doesn't say whether it offers split tunnelling.
    blocking:
      value: [malware]
      note: It blocks sites known for malware or phishing. It doesn't say what its DNS filtering covers.
      sources: [pricing, play]

  clients:
    platforms:
      value: [windows, ios, android]
      note: The iPad app also runs on Macs with Apple silicon. There's no Linux, router or browser app.
      sources: [platforms, ios-app]
    open_source: none
    telemetry:
      value: null
      note: >-
        The policy says it ties how you use the app to a hash of your device for analytics and marketing,
        but doesn't mention a way to turn this off.
      sources: [privacy-notice, privacy-policy]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 11.99, currency: USD }
      note: Premium.
      sources: [pricing, ios-app]
    best:
      value: { amount: 3.00, currency: USD }
      note: >-
        $35.99 a year, which the homepage says it renews at too. The pricing page now shows $1.99 a month
        without a plan length.
      sources: [ios-app, home, pricing]
    best_term:
      value: 12
      sources: [ios-app, pricing-2026]
    renewal_increase:
      value: 0
      note: The App Store prices are what each plan renews at.
      sources: [ios-app]
    free_tier:
      value: true
      note: Basic is ad-supported and only connects to US servers.
      sources: [pricing, why-vpn360, tos]
    refund_days:
      value: 0
      note: The terms say direct purchases aren't refundable unless the law requires it.
      sources: [tos]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Its App Store listing promises "complete privacy with no saved logs", while its privacy notice
        lists session lengths, bandwidth and domains.
      sources: [ios-app, play, privacy-notice]
    affiliates:
      value: null
      note: VPN 360 doesn't publish an affiliate scheme of its own, though its sister Hotspot Shield runs one.
      sources: [hss-affiliates]
    review_sites:
      value: true
      note: Point Wild also owns Comparitech, a VPN review site, which discloses it.
      sources: [comparitech-disclosure]
    activism: false

