# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Ghost Path
icon: ghostpath.png
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://ghostpath.com
      sources: [home]
    legal_entity:
      value: Ghost Path, Inc.
      note: A Georgia corporation, according to its terms.
      sources: [terms, checkout-monthly]
    owner:
      value: null
      note: Who owns Ghost Path, Inc. isn't published.
      sources: [terms]
    founded:
      value: 2012
      sources: [home, rdap]
    team:
      value: partial
      note: Its founder, Jim Lastinger, signs its blog posts and help articles. Nobody else is named.
      sources: [blog-net-neutrality, blog-energy]
    sister_brands: []
    acquisitions:
      value: null
      note: Whether Ghost Path, Inc. has ever changed hands isn't published.
      sources: [terms]

  jurisdiction:
    hq:
      value: US
      sources: [terms]
    entities:
      value: [US]
      sources: [terms]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [policy, faq]
    dns:
      value: none
      evidence: claimed
      sources: [policy, faq]
    timestamps:
      value: none
      evidence: claimed
      sources: [policy]
    bandwidth:
      value: none
      evidence: claimed
      sources: [policy]
    source_ip:
      value: none
      evidence: claimed
      sources: [policy]
    proven:
      value: []
      sources: [policy]
    policy: https://ghostpath.com/privacy

  transparency:
    audits:
      value: []
      sources: [home]
    report:
      value: none
      sources: [home]
    canary:
      value: none
      sources: [home]
    bug_bounty:
      value: false
      sources: [contact]
    incidents: []

  account:
    email:
      value: required
      sources: [checkout-monthly, getting-started]
    personal_data:
      value: []
      note: It keeps your name with your billing details.
      sources: [policy, checkout-monthly]
    payment:
      value: [card]
      note: Its FAQ also lists PayPal, Bitcoin, and cash or money orders by post, but the plans on its pricing page check out by card only.
      sources: [pricing, checkout-monthly, faq]

  security:
    protocols:
      value: [openvpn, other]
      note: Other is Cisco IPsec, which is off until you turn it on.
      sources: [servers, protocols, ipsec]
    post_quantum:
      value: none
      sources: [protocols, servers]
    kill_switch:
      value: app
      note: On by default in the Windows and Mac client, as IP and DNS leak protection.
      sources: [kill-switch]
    dns:
      value: null
      note: It doesn't say whose DNS servers the VPN uses, and its DNS article recommends Google's or OpenDNS.
      sources: [dns-servers]

  infra:
    ram_only:
      value: null
      note: It doesn't say whether its servers run from RAM.
      sources: [servers]
    hosting:
      value: rented
      note: It says its addresses change as hosting partners change, and its servers sit on hosting companies' networks such as HostPapa and Akamai Connected Cloud.
      sources: [static-ips, ip-lax1, ip-fra1]
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
      sources: [servers]
    servers:
      value: 129
      note: Its list has 129 server addresses, though the same page claims "hundreds of VPN servers".
      sources: [servers]
    countries:
      value: 42
      note: The same page's headline claims 52 countries.
      sources: [servers]

  features:
    connections:
      value: 5
      sources: [pricing, faq]
    multihop:
      value: true
      evidence: claimed
      sources: [home]
    obfuscation:
      value: []
      sources: [servers, protocols]
    port_forwarding:
      value: true
      sources: [pricing, port-forwarding]
    split_tunnel:
      value: null
      note: It doesn't say whether its client can leave some apps outside the VPN.
      sources: [getting-started]
    blocking:
      value: []
      sources: [home]

  clients:
    platforms:
      value: [windows, macos]
      note: Its own client is for Windows and Mac only. iOS, Android, Linux and routers use manual OpenVPN or IPsec setups.
      sources: [getting-started, recommended-clients, android-openvpn, ubuntu, dd-wrt]
    open_source:
      value: none
      sources: [getting-started]
    telemetry:
      value: null
      note: It doesn't say what its Windows and Mac client sends.
      sources: [policy]
    trackers:
      value: null
      grade: na
      note: There's no Android app. Android uses manual OpenVPN or IPsec setups.
      sources: [faq, android-openvpn]
    fdroid:
      value: false
      sources: [faq]

  pricing:
    monthly:
      value: { amount: 6.95, currency: USD }
      sources: [pricing, checkout-monthly]
    best:
      value: { amount: 1.67, currency: USD }
      note: $20 a year, labelled a holiday special but on sale since at least December 2024.
      sources: [pricing, checkout-yearly, pricing-2024]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 0
      sources: [checkout-yearly, checkout-monthly]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 30
      note: For your first payment only, and once per customer.
      sources: [terms, pricing]

  ethics:
    misleading_claims:
      value: true
      note: It promises "the strongest protection possible" and "an anonymous IP address", and says a VPN makes it "impossible for third-parties to see what you are doing online".
      sources: [home, faq]
    affiliates:
      value: null
      note: The affiliate programme it ran until at least 2022 is no longer linked, but it still invites resellers and partners without saying what they're paid.
      sources: [pricing-2022, resellers]
    review_sites: false
    activism: false

  other:
    concerns:
      value:
        - summary: Every IPsec user gets the same shared secret, printed in its setup guide, so anyone on the same network can pose as its servers.
          severity: minor
          source: ipsec

