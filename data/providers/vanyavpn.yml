# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: VanyaVPN
icon: vanyavpn.png
checked: 2026-11-05

criteria:
  identity:
    website:
      value: https://vanyavpn.com
      note: Sold in Russian as Дядя Ваня VPN.
      sources: [home]
    legal_entity:
      value: CODE ASSET LTD
      note: >-
        A London company formed in June 2025. The iPhone app is sold by KONDAKOV&GORIN LLC, Bebra VPN's company, the Mac
        app by KONDAKOV OOO, and the Google Play developer is Vladimir Kondakov in Russia.
      sources: [offer, app-policy, register, app-store, mac-app-store, play]
    owner:
      value: null
      note: >-
        KONDAKOV&GORIN LLC lists VanyaVPN as its product and names Vladimir Kondakov as a co-founder, without saying who
        owns it. CODE ASSET LTD's majority shareholder is Oleg Solovyov.
      sources: [company, register-psc]
    founded:
      value: 2022
      sources: [about]
    team:
      value: partial
      note: Its site says it doesn't publish staff names, but KONDAKOV&GORIN LLC names Vladimir Kondakov as co-founder and head of security.
      sources: [about, company]
    sister_brands:
      value: [Bebra VPN, Ben's VPN]
      note: KONDAKOV&GORIN LLC lists all three as its products, and Ben's VPN's site also names CODE ASSET LTD.
      sources: [company, bensvpn]
    acquisitions: []

  jurisdiction:
    hq:
      value: GB
      sources: [offer, register]
    entities:
      value: [GB, US]
      note: CODE ASSET LTD in London, and KONDAKOV&GORIN LLC in Arizona for the iPhone app. The Mac app's seller, KONDAKOV OOO, gives no country.
      sources: [register, app-store, mac-app-store]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [app-policy, about]
    dns:
      value: none
      evidence: claimed
      note: The policy says neither its app analytics nor its per-account traffic counters include DNS queries.
      sources: [app-policy, policy]
    timestamps:
      value: null
      note: >-
        The policy says its anonymous analytics leave out connection times, but also that it processes per-account
        connection-activity counters and when they were updated, without saying how long it keeps them.
      sources: [app-policy, policy]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: It keeps a running data total per account, used to turn down refunds past 1 GB in 30 days.
      sources: [policy, refunds]
    source_ip:
      value: null
      note: The app says the servers see your IP address, and the policy doesn't say whether it's kept.
      sources: [app-policy, play]
    proven: []
    policy: https://vanyavpn.com/app-privacy-policy

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty:
      value: false
      note: KONDAKOV&GORIN LLC takes vulnerability reports by email but doesn't offer rewards.
      sources: [company]
    incidents: []

  account:
    email:
      value: optional
      note: The apps make a guest account tied to the device, and an email is only needed to sign in elsewhere or pay on the website.
      sources: [play, offer]
    personal_data: []
    payment:
      value: [card, bank, app_store, other_crypto]
      note: Cards through Stripe or Russian cards, bank is Russia's SBP, and crypto goes through Cryptomus without naming coins.
      sources: [buy, help, app-terms]

  security:
    protocols:
      value: [openvpn, other]
      note: >-
        The apps use VLESS with REALITY, XHTTP, Hysteria2 and Shadowsocks, picked for you. OpenVPN and PPTP are only for
        routers set up by hand.
      sources: [home, router]
    post_quantum:
      value: none
      note: Nothing is published about its key exchange.
    kill_switch:
      value: null
      note: Nothing says its apps have one.
      sources: [app]
    dns:
      value: third_party
      note: The Android app resolves through Cloudflare, Quad9 and OpenDNS inside the tunnel.
      sources: [play]

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: null
      note: It doesn't say who runs its servers.
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual, though its list includes Vatican City, Somalia and Yemen.
      sources: [locations]
    servers:
      value: null
      note: It gives a count of countries, and says it puts no more than 10 customers on a server.
      sources: [home]
    countries:
      value: 187
      sources: [locations]

  features:
    connections:
      value: unlimited
      sources: [home, play]
    multihop:
      value: true
      note: It turns on by itself when a location is blocked, or can be forced through a Russian server for whitelisted mobile networks.
      sources: [help, white-list]
    obfuscation:
      value: [v2ray, quic, shadowsocks]
      note: REALITY and XHTTP are from the Xray family, and Hysteria2 runs over QUIC.
      sources: [home]
    port_forwarding: false
    split_tunnel:
      value: true
      note: By site, IP address or app, plus a mode that sends Russian sites around the VPN.
      sources: [play, company]
    blocking: []

  clients:
    platforms:
      value: [windows, macos, linux_gui, ios, android, router]
      note: >-
        Also Android TV. In Russia the iPhone app installs through another region's App Store or TestFlight. The router
        app runs on Keenetic, OpenWrt and MikroTik, and other routers use OpenVPN or PPTP.
      sources: [app, home, router]
    open_source:
      value: none
      note: The apps are built on Jigsaw's open source Outline client, but VanyaVPN's own code isn't published.
      sources: [help, play]
    telemetry:
      value: forced
      evidence: claimed
      note: >-
        The app says it sends device, network, connection and error reports to run the service, and the policy names
        Sentry and Firebase. Nothing offers a way to turn it off.
      sources: [app-policy, play]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 500, currency: RUB }
      note: £5 by foreign card from the UK.
      sources: [plans, home]
    best:
      value: { amount: 190, currency: RUB }
      note: 5,700 roubles for two years plus six free months.
      sources: [plans, home, home-2026-05]
    best_term:
      value: 30
      sources: [home-2026-05]
    renewal_increase:
      value: null
      note: It doesn't say whether the free months come with a renewal.
      sources: [offer]
    free_tier:
      value: false
      note: The trial is a day for 10 roubles by Russian card, or three days by foreign card, then the monthly plan.
      sources: [trial]
    refund_days:
      value: 14
      note: Only if the account used under 1 GB in the last 30 days, and never for crypto. App Store purchases go through Apple.
      sources: [refunds, app-terms]

  ethics:
    misleading_claims: false
    affiliates:
      value: true
      note: A payout for each first payment and every renewal.
      sources: [partners]
    review_sites: false
    activism: false

