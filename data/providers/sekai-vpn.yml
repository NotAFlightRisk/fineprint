# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Sekai VPN
icon: sekai-vpn.png
checked: 2026-10-25

criteria:
  identity:
    website:
      value: https://www.interlink.or.jp/service/sekaivpn/
      sources: [home]
    legal_entity:
      value: Interlink Co., Ltd. (株式会社インターリンク)
      note: A Tokyo ISP and domain registrar, corporate number 4013301014250.
      sources: [tokusho, member-terms, register]
    owner:
      value: null
      note: No parent company is named. Interlink lists three related companies of its own but no owner above it.
      sources: [company, privacy]
    founded:
      value: 2014
      note: Launched on 22 August 2014. Interlink itself has run as an ISP since 1995.
      sources: [news-2014, company]
    team:
      value: public
      note: The president, Tadashi Yokoyama, and the other three directors are named.
      sources: [company, tokusho]
    sister_brands:
      value: [My IP, Group VPN]
      note: Interlink's own fixed-IP VPN (マイIP) and private group VPN servers (グループ専用VPN).
      sources: [compare-faq, affiliate]
    acquisitions:
      value: []
      sources: [company]

  jurisdiction:
    hq:
      value: JP
      sources: [tokusho, register]
    entities:
      value: [JP]
      sources: [company, register]

  logging:
    traffic:
      value: null
      note: It doesn't say whether it logs what you do over the VPN.
      sources: [privacy, service-terms]
    dns:
      value: null
      sources: [privacy, service-terms]
    timestamps:
      value: null
      note: >-
        Interlink's security policy lists authentication logs among the customer data it holds, without saying
        what's in them or how long they're kept. The service terms also have it contact the user behind a complaint.
      sources: [security-policy, service-terms]
    bandwidth:
      value: null
      sources: [privacy, service-terms]
    source_ip:
      value: null
      note: The authentication logs in Interlink's security policy may include it, but the text doesn't say.
      sources: [security-policy, privacy]
    proven:
      value: []
      sources: [privacy]
    policy: https://www.interlink.or.jp/company/privacy.html

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty:
      value: false
      sources: [security-policy]
    incidents: []

  account:
    email:
      value: required
      sources: [signup-form, flow]
    personal_data:
      value: [name]
      note: >-
        Signup asks for your name as the account holder, separately from the card. Paying by NTT phone bill also
        needs an ID document, and direct debit a signed form by post.
      sources: [signup-form, flow, trial]
    payment:
      value: [card, bank, app_store]
      note: >-
        Bank is Japanese direct debit. It can also go on an NTT phone bill, and the iOS app sells a weekly plan through
        Apple.
      sources: [price, payment, app-store]

  security:
    protocols:
      value: [openvpn, ikev2, other]
      note: Other is PPTP, L2TP, OpenConnect and an iOS-only HTTPS proxy mode. There's no WireGuard.
      sources: [compare-faq, ios-https]
    post_quantum: none
    kill_switch:
      value: none
      sources: [windows-app, mac-app, ios-app]
    dns:
      value: null
      note: Which resolver the tunnel uses isn't stated. Its troubleshooting guides have users set Google Public DNS.
      sources: [dns-mac]

  infra:
    ram_only: null
    hosting: null
    virtual_locations: null
    servers: null
    countries:
      value: 10
      note: Japan, the US, Germany, Taiwan, South Korea, France, the UK, Thailand, Indonesia and Vietnam.
      sources: [home]

  features:
    connections:
      value: 3
      sources: [sessions, compare-faq]
    multihop:
      value: false
      sources: [home]
    obfuscation:
      value: []
      note: For censored networks it points users to OpenConnect on TCP 443, the iOS HTTPS mode or the browser extension.
      sources: [censorship]
    port_forwarding:
      value: false
      note: Shared IPs only, and outgoing mail and SMB ports are blocked.
      sources: [home]
    split_tunnel:
      value: false
      note: The Sekai Browser extension only tunnels Chrome or Edge, which is the nearest thing.
      sources: [windows-app, sekai-browser]
    blocking: []

  clients:
    platforms:
      value: [windows, macos, ios, browser]
      note: >-
        There's no phone app for Android or ChromeOS, which use the built-in VPN settings, but there are Android TV,
        Fire TV and Fire tablet apps.
      sources: [home, android-tv, sekai-browser]
    open_source:
      value: none
      sources: [windows-app, mac-app]
    telemetry:
      value: null
      note: The App Store listing declares no data collected, which doesn't say whether the desktop apps send any.
      sources: [app-store]
    fdroid:
      value: false
      sources: [android-tv]

  pricing:
    monthly:
      value: { amount: 1100, currency: JPY }
      sources: [price]
    best:
      value: { amount: 1100, currency: JPY }
      note: Monthly billing only. The iOS app's weekly plan is ¥500 with a three-day trial.
      sources: [price, annual-faq, app-store]
    best_term:
      value: 1
      sources: [annual-faq]
    renewal_increase:
      value: 0
      sources: [price]
    free_tier:
      value: false
      note: New accounts get a free trial to the end of the month after signup, so up to two months.
      sources: [trial, price]
    refund_days:
      value: null
      note: >-
        The member terms rule out refunds, but the trial page says card payers who cancel after the trial and say
        they're unhappy get that month's fee back.
      sources: [member-terms, trial]

  ethics:
    misleading_claims:
      value: false
      sources: [home, affiliate]
    affiliates:
      value: true
      note: Pays ¥1,100 per signup that stays four months, through A8.net and ValueCommerce.
      sources: [affiliate]
    review_sites: false
    activism: false

