  policy:
    url: https://argovpn.com/en/privacy
    title: ArgoVPN Privacy Policy and Terms of Use
  policy-data:
    url: https://argovpn.com/en/privacy#data-collection
    title: ArgoVPN Privacy Policy, Data Collection
  policy-terms:
    url: https://argovpn.com/en/privacy#terms
    title: ArgoVPN Terms of Use of the App
  policy-storage:
    url: https://argovpn.com/en/privacy#storage
    title: ArgoVPN Privacy Policy, Location of Collected Information
  policy-security:
    url: https://argovpn.com/en/privacy#security
    title: ArgoVPN Privacy Policy, Information and App Security
  home-features:
