  exodus-signatures:
    url: https://web.archive.org/web/20261017091629/https://reports.exodus-privacy.eu.org/api/trackers
    title: Exodus Privacy tracker signatures (archived 2026-10-17)
  register:
    url: https://data.gov.il/api/3/action/datastore_search?resource_id=f004176c-b85f-4542-8901-7b3176f9a054&q=514602143
    title: Foxy Media Ltd (514602143) in Israel's company register, on data.gov.il
  foxymedia:
    url: https://www.foxymedia.co.il/
    title: Foxymedia, content formats and media production
