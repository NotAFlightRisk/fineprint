# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Goose VPN
icon: goose-vpn.png
checked: 2026-10-25

criteria:
  identity:
    website:
      value: https://goosevpn.com
      sources: [home]
    legal_entity:
      value: Goose B.V.
      note: The terms still give an old Rotterdam address, while the register and the rest of the site have it in Rijswijk. The iOS app is sold by Robru B.V.
      sources: [terms, kvk, play]
    owner:
      value: Gizmo Cyber Group
      sources: [gizmo]
    founded:
      value: 2016
      sources: [story]
    team:
      value: public
      note: The two co-founders, CEO Joeri van de Watering and COO Anouk ter Harmsel, are named.
      sources: [gizmo, story]
    sister_brands:
      value: [Guardey]
      note: Guardey is the group's business VPN and security training brand.
      sources: [gizmo, guardey]
    acquisitions:
      value: []
      sources: [kvk]

  jurisdiction:
    hq:
      value: NL
      sources: [terms, kvk]
    entities:
      value: [NL]
      sources: [terms, kvk]

  logging:
    traffic:
      value: none
      evidence: claimed
      note: Goose says it can start logging a specific user if a government agency suspects them of crimes such as terrorism. The paid Cyber Alarm add-on keeps traffic metadata for a year.
      sources: [privacy, no-log-faq]
    dns:
      value: none
      evidence: claimed
      sources: [privacy]
    timestamps:
      value: none
      evidence: claimed
      sources: [privacy]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: It records how much data each account uses, which its fair use policy relies on.
      sources: [privacy, terms]
    source_ip:
      value: none
      evidence: claimed
      note: The IP address used to sign up is recorded once, and the last one used to log in to the website is kept.
      sources: [privacy, logs-faq]
    proven: []
    policy: https://goosevpn.com/privacy-policy

  transparency:
    audits: []
    report:
      value: none
      note: Goose says it cooperates fully with agencies that bring a court order, but publishes no figures.
      sources: [data-sharing-faq]
    canary: none
    bug_bounty: false
    incidents:
      value: []

  account:
    email:
      value: required
      note: The email address is the account's username.
      sources: [signup, personal-data-faq]
    personal_data:
      value: []
      sources: [signup, personal-data-faq]
    payment:
      value: [card, paypal, bank, app_store]
      note: Bank is iDEAL, for the Netherlands. App store covers subscriptions through Apple and Google Play.
      sources: [payment-faq, signup, refund]

  security:
    protocols:
      value: [openvpn, ikev2, other]
      note: Other is L2TP/IPsec and PPTP. IKEv2 is the default in the apps.
      sources: [protocols-faq]
    post_quantum:
      value: none
      sources: [protocols-faq]
    kill_switch:
      value: app
      note: It only works in Autopilot mode, not when connecting manually. IPv6 isn't supported, and Goose advises turning it off so it doesn't bypass the tunnel.
      sources: [autopilot, kill-switch-faq, ipv6-faq]
    dns:
      value: null
      note: Goose doesn't say whose DNS servers answer lookups inside the tunnel.

  infra:
    ram_only:
      value: null
      note: Goose says its servers hold no user data, but not whether they run from RAM.
      sources: [privacy]
    hosting:
      value: rented
      note: The privacy policy calls the network Goose's own property, but its servers' addresses belong to hosting firms such as M247 and UK Dedicated Servers.
      sources: [privacy, server-list, ip-nl-24, ip-uk-12]
    virtual_locations:
      value: null
      note: Goose doesn't say whether any of its locations are virtual.
      sources: [server-list]
    servers:
      value: 33
      note: Other pages still claim over 100.
      sources: [server-list, story]
    countries:
      value: 22
      note: Brazil is also on the list, with no server. The homepage claims 30 countries.
      sources: [server-list, home]

  features:
    connections:
      value: unlimited
      note: Subject to a fair use policy. Lifetime plans are capped at 1, 5 or 10 devices.
      sources: [devices-faq, multi-device-faq, terms]
    multihop: false
    obfuscation:
      value: []
      sources: [protocols-faq]
    port_forwarding: false
    split_tunnel: false
    blocking:
      value: []
      note: The paid Cyber Alarm add-on scans traffic for malware, ransomware and viruses and sends alerts.
      sources: [cyber-alarm]

  clients:
    platforms:
      value: [windows, macos, ios, android]
      note: Android TV uses the Android app. Linux and routers take manual OpenVPN, IKEv2 or L2TP setups. Neither mobile app has been updated since 2023.
      sources: [home, linux, linux-ikev2, play, app-store]
    open_source: none
    telemetry:
      value: null
      note: The App Store listing declares usage and crash data for analytics, with no word on turning it off.
      sources: [play-data-safety, app-store]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 9.99, currency: EUR }
      sources: [pricing]
    best:
      value: { amount: 4.99, currency: EUR }
      note: €59.88 a year. A lifetime plan costs €159 once, or €129 and €89 with a five or one device cap.
      sources: [pricing, home]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 0
      sources: [pricing, multi-device-faq]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 30
      note: Only on new accounts that have used less than 100 MB, and not on renewals.
      sources: [refund, money-back-faq]

  ethics:
    misleading_claims:
      value: true
      note: Claims military-grade encryption, "100% anonymous" browsing and to be the only VPN based in the EU.
      sources: [home, play, story]
    affiliates:
      value: true
      evidence: claimed
      note: Its privacy policy lists referral tracking cookies from Post Affiliate Pro, an affiliate platform.
      sources: [privacy]
    review_sites: false
    activism: false

