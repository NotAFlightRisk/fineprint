  play-2025:
    url: https://web.archive.org/web/20250519223124/https://play.google.com/store/apps/details?id=com.best.free.vpn.proxy
    title: Ostrich VPN on Google Play, developer Geware Mobile Limited (archived May 2025)
  app-store:
