  app-store-2021:
    url: https://web.archive.org/web/20210223212433/https://apps.apple.com/us/app/vpn/id1456731716
    title: The App Store listing in February 2021 (Wayback Machine)
  lookup:
    url: https://itunes.apple.com/lookup?id=1456731716
    title: App Store lookup for VPN - Proxy Master (seller, release date, version)
  developer-apps:
