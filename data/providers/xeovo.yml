# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Xeovo
icon: xeovo.png
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://xeovo.com
      sources: [home]
    legal_entity:
      value: Xeovo Oy
      note: Registered in Helsinki in September 2021, five years after the VPN launched. Xeovo doesn't say who ran it before then.
      sources: [tos, privacy-controller, register]
    owner:
      value: null
      note: Xeovo says it's bootstrapped with no outside shareholders, but doesn't say who owns Xeovo Oy.
      sources: [about, register]
    founded:
      value: 2016
      sources: [about]
    team:
      value: partial
      note: Its site names nobody and staff post as "Team", but Finland's trade register names its managing director.
      sources: [about, helsinki, trade-register]
    sister_brands:
      value: []
      sources: [about]
    acquisitions:
      value: []
      sources: [about]

  jurisdiction:
    hq:
      value: FI
      sources: [tos, register]
    entities:
      value: [FI]
      sources: [privacy-controller, register]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy-logs, tos]
    dns:
      value: none
      evidence: claimed
      sources: [privacy-logs]
    timestamps:
      value: none
      evidence: claimed
      sources: [privacy-logs]
    bandwidth:
      value: none
      evidence: claimed
      sources: [privacy-logs]
    source_ip:
      value: none
      evidence: claimed
      sources: [privacy-logs]
    proven:
      value: []
      sources: [transparency-2025]
    policy:
      value: https://xeovo.com/privacy/
      sources: [privacy]

  transparency:
    audits:
      value: []
    report:
      value: regular
      note: >-
        A yearly report since 2019. The first police request came in 2024 and got no data, and 2025 had
        none.
      sources: [transparency-2025, transparency-2024]
    canary:
      value: none
    bug_bounty:
      value: true
      note: Pays up to 4,000 EUR in Monero for bugs in its website, account system and VPN gateways.
      sources: [bug-bounty]
    incidents:
      value: []
      sources: [updates]

  account:
    email:
      value: optional
      note: Signup takes a username and password, and can generate a random username.
      sources: [signup, privacy-data, xeovo-2]
    personal_data:
      value: []
      sources: [privacy-data, signup]
    payment:
      value: [card, paypal, bitcoin, monero, other_crypto, cash]
      note: >-
        Other crypto is Litecoin. Apple Pay, Google Pay and MobilePay are offered too. Cash is listed, but
        Xeovo doesn't say how to send it.
      sources: [pricing, faq]

  security:
    protocols:
      value: [wireguard, openvpn]
      sources: [features, faq]
    post_quantum:
      value: none
      sources: [features]
    kill_switch:
      value: null
      grade: na
      note: There are no Xeovo apps, so it's down to the client you use. Xeovo points to WireGuard's own blocking of traffic outside the tunnel.
      sources: [faq, guides]
    dns:
      value: first_party
      evidence: claimed
      note: Configs use a resolver inside the tunnel by default. You can pick an ad-blocking one or set your own.
      sources: [xeovo-2, adblock-dns, stealth-dns]

  infra:
    ram_only:
      value: null
      note: Xeovo doesn't say.
    hosting:
      value: rented
      evidence: claimed
      note: Staff say servers come from hosting suppliers, and that some hosts are no use as they're widely blocked.
      sources: [helsinki, qa-2022]
    virtual_locations:
      value: null
      note: Xeovo doesn't say whether every location is physically where it's listed.
      sources: [status]
    servers:
      value: 28
      note: VPN servers on 2026-10-27, across 26 cities. The stealth proxies run on their own servers.
      sources: [status]
    countries:
      value: 23
      note: For the VPN. The stealth proxies add Bulgaria, Lithuania and South Korea.
      sources: [status]

  features:
    connections:
      value: 5
      sources: [pricing, features]
    multihop:
      value: false
      note: Staff said in July 2026 that it's planned, with no date.
      sources: [multihop]
    obfuscation:
      value: [shadowsocks, v2ray, amneziawg, quic]
      note: >-
        Shadowsocks, VLESS, VMess, Trojan and QUIC-based Hysteria 2 are stealth proxies that come with every
        account and are used instead of the VPN. AmneziaWG disguises WireGuard itself.
      sources: [features, pricing, faq, hysteria]
    port_forwarding:
      value: false
      sources: [faq]
    split_tunnel:
      value: null
      grade: na
      note: There are no Xeovo apps, so it's down to the client you use.
      sources: [faq]
    blocking:
      value: [ads, trackers]
      note: Off by default. You pick it when generating WireGuard, AmneziaWG or OpenVPN configs.
      sources: [xeovo-2]

  clients:
    platforms:
      value: []
      note: >-
        There are no apps. You generate configs for the standard WireGuard, OpenVPN or AmneziaWG apps, or
        subscriptions for third-party proxy clients, with guides for Windows, macOS, Linux, iOS, Android and routers.
      sources: [guides, android-guide]
    open_source:
      value: null
      grade: na
      note: There are no Xeovo apps to publish.
      sources: [guides]
    telemetry:
      value: none
      note: There are no Xeovo apps.
      sources: [guides]
    trackers:
      value: null
      grade: na
      note: There's no Android app.
      sources: [android-guide]
    fdroid:
      value: false
      sources: [fdroid-search]

  pricing:
    monthly:
      value: { amount: 4.99, currency: EUR }
      sources: [pricing]
    best:
      value: { amount: 2.99, currency: EUR }
      note: 35.88 EUR a year.
      sources: [pricing]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 0
      sources: [pricing]
    free_tier:
      value: false
      note: There's no free trial either.
      sources: [faq]
    refund_days:
      value: 30
      note: Once per customer, and not on crypto payments.
      sources: [refund, tos]

  ethics:
    misleading_claims:
      value: true
      note: >-
        The About page says Xeovo keeps no data that can be taken by court orders, while its privacy policy
        says it could hand over account details and payment method.
      sources: [about, privacy-court]
    affiliates:
      value: false
      note: It has a referral scheme that gives both sides a free month instead.
      sources: [about, referrals]
    review_sites:
      value: false
      sources: [about]
    activism:
      value: true
      note: Gave 10,000 USD to the Tor x Funding the Commons pool in 2026 and campaigns against the EU's Chat Control law.
      sources: [tor-donation, chat-control]

