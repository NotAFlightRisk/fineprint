# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Secure VPN (Secure Signal)
icon: secure-signal-vpn.png
checked: 2026-11-03

criteria:
  identity:
    website:
      value: https://www.securesignal.app
      note: The app is called Secure VPN－Safer Internet on Google Play. It isn't the Secure VPN from securevpn.com.
      sources: [home, play]
    legal_entity:
      value: Secure Signal Inc
      note: The same company is the Google Play developer, at a Delaware address.
      sources: [terms, play]
    owner:
      value: null
      note: It doesn't say who owns Secure Signal Inc. 2025 research found no links between its Android app and other VPN families.
      sources: [hidden-links-2025]
    founded:
      value: null
      note: The Android app already had over a million installs on Google Play by July 2018.
      sources: [play-2018]
    team:
      value: anonymous
      note: The privacy policy gives a data protection officer's email address, but no name.
      sources: [privacy]
    sister_brands:
      value: [Thunder VPN]
      note: >-
        Thunder VPN shares its Google Play developer account. TTP tied an iOS Thunder VPN, from Free Secure
        Connected Software Co., Ltd, to Qihoo 360's Turbo VPN group, but it isn't clear that's the same app, and
        2025 research found no links between Secure VPN and that group.
      sources: [play-dev, thunder-play, ttp-2025, thunder-ios-2023, hidden-links-2025]
    acquisitions:
      value: null
      note: >-
        Google Play named the developer Signal Lab, with an address in Alhambra, California, until 2024, when the
        same account became Secure Signal Inc in Delaware. Whether that was a sale isn't public.
      sources: [play-2018, play-2024-01, play-2024-05]

  jurisdiction:
    hq:
      value: US
      evidence: claimed
      sources: [play]
    entities:
      value: [US]
      sources: [play]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy]
    dns:
      value: none
      evidence: claimed
      sources: [privacy]
    timestamps:
      value: aggregate
      evidence: claimed
      note: >-
        It says it keeps no connection timestamps, but counts connection attempts and successful connections by
        the hour, along with your country and app version.
      sources: [privacy]
    bandwidth:
      value: null
      note: It doesn't say whether it records how much data you use.
      sources: [privacy]
    source_ip:
      value: none
      evidence: claimed
      note: It records the country you connect from, but not your IP address, it says.
      sources: [privacy]
    proven: []
    policy: https://www.securesignal.app/privacy-policy.html

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: none
      note: There are no accounts.
      sources: [home]
    personal_data: []
    payment:
      value: [app_store]
      note: VIP plans are Google Play subscriptions in the Android app.
      sources: [play, apk]

  security:
    protocols:
      value: [proprietary]
      note: Its own tunnel protocol, using AES-GCM and ChaCha20, inside an obfuscated native library.
      sources: [apk, hidden-links-2025]
    post_quantum:
      value: none
      note: Nothing is published about how its connections are encrypted.
    kill_switch:
      value: null
      note: The Android app has no kill switch setting.
      sources: [apk]
    dns:
      value: null
      note: It doesn't say whose DNS servers answer inside the tunnel.

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: null
      note: It doesn't say whether it owns or rents its servers.
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
    servers:
      value: null
      note: It only says it has a "large number of servers" in America, Europe and Asia.
      sources: [play]
    countries:
      value: null
      note: It doesn't give a count.

  features:
    connections:
      value: unlimited
      evidence: claimed
      note: There are no accounts, and the terms refer to its unlimited simultaneous devices.
      sources: [terms]
    multihop: false
    obfuscation:
      value: [proprietary]
      note: The app's own protocol has an obfuscation layer, and it's sold for getting past censorship.
      sources: [apk, home]
    port_forwarding: false
    split_tunnel:
      value: true
      note: By app, on Android.
      sources: [play, apk]
    blocking: []

  clients:
    platforms:
      value: [android]
      note: The website has an App Store button that doesn't lead to an app.
      sources: [home]
    open_source:
      value: none
      note: The terms forbid reverse engineering the apps.
      sources: [terms]
    telemetry:
      value: null
      note: >-
        The app carries Firebase Analytics and Google's ad SDK, and the policy collects device details, your
        advertising ID and usage events, without mentioning a way to opt out.
      sources: [privacy, apk, play-data-safety]
    fdroid: false

  pricing:
    monthly:
      value: null
      note: VIP plans are only sold inside the Android app, and no prices are published.
      sources: [apk]
    best:
      value: null
      note: No prices are published.
    best_term:
      value: null
      note: No prices are published.
    renewal_increase:
      value: null
      note: No prices are published.
    free_tier:
      value: true
      note: Ad-supported, with no data or time limit. Paying unlocks the remaining servers and more bandwidth.
      sources: [home, play]
    refund_days:
      value: null
      note: Subscriptions go through Google Play, so refunds follow Google's rules.
      sources: [play]

  ethics:
    misleading_claims:
      value: true
      note: >-
        The website says its apps "do not collect or log user information", while its policy collects your
        advertising ID and device details. The Play listing calls it "the world's fastest secure virtual private
        network".
      sources: [home, privacy, play]
    affiliates: false
    review_sites: false
    activism: false

