# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: ExpressVPN
icon: expressvpn.png
checked: 2026-10-20

criteria:
  identity:
    website: https://www.expressvpn.com
    legal_entity:
      value: Express Technologies Ltd.
      sources: [tos]
    owner:
      value: Kape Technologies
      note: >-
        Kape is controlled by Teddy Sagi through Unikmind Holdings, which held 98.5% when it took Kape
        private in 2023.
      sources: [kape-holding-2023, kape-about]
    founded:
      value: 2009
      sources: [about, kape-acquisition]
    team:
      value: partial
      note: >-
        There's no leadership page, but press releases name the chief executive, Charles Butler, who
        also runs Kape.
      sources: [ceo-pr, kape-leadership]
    sister_brands:
      value: [CyberGhost, Private Internet Access, EventVPN]
      note: >-
        EventVPN is a free app built by ExpressVPN's team. ZenMate's users were moved to CyberGhost in
        2023.
      sources: [kape-brands, eventvpn-launch, zenmate]
    acquisitions:
      value:
        - date: 2021-12-15
          acquirer: Kape Technologies
          source: kape-results-2021
      note: Announced in September 2021 for about $936 million.
      sources: [kape-acquisition, expressvpn-joins-kape]

  jurisdiction:
    hq:
      value: VG
      sources: [privacy-policy, tos]
    entities:
      value: [VG]
      note: >-
        Express Technologies Ltd. is the only ExpressVPN company named. Its parent, Kape, is
        incorporated in the Isle of Man with a branch in London.
      sources: [tos, companies-house]

  logging:
    traffic:
      value: none
      evidence: verified
      sources: [no-logs, audit-kpmg-2025, audit-cure53-trustedserver]
    dns:
      value: none
      evidence: verified
      sources: [no-logs, audit-kpmg-2025]
    timestamps:
      value: aggregate
      evidence: claimed
      note: Keeps the day each user connected, though not the time, along with the location they picked.
      sources: [privacy-policy, no-logs]
    bandwidth:
      value: aggregate
      evidence: claimed
      note: Keeps a total of the data each user transfers, which the policy's example gives per day.
      sources: [privacy-policy, no-logs]
    source_ip:
      value: none
      evidence: verified
      note: >-
        It does keep the country and ISP you connect from, by day. The separate MediaStreamer DNS
        service stores the IPs you register for it.
      sources: [privacy-policy, audit-kpmg-2025]
    proven:
      value: [seizure, audit]
      evidence: verified
      note: >-
        Turkish investigators traced deletions in the 2016 Karlov assassination case to an ExpressVPN
        IP and found it kept no logs, and ExpressVPN says they seized the server too. KPMG last checked
        the servers against the privacy policy in 2025.
      sources: [karlov-istiklal, karlov-torrentfreak, audit-kpmg-2025, audit-cure53-trustedserver]
    policy: https://www.expressvpn.com/privacy-policy

  transparency:
    audits:
      value:
        - date: 2025-02-28
          auditor: KPMG
          scope: no_logs
          source: audit-kpmg-2025
        - date: 2024-11-22
          auditor: Cure53
          scope: apps
          source: audit-cure53-aircove-2024
        - date: 2024-11-01
          auditor: Cure53
          scope: apps
          source: audit-cure53-lightway-2024
        - date: 2024-10-10
          auditor: Praetorian
          scope: apps
          source: audit-praetorian-2024
        - date: 2024-06-14
          auditor: Cure53
          scope: apps
          source: audit-cure53-extension-2024
        - date: 2024-04-01
          auditor: Nettitude
          scope: apps
          source: audit-nettitude-2024
        - date: 2023-12-12
          auditor: KPMG
          scope: no_logs
          source: audit-kpmg-2023
        - date: 2022-11-11
          auditor: Cure53
          scope: apps
          source: audit-cure53-lightway-2022
        - date: 2022-10-07
          auditor: Cure53
          scope: apps
          source: audit-cure53-extension-2022
        - date: 2022-09-09
          auditor: Cure53
          scope: apps
          source: audit-cure53-ios-2022
        - date: 2022-09-01
          auditor: KPMG
          scope: no_logs
          source: audit-kpmg-2022
        - date: 2022-08-12
          auditor: Cure53
          scope: apps
          source: audit-cure53-android-2022
        - date: 2022-08-05
          auditor: Cure53
          scope: apps
          source: audit-cure53-linux-2022
        - date: 2022-07-08
          auditor: Cure53
          scope: apps
          source: audit-cure53-macos-2022
        - date: 2022-07-08
          auditor: Cure53
          scope: apps
          source: audit-cure53-aircove-2022
        - date: 2022-04-29
          auditor: Cure53
          scope: infra
          source: audit-cure53-trustedserver
        - date: 2022-03-01
          auditor: F-Secure
          scope: apps
          source: audit-fsecure-2022
        - date: 2021-12-28
          auditor: F-Secure
          scope: apps
          source: audit-fsecure-2021
        - date: 2021-03-26
          auditor: Cure53
          scope: apps
          source: audit-cure53-lightway-2021
        - date: 2019-06-01
          auditor: PwC Switzerland
          scope: no_logs
          source: audit-pwc-2019
        - date: 2018-10-01
          auditor: Cure53
          scope: apps
          source: audit-cure53-extension-2018
      evidence: verified
      note: >-
        Dates are the last day of testing, or the 1st where only the month is known. The servers were
        last pentested in April 2022, KPMG's no-logs reports each check controls at a single date, and
        audits of its non-VPN products and EventVPN are left out.
      sources: [transparency]
    report:
      value: regular
      note: Twice a year.
      sources: [transparency, transparency-2026]
    canary:
      value: none
      note: >-
        Its reports listed gag orders and National Security Letters separately, at zero, until 2024.
        Since 2025 they're folded into government requests.
      sources: [transparency]
    bug_bounty:
      value: true
      note: Run through YesWeHack, with a one-off $100,000 award for breaking TrustedServer.
      sources: [bug-bounty]
    incidents:
      value:
        - date: 2025-04-25
          summary: >-
            A researcher found the Windows app sent anything on TCP port 3389, mostly Remote Desktop,
            outside the tunnel, which could expose a user's real IP. Debug code had shipped in versions
            12.97 to 12.101.0.2-beta, and ExpressVPN fixed it and disclosed it in July 2025.
          handled: well
          source: rdp-leak
        - date: 2024-02-08
          summary: >-
            A CNET reviewer found the Windows app could send DNS requests outside the tunnel with split
            tunnelling on. ExpressVPN switched split tunnelling off, fixed the bug and had Nettitude
            check the fix.
          handled: well
          source: dns-leak
        - date: 2021-09-14
          summary: >-
            Its CIO, Daniel Gericke, was one of three former US intelligence and military staff who
            agreed a US deferred prosecution over hacking work for the UAE before he joined in 2019.
            ExpressVPN said it knew his background but not the investigation, kept him on and promised
            yearly no-logs audits. He left in 2023.
          handled: well
          source: doj-gericke
        - date: 2017-01-01
          summary: >-
            Turkish investigators traced deletions from the Karlov assassin's accounts to an ExpressVPN
            IP and got nothing, as it keeps no connection logs. ExpressVPN says they seized and
            inspected the server, and that it has a few seizures a year it doesn't announce.
          handled: well
          source: karlov-torrentfreak
      sources: [gericke-response, gericke-left, karlov-istiklal, audit-nettitude-2024]

  account:
    email:
      value: required
      sources: [payments]
    personal_data:
      value: []
      note: Card and other payments may add a name and billing address, depending on the method.
      sources: [privacy-policy]
    payment:
      value: [card, paypal, app_store]
      note: >-
        Checkout offers cards, PayPal, Apple Pay and Google Pay. The privacy policy says gift cards and
        Bitcoin may be available, but the payments page lists neither and its Bitcoin pages are gone.
      sources: [payments, privacy-policy]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, proprietary]
      note: >-
        Lightway, ExpressVPN's own protocol, counts as proprietary and is the default. IKEv2 is only in
        some of the apps.
      sources: [lightway, wireguard, server-list]
    post_quantum:
      value: default
      note: For Lightway and WireGuard, not OpenVPN or IKEv2.
      sources: [lightway, wireguard, ml-kem]
    kill_switch:
      value: system
      note: >-
        On by default and firewall-based on desktop, with an option to block traffic while disconnected
        too.
      sources: [kill-switch]
    dns:
      value: first_party
      sources: [private-dns]

  infra:
    ram_only:
      value: all
      evidence: verified
      sources: [trustedserver, audit-cure53-trustedserver]
    hosting:
      value: null
      note: ExpressVPN doesn't say whether it owns or rents its servers.
      sources: [trustedserver]
    virtual_locations:
      value: disclosed
      note: Marked on the server list, and a help page says where each one really is.
      sources: [server-list, virtual-locations]
    servers:
      value: null
      note: ExpressVPN lists 214 locations in 113 countries, but no server count.
      sources: [server-list]
    countries:
      value: 113
      note: ExpressVPN's own list names 57 of them as virtual locations, served from another country.
      sources: [server-list, virtual-locations]

  features:
    connections:
      value: 10
      note: On Basic. Advanced allows 12 and Express Pro 14.
      sources: [pricing, tos]
    multihop:
      value: false
      sources: [features]
    obfuscation:
      value: [proprietary]
      note: Automatic on every server, disguising VPN traffic as HTTPS.
      sources: [android]
    port_forwarding:
      value: false
      note: Only on routers, where forwarded ports bypass the VPN.
      sources: [port-fail]
    split_tunnel:
      value: true
      note: On Windows, macOS, Linux, Android and iOS.
      sources: [split-tunnel]
    blocking:
      value: [ads, trackers, malware]
      note: Tracker blocking needs the Advanced tier or above.
      sources: [threat-manager, ad-blocker, pricing]

  clients:
    platforms:
      value: [windows, macos, linux_gui, linux_cli, ios, android, router, browser]
      note: >-
        Routers means its own Aircove and Fortify, as the app for other routers reached end of service
        in December 2025. The browser extensions work alone as a proxy.
      sources: [download, linux-notes, aircove, router-notes, chrome]
    open_source:
      value: some
      note: >-
        Only the Lightway protocol and the browser extension, last published at version 6.0.1 in March
        2024. The desktop and mobile apps are closed.
      sources: [github, extension-source]
    telemetry:
      value: forced
      note: >-
        Crash reports and diagnostics are opt-in, but the daily usage stats in the privacy policy can't
        be turned off. It may also use your advertising ID for remarketing, with consent where the law
        asks for it.
      sources: [privacy-policy, analytics]
    trackers:
      value: 4
      note: AppsFlyer, Mixpanel, Google Firebase Analytics and Crashlytics, in version 12.51.0 from February 2026.
      sources: [exodus]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 14.99, currency: USD }
      note: Basic tier. Advanced is $16.99 and Express Pro $22.99.
      sources: [pricing]
    best:
      value: { amount: 2.99, currency: USD }
      note: Basic tier, an intro price for the first 28 months. It then renews at $8.33 a month.
      sources: [pricing]
    best_term:
      value: 28
      note: A 2-year plan with 4 months added.
      sources: [pricing]
    renewal_increase:
      value: 179
      note: The Basic 2-year plan is $83.72 for the first 28 months, then $99.95 a year.
      sources: [pricing]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 30
      note: First-time customers buying on the website only. App store purchases go through Apple or Google.
      sources: [tos]

  ethics:
    misleading_claims:
      value: true
      note: >-
        Its no-logs page says it keeps no connection logs, defined there as including connection dates
        and data used, both of which its privacy policy says it records. The homepage's "#1 Best VPN
        2026" has a footnote saying it pays review sites for referrals.
      sources: [no-logs, privacy-policy, home]
    affiliates:
      value: true
      note: Its homepage says it pays review sites for referrals.
      sources: [affiliates, home]
    review_sites:
      value: true
      note: Its owner, Kape, also owns VPN review sites such as vpnMentor and Safety Detectives, which disclose it.
      sources: [kape-brands, vpnmentor, safety-detectives]
    activism:
      value: true
      note: >-
        Says it funds the EFF, Access Now, Fight for the Future, OpenMedia and the Internet Defense
        League.
      sources: [no-logs, about]

