# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: iProVPN
icon: iprovpn.png
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://iprovpn.com
      sources: [home]
    legal_entity:
      value: The Inner Technology LLC
      note: >-
        The terms and privacy policy name no company. The App Store seller is Reckonmedia LLC, and Reckon
        Media announced iProVPN's launch in 2021.
      sources: [play, app-store, launch]
    owner:
      value: null
      note: Nothing published says who owns The Inner Technology LLC or Reckonmedia LLC.
      sources: [play, app-store]
    founded:
      value: 2021
      note: Its first App Store release is from November 2020, and the service launched in January 2021.
      sources: [launch, app-store]
    team:
      value: anonymous
      note: Its site names nobody, and its 2021 launch announcement only quoted a marketing head.
      sources: [about, launch]
    sister_brands:
      value: [FastestVPN]
      note: >-
        Its Android app calls FastestVPN's API, its servers share small address blocks with FastestVPN's,
        and the two sites run the same pricing page code. Neither names an owner.
      sources: [apk, support-servers, fastestvpn-servers, dns-ipro-bel, dns-fastest-bel, dns-ipro-dk, dns-fastest-dk, home, fastestvpn-pricing]
    acquisitions:
      value: null
      note: Its ownership isn't published, so there's no way to tell whether it has changed hands.

  jurisdiction:
    hq:
      value: US
      note: >-
        Its privacy policy, last updated in 2020, puts it under British Virgin Islands law, but its About
        page now says Houston, Texas, and its Google Play developer is a Dallas company.
      sources: [about, play, privacy]
    entities:
      value: [US]
      note: >-
        The App Store credits iProVPN Limited and its launch announcement gave a British Virgin Islands
        address, but no company there is named.
      sources: [play, app-store, launch]

  logging:
    traffic:
      value: none
      evidence: claimed
      sources: [privacy, faq]
    dns:
      value: none
      evidence: claimed
      sources: [privacy]
    timestamps:
      value: none
      evidence: claimed
      sources: [privacy]
    bandwidth:
      value: null
      note: The privacy policy doesn't say whether data use is recorded.
      sources: [privacy]
    source_ip:
      value: none
      evidence: claimed
      sources: [privacy]
    proven: []
    policy: https://iprovpn.com/privacy-policy

  transparency:
    audits:
      value: []
      sources: [home]
    report:
      value: none
      sources: [support]
    canary:
      value: none
      sources: [support]
    bug_bounty:
      value: false
      sources: [support]
    incidents:
      value: []

  account:
    email:
      value: required
      sources: [privacy]
    personal_data:
      value: []
      sources: [pricing]
    payment:
      value: [card, paypal, app_store]
      sources: [pricing, faq, app-store, play]

  security:
    protocols:
      value: [wireguard, openvpn, ikev2, other]
      note: Other is PPTP, L2TP/IPsec and IPsec, for manual setup.
      sources: [play, tutorials, pptp-guide, l2tp-guide]
    post_quantum:
      value: none
      sources: [features]
    kill_switch:
      value: app
      sources: [features, android]
    dns:
      value: null
      note: It doesn't say whose DNS servers the VPN uses.
      sources: [support-servers]

  infra:
    ram_only:
      value: null
      note: It doesn't say whether its servers run from RAM.
      sources: [servers]
    hosting:
      value: rented
      note: Its server addresses belong to M247, in the same small blocks as FastestVPN's servers.
      sources: [support-servers, fastestvpn-servers, dns-ipro-bel, dns-fastest-bel, ip-bel]
    virtual_locations:
      value: null
      note: It doesn't say whether any of its locations are virtual.
      sources: [servers]
    servers:
      value: 250
      sources: [servers]
    countries:
      value: 34
      note: It advertises 36+ countries, and its Google Play listing says 47.
      sources: [servers, play]

  features:
    connections:
      value: 10
      note: Extra devices cost $4 each, or $10 for unlimited.
      sources: [home, faq]
    multihop:
      value: true
      evidence: claimed
      note: It lists Double VPN among its features but doesn't explain how it works.
      sources: [pricing]
    obfuscation:
      value: []
      sources: [features]
    port_forwarding:
      value: null
      note: It doesn't say whether port forwarding is offered.
      sources: [features]
    split_tunnel:
      value: true
      sources: [features, android]
    blocking:
      value: [ads, malware]
      sources: [features]

  clients:
    platforms:
      value: [windows, macos, ios, android, browser]
      note: Also Fire TV. Linux and routers are manual setup only.
      sources: [download, windows-app, mac-app, app-store, play, chrome, linux, routers]
    open_source:
      value: none
      sources: [download]
    telemetry:
      value: null
      note: >-
        The privacy policy says the apps send anonymised crash and connection-error reports, and the Android
        app bundles Firebase Crashlytics, but nothing says whether you can turn it off.
      sources: [privacy, apk]
    fdroid:
      value: false
      sources: [android]

  pricing:
    monthly:
      value: { amount: 6, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 0.66, currency: USD }
      note: $39.60 for five years, sold as four years plus one free.
      sources: [pricing]
    best_term:
      value: 60
      sources: [pricing]
    renewal_increase:
      value: null
      note: Renewal prices aren't published.
      sources: [pricing, terms]
    free_tier:
      value: false
      sources: [pricing]
    refund_days:
      value: 30
      note: Purchases made through third parties don't qualify for a full refund.
      sources: [terms, faq]

  ethics:
    misleading_claims:
      value: true
      note: It advertises "military-grade encryption" and calls itself "the top choice for millions of internet users".
      sources: [android, features]
    affiliates:
      value: true
      note: Affiliates get 100% of a new monthly subscription and 40% of renewals.
      sources: [affiliates]
    review_sites:
      value: null
      note: No sign it owns any, but who owns it isn't published.
    activism: false

