# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: VPN Generator
icon: vpn-generator.png
checked: 2026-10-27

criteria:
  identity:
    website:
      value: https://vpngen.org
      sources: [home]
    legal_entity:
      value: IEDN Privatinstitut zur Förderung und Entwicklung öffentlicher digitaler Netze gGmbH
      note: A Berlin non-profit research institute. The service is free and asks for donations.
      sources: [policy, imprint, register, home]
    owner:
      value: null
      note: The institute says a group of internet experts set it up in 2021, and names no parent company.
      sources: [register, iedn-institute]
    founded:
      value: 2022
      note: The institute was registered in November 2021 and VPN Generator launched in 2022.
      sources: [home, register]
    team:
      value: partial
      note: Mikhail Klimarev is the managing director and Mikhail Yakushev holds power of attorney.
      sources: [imprint, register]
    sister_brands: []
    acquisitions:
      value: []
      sources: [register]

  jurisdiction:
    hq:
      value: DE
      sources: [policy, imprint]
    entities:
      value: [DE]
      sources: [register]

  logging:
    traffic:
      value: 'yes'
      evidence: claimed
      note: >-
        Its published server setup logs the destination address and port of each connection, with the time,
        and ships it to log storage encrypted so at least two key holders are needed to read it. The policy lists
        destination IPs and sets no deletion date.
      sources: [policy, wg-template, ep-syslog, encrypted-logger, lea-commit]
    dns:
      value: null
      note: >-
        Each server's dnsmasq cache forwards lookups to Cloudflare, with no query logging switched on,
        but the policy doesn't rule it out.
      sources: [dnsmasq, policy]
    timestamps:
      value: 'yes'
      evidence: claimed
      note: >-
        The connection log is timestamped, a cron job logs users' real IPs every minute, and the
        brigadier's dashboard shows each user's last visit to the hour.
      sources: [wg-lea-rev, ep-syslog, last-visit]
    bandwidth:
      value: aggregate
      evidence: verified
      note: Daily, weekly, monthly and yearly byte totals per user were stored for each brigade.
      sources: [audit-2023]
    source_ip:
      value: 'yes'
      evidence: claimed
      note: >-
        Every minute each server logs every connected user's real IP address against their tunnel address,
        into the same encrypted log. The user stats also keep your /24 network for 12 hours.
      sources: [policy, wg-lea-rev, encrypted-logger, endpoint-prefix, stats-ttl]
    proven:
      value: [audit]
      note: >-
        The 2023 audit reviewed the server code and a staging setup, and found no traffic or real IPs logged,
        though that code already logged destinations.
      sources: [audit-2023, lea-commit]
    policy: https://vpngen.org/IEDN_Privacy_Policy.pdf

  transparency:
    audits:
      value:
        - date: 2023-07-28
          auditor: Include Security
          scope: infra
          source: audit-2023
      evidence: verified
      note: >-
        Commissioned through the Open Technology Fund's Security Lab. It found four low-risk issues,
        including storing Telegram chat IDs. A retest closed three and the fourth was accepted as a risk.
      sources: [otf-audit, audit-2023-retest]
    report: none
    canary: none
    bug_bounty: false
    incidents: []

  account:
    email:
      value: none
      note: Signing up goes through a Telegram bot, so it needs a Telegram account, which needs a phone number.
      sources: [bot, bot-texts]
    personal_data:
      value: []
      note: The bot asks for any picture to prove you're a person, and a team member approves it.
      sources: [bot-texts, audit-2023]
    payment:
      value: []
      note: It's free.
      sources: [iedn-project]

  security:
    protocols:
      value: [wireguard, openvpn, other]
      note: OpenVPN only runs over Cloak. Other covers AmneziaWG, Outline's Shadowsocks and VLESS Reality, as IPsec/L2TP was switched off in 2024.
      sources: [profile, protocols-code, ipsec-off]
    post_quantum: none
    kill_switch:
      value: null
      grade: na
      note: It has no apps of its own, so this is down to the client you use.
      sources: [bot-texts]
    dns:
      value: third_party
      note: Each server runs a dnsmasq cache that forwards lookups to Cloudflare's 1.1.1.1.
      sources: [dnsmasq, wg-template]

  infra:
    ram_only:
      value: none
      evidence: claimed
      note: Servers are ordinary disk-based virtual machines, and each brigade's database is a file on its control server.
      sources: [stats-doc, disk-fix]
    hosting:
      value: null
      note: >-
        It runs the servers itself as virtual machines, and its deployment scripts target Wolkee's VMware
        cloud, but it doesn't say where the live ones run.
      sources: [audit-2023, deploy-providers]
    virtual_locations:
      value: null
      grade: na
      note: You can't pick a location and it doesn't claim any, so there's nothing to fake.
      sources: [profile, audit-2023]
    servers:
      value: null
      note: Brigades share pairs of virtual servers in its data centres, and no total is published.
      sources: [audit-2023, profile]
    countries:
      value: null
      note: It doesn't say which countries its servers are in.
      sources: [profile]

  features:
    connections:
      value: 250
      note: A brigadier can hand out configs to up to 250 friends and family, one each.
      sources: [profile, user-limits]
    multihop: false
    obfuscation:
      value: [amneziawg, shadowsocks, v2ray]
      note: V2Ray here is VLESS with Reality. OpenVPN can also be wrapped in Cloak.
      sources: [protocols-code, bot-texts]
    port_forwarding:
      value: false
      note: Not offered, and BitTorrent traffic is blocked.
      sources: [wg-template]
    split_tunnel:
      value: null
      grade: na
      note: It has no apps of its own, so this is down to the client you use.
      sources: [bot-texts]
    blocking:
      value: []
      sources: [dnsmasq, wg-mng]

  clients:
    platforms:
      value: []
      note: >-
        Configs come from a Telegram bot and go into WireGuard, Outline, AmneziaVPN or a Reality client.
        Brigadiers manage users through a web page reached over the VPN.
      sources: [bot-texts]
    open_source:
      value: null
      grade: na
      note: It has no apps of its own. Its server and bot code is published under MPL-2.0.
      sources: [github]
    telemetry:
      value: null
      grade: na
      note: It has no apps of its own, though the privacy policy lists app usage metrics and Google Analytics.
      sources: [policy]
    trackers:
      value: null
      grade: na
      note: It has no Android app of its own.
      sources: [profile]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 0, currency: EUR }
      note: Free, with no paid plan.
      sources: [iedn-project]
    best:
      value: { amount: 0, currency: EUR }
      sources: [iedn-project]
    best_term:
      value: null
      grade: na
      note: It's free.
      sources: [iedn-project]
    renewal_increase:
      value: 0
      note: Nothing renews.
      sources: [iedn-project]
    free_tier:
      value: true
      sources: [iedn-project, bot-texts]
    refund_days:
      value: null
      grade: na
      note: It's free.
      sources: [iedn-project]

  ethics:
    misleading_claims:
      value: true
      note: >-
        The institute's site says no logging and that it stores zero, while its own server code logs
        destinations and real IP addresses, and the privacy policy lists both.
      sources: [iedn-project, iedn-home, wg-template, wg-lea-rev, policy]
    affiliates: false
    review_sites: false
    activism:
      value: true
      note: It's a non-profit anti-censorship project aimed at people in Russia and other censored countries.
      sources: [home, profile, iedn-institute]
  other:
    concerns:
      value:
        - summary: >-
            Signup is through a Telegram bot, so the VPN is tied to your Telegram account, and Telegram can
            see that you use it. Friends you invite only get a config file.
          severity: minor
          source: bot-welcome

