# yaml-language-server: $schema=https://fineprint.peng.ly/schema/provider.json
name: Melon VPN
icon: melon-vpn.png
checked: 2026-11-03

criteria:
  identity:
    website:
      value: https://vpnmelon.com
      sources: [home, play]
    legal_entity:
      value: Wildlook Tech Pte. Ltd.
      note: >-
        The Google Play developer and App Store seller, registered in Singapore in 2016. The policy and
        terms only say the company is registered in Singapore, without naming it.
      sources: [register-wildlook, play, app-store, privacy]
    owner:
      value: null
      note: It isn't public who owns Wildlook Tech. Its Google Play contact number is a Hong Kong one.
      sources: [register-wildlook, play]
    founded:
      value: 2018
      note: Its Google Play listing says it has worked since 2018, and the Android app had over a million installs by April 2019.
      sources: [play, play-2019]
    team:
      value: anonymous
      note: No one is named as running it.
      sources: [faq, play]
    sister_brands:
      value: [VPN Inf, MATE VPN, XY VPN, Global VPN, Super Z VPN, 3X VPN, VPN ProMaster]
      note: >-
        VPN Inf shares its Google Play developer account. 2025 research found it shares code and servers
        with XY VPN and Global VPN from Matrix Mobile, which also publishes MATE VPN, and with Super Z VPN,
        3X VPN, VPN ProMaster and a Touch VPN that isn't Pango's.
      sources: [play-dev, hidden-links-2025, play-mate]
    acquisitions:
      value: null
      note: >-
        The App Store seller was Lanpiper Pte. Ltd. until at least December 2020 and Wildlook Tech by July
        2022. Lanpiper has since been struck off, and the Android app still uses a lanpiper.net backup
        server. Whether the change was a sale isn't public.
      sources: [app-store-2020, app-store-2022, register-lanpiper, apk]

  jurisdiction:
    hq:
      value: SG
      sources: [register-wildlook, play]
    entities:
      value: [SG]
      note: The earlier App Store seller, Lanpiper Pte. Ltd., was also a Singapore company.
      sources: [register-wildlook, register-lanpiper]

  logging:
    traffic:
      value: none
      evidence: claimed
      note: The policy Google Play links for the Android app is a short generic one that doesn't mention VPN traffic.
      sources: [privacy, terms, policy-android]
    dns:
      value: none
      evidence: claimed
      sources: [privacy, terms]
    timestamps:
      value: none
      evidence: claimed
      note: The terms add that it logs server access attempts for security and troubleshooting, without saying what that covers.
      sources: [privacy, terms]
    bandwidth:
      value: null
      note: Neither the policy nor the terms say whether data use is recorded, though the fair use rules let it suspend users who consume excessive bandwidth.
      sources: [privacy, terms]
    source_ip:
      value: null
      note: >-
        The policy says it doesn't keep IP addresses, but the App Store privacy label says the iPhone app
        collects location data and may use it to track you across other companies' apps.
      sources: [privacy, app-store]
    proven: []
    policy: https://vpnmelon.com/privacy_policy

  transparency:
    audits: []
    report: none
    canary: none
    bug_bounty: false
    incidents:
      value: []
      grade: ok
      note: >-
        In 2025 researchers found the Android app connected with Shadowsocks passwords hard-coded in its
        code and shared across a family of apps, which they warned lets an eavesdropper decrypt traffic. No
        response or fix from the company is on record, so it's graded ok rather than good.
      sources: [hidden-links-2025]

  account:
    email:
      value: none
      note: There are no accounts. On iOS an optional Sign in with Apple shares a subscription across two devices.
      sources: [faq, privacy]
    personal_data: []
    payment:
      value: [app_store]
      note: Only through the App Store and Google Play.
      sources: [pricing]

  security:
    protocols:
      value: [other]
      note: >-
        Shadowsocks. Its site calls the protocol Melon-Link, its own, but the Android app is a
        shadowsocks-android build running shadowsocks-rust.
      sources: [apk, protocol]
    post_quantum:
      value: none
      note: Shadowsocks uses a shared password rather than a key exchange.
      sources: [apk]
    kill_switch:
      value: null
      note: The Android app has no kill switch setting.
      sources: [apk]
    dns:
      value: null
      note: It doesn't say whose DNS servers answer inside the tunnel.
      sources: [safety, faq]

  infra:
    ram_only:
      value: null
      note: It doesn't say how its servers are run.
    hosting:
      value: rented
      note: 2025 research found every server in its family of apps at one hosting company, GTHost.
      sources: [hidden-links-2025]
    virtual_locations:
      value: null
      note: It doesn't say whether any locations are virtual.
      sources: [faq]
    servers:
      value: 631
      note: 2025 research found 33 servers built into the Android app.
      sources: [faq, hidden-links-2025]
    countries:
      value: null
      note: It claims more than 100 regions, without giving a country count.
      sources: [faq]

  features:
    connections:
      value: null
      note: >-
        The pricing page says one subscription covers all supported devices, while the policy and terms
        allow two iOS devices through Sign in with Apple.
      sources: [pricing, privacy, terms]
    multihop:
      value: false
      note: Its protocol page says traffic can go through a relay when the direct path is blocked, which it picks itself rather than offering as a setting.
      sources: [protocol]
    obfuscation:
      value: [shadowsocks]
      note: Shadowsocks is its only protocol, and is built to get past network blocks.
      sources: [apk, safety]
    port_forwarding: false
    split_tunnel:
      value: true
      note: By app.
      sources: [faq, play]
    blocking: []

  clients:
    platforms:
      value: [ios, android]
      note: The iPhone app also runs on Apple silicon Macs. There are no desktop apps or browser extensions.
      sources: [download, app-store]
    open_source:
      value: none
      note: The Android app is built on the open source shadowsocks-android and shadowsocks-rust, but its own code isn't published.
      sources: [apk]
    telemetry:
      value: null
      note: >-
        The Android app carries Firebase Analytics and Crashlytics, and the site lists crash
        diagnostics among what it collects. Neither says whether you can opt out.
      sources: [apk, safety, play-data-safety]
    fdroid: false

  pricing:
    monthly:
      value: { amount: 9.99, currency: USD }
      sources: [pricing]
    best:
      value: { amount: 4.17, currency: USD }
      note: >-
        $49.99 a year. There's also a $4.99 weekly plan, and the App Store lists discounted yearly plans
        from $29.99 and a $99.99 lifetime one.
      sources: [pricing, app-store]
    best_term:
      value: 12
      sources: [pricing]
    renewal_increase:
      value: 0
      sources: [pricing]
    free_tier:
      value: true
      note: Ad-supported on Android, with sessions limited in time and extended by watching ads.
      sources: [faq, safety]
    refund_days:
      value: null
      note: Payments go through Apple and Google, so refunds follow their rules.
      sources: [pricing]

  ethics:
    misleading_claims:
      value: true
      note: >-
        It sells Melon-Link as its own in-house protocol while the Android app runs Shadowsocks, and the App
        Store listing promises "Totally NO ADS SDK" while its privacy label lists data used to track you.
      sources: [protocol, apk, app-store]
    affiliates: false
    review_sites: false
    activism: false

